============================================================================
 CC01 Customer Portal v1.0 — หน้าเลือกสินค้าสำหรับลูกค้า (ไฟล์เดียว)
 ----------------------------------------------------------------------------
 ใช้ได้ทุกแพลตฟอร์ม: มือถือ / แท็บเล็ต / เดสก์ท็อป และ in-app browser (LINE, Facebook, Instagram)
   · ไม่พึ่ง CDN / ฟอนต์ / ไลบรารีภายนอก  · JavaScript ระดับ ES5 (Android WebView เก่า, iOS Safari เก่า)
   · ไม่ใช้ popup / window.open / clipboard API เป็นข้อบังคับ  · localStorage ใช้ไม่ได้ → ถอยไปใช้หน่วยความจำ
   · ปุ่มสัมผัส ≥ 44px, ช่องกรอก ≥ 16px (iOS ไม่ซูมเอง), รองรับ safe-area (iPhone notch)

 โหมดทำงาน (ตั้งที่ CONFIG.API_BASE ด้านล่าง)
   ''            = โหมดจำลองในเครื่อง: อ่านลิงก์/แคตตาล็อกที่ BD02 เผยแพร่ใน localStorage แล้วเขียนร่างเข้า BD02/CC01
                   (ต้องเปิดจาก origin เดียวกับ BD02 เช่น http://localhost:8000/CC01_Portal.html?t=TOKEN)
   'https://…'   = โหมด Gateway จริง: เรียก API ตามสัญญาข้างล่าง (Developer ทำฝั่งเซิร์ฟเวอร์)

 สัญญา API สำหรับ Gateway (JSON, UTF-8, CORS อนุญาตเฉพาะโดเมน portal)
   GET  {API}/session?t=TOKEN        → { ok:true, customer:{ name }, expiresAt:ISO, remaining:int }
                                        { ok:false, error:'INVALID'|'EXPIRED'|'REVOKED'|'LIMIT' }
   GET  {API}/catalog?t=TOKEN        → { ok:true, builtAt:ISO, items:[ { sku, name, category, emoji, images:[url|dataURL],
                                        price:number|null, currency, unit, packSize, avail:'IN'|'LOW'|'PRE'|'' } ] }
                                        ** ห้ามส่งตัวเลขสต็อก/จอง/ราคาต้นทุน — avail เป็นสถานะเท่านั้น **
   POST {API}/orders                 body { t, idempotencyKey, items:[{sku,qty}], note, hp }
                                      → { ok:true, key } | { ok:false, error:'INVALID'|'EXPIRED'|'REVOKED'|'LIMIT'|'BAD_ITEMS'|'RATE' }
                                        เซิร์ฟเวอร์ต้อง: ตรวจ token, ตรวจ sku/qty ซ้ำ, จำกัดจำนวนครั้ง/อัตรา, ปฏิเสธถ้า hp ไม่ว่าง,
                                        กันซ้ำด้วย idempotencyKey แล้วส่งต่อเป็น CC01.ORDER.DRAFT (source:'CATALOG', picker:'customer')
   GET  {API}/orders/KEY?t=TOKEN     → { ok:true, status:'SENT'|'RECEIVED'|'CREATED'|'REJECTED', mode?:'preorder', sbo_number?, reason? }
   --- v1.1 : ติดตามคำสั่งซื้อ + เซ็นรับสินค้า (ePOD) — เหมือนแอปสั่งอาหาร ---
   GET  {API}/my-orders?t=TOKEN      → { ok:true, builtAt:ISO, orders:[ {
                                          no, createdAt, updatedAt, stage:'ORDERED|PRODUCTION|WAREHOUSE|PREPARING|DISPATCHED|SHIPPING|ARRIVED|DELIVERED|CANCELLED', label,
                                          items:[{sku,name,qty,uom}], cur:int, steps:[{label,state:'done|now|todo',at}],
                                          delivery:null | { toNo, status, th, plate, driver(ชื่อต้น), dueText, lines:[{idx,code,name,qty,unit}],
                                                            history:[{at,th}], podNo, podStatus, receivedAt, receiver,
                                                            epod:null|{state:'PENDING|ACCEPTED|REJECTED',at,reason}, canSign:bool } } ] }
                                        ** เฉพาะคำสั่งซื้อของลูกค้าที่ผูกกับ token · ห้ามมีราคา/ต้นทุน/Lot/บันทึกภายใน **
                                        ** ใช้งานได้แม้ลิงก์ใช้ครบจำนวนครั้งสั่งซื้อแล้ว (ดูสถานะ/เซ็นรับไม่นับโควตา) **
   ** session.verify = 'PHONE'|'STAFF' — 'STAFF' = พนักงานยืนยันตัวผู้เซ็นในแชทแล้ว (ลูกค้าเปลี่ยนเบอร์) ไม่ต้องส่ง verifyPhone; เซิร์ฟเวอร์ต้องบันทึก verify/verifiedBy ลง inbox ด้วย **
   ** ยืนยันตัวตนก่อนเซ็น: verifyPhone = เบอร์ที่ลงทะเบียนกับร้าน (ทะเบียนลูกค้า BD02 / ผู้ติดต่อในแชท) — เซิร์ฟเวอร์เทียบ 9 หลักท้าย,
      จำกัดลองผิด 5 ครั้ง/ล็อก 15 นาที/ลิงก์ · error: PHONE_MISMATCH | PHONE_LOCKED | NO_PHONE_ON_FILE · เซ็นได้เมื่อ delivery.status = 'Arrived' เท่านั้น **
   (โหมดจำลอง: Portal สร้างรายการคำสั่งซื้อเองจาก localStorage (SBO/LG02) จึงอัปเดตสถานะขนส่ง/ePOD ได้แม้ปิด BD02;
    สถานะฝั่ง SBO จะเปลี่ยนเมื่อเปิด BD02 · โหมด Gateway จริง เซิร์ฟเวอร์สร้างข้อมูลชุดเดียวกัน)
   --- v1.2 : ลิงก์ "ระบุตัวเอง" (ส่งเข้าแชทที่ยังไม่ผูกรหัสลูกค้า / บอตส่งให้) ---
   session.identify = true เมื่อ token ยังไม่ผูกรหัสลูกค้า → ตะกร้าต้องกรอก ชื่อ + เบอร์โทร แล้ว POST {API}/orders ส่ง identity:{name,phone} เพิ่ม
     เซิร์ฟเวอร์: เบอร์ตรงทะเบียนลูกค้า "รายเดียว" → draft.customer = {code, name, phone, idVia:'PHONE'} · ไม่พบ/ซ้ำหลายราย → {code:'', name, phone, idVia:'NEW'}
     (ฝั่ง BD02 พนักงานต้องผูกรหัส/ลงทะเบียนก่อนอนุมัติ · ห้ามเปิดเผยข้อมูลทะเบียนลูกค้าให้ผู้กรอกเห็น)
     GET /my-orders ของ token ที่ยังไม่ผูกรหัส → { ok:true, orders:[], locked:true } (ติดตาม/เซ็นรับได้หลังพนักงานผูกรหัสแล้วเท่านั้น — เบอร์ที่กรอกเองไม่พอ)
   POST {API}/epod                   body { t, idempotencyKey, hp, verifyPhone, receiver:{name,phone}, signature:'data:image/png;base64,…', note,
                                           orders:[ { no, toNo, lines:[ { idx, accepted } ] } ] }
                                      → { ok:true, results:[ { no, ok:true, key } | { no, ok:false, error } ] }
                                        เซิร์ฟเวอร์ต้อง: ตรวจ token → คำสั่งซื้อต้องเป็นของลูกค้าราย token, ตรวจ canSign ซ้ำ, คำนวณ rejected = qty − accepted เอง,
                                        จำกัดขนาดลายเซ็น, กันซ้ำด้วย idempotencyKey(+no), 1 ePOD ที่รอยืนยันต่อใบงาน แล้วเขียนเข้า inbox ของ LG02
                                        (ePOD = หลักฐานเบื้องต้น จนกว่าเจ้าหน้าที่ LG02 ตรวจและบันทึก POD)
============================================================================

      if (!S.sg) return; S.sg.busy = false; b.disabled = false; b.textContent = '✍️ ยืนยันการเซ็นรับ';
      if (e) return bad(ERR[e] || ERR.NET);
      var res = (r && r.results) || [], fails = [], i, okN = 0;
      for (i = 0; i < res.length; i++) { if (res[i].ok) { okN++; delete S.sel[res[i].no]; } else fails.push(res[i].no + ': ' + (ERR[res[i].error] || res[i].error)); }
      if (fails.length) { bad((okN ? 'เซ็นสำเร็จ ' + okN + ' ใบ · ' : '') + 'ไม่สำเร็จ — ' + fails.join(' · ')); loadOrders(); return; }
      closeSign(); toast('✅ ส่งลายเซ็น ' + okN + ' ใบแล้ว — รอทีมงานขนส่งยืนยัน'); loadOrders(function () { if (S.view === 'orders') updOBar(); });
    });
  }

  /* ───────── การทำงาน ───────── */
  function boot() {
    S.view = 'loading'; render();
    if (!TOKEN) { S.err = 'INVALID'; S.view = 'error'; return render(); }
    API.session(function (e, s) {
      if (e) { S.err = e; S.view = 'error'; return render(); }
      S.sess = s; S.idn = s.idn || sget(IDN_K, null); S.locked = !!s.identify;
      API.catalog(function (e2, c) {
        if (e2 && (qs('v') === 'orders' || s.trackOnly) && e2 === 'NO_CATALOG') { c = { items: [] }; e2 = null; }
        if (e2) { S.err = e2; S.view = 'error'; return render(); }
        var i; S.items = c.items || []; S.by = {}; for (i = 0; i < S.items.length; i++) S.by[S.items[i].sku] = S.items[i];
        loadCart(); S.view = S.tab = (qs('v') === 'claim' && !s.identify ? 'claim' : (qs('v') === 'orders' || s.trackOnly ? 'orders' : 'shop')); if (S.view === 'claim') loadClaims(); render(); afterBoot();
      });
    });
  }
  function afterBoot() {
    loadOrders(function () { var o = qs('o'); if (o && ordBy(o.toUpperCase())) { if (S.view !== 'orders') { S.tab = S.view = 'orders'; render(); } openDetail(o.toUpperCase()); } });
    startOrdPoll();
  }
  function startPoll() {
    stopPoll();
    function tick() {
      if (!S.done) return;
      API.status(S.done.key, function (e, r) { if (e || !r) return; S.done.status = r.status; S.done.mode = r.mode; S.done.sbo_number = r.sbo_number; S.done.reason = r.reason; if (S.view === 'done') render(); });
    }
    tick(); S.poll = setInterval(tick, CONFIG.POLL_MS);
  }
  function stopPoll() { if (S.poll) { clearInterval(S.poll); S.poll = null; } }
  function send() {
    if (S.sending || !cartCount()) return;
    var noteEl = $('note'); if (noteEl) S.note = noteEl.value; var hp = $('hp') ? $('hp').value : '';
    var items = [], k; for (k in S.cart) { if (S.cart.hasOwnProperty(k) && S.by[k]) items.push({ sku: k, qty: S.cart[k] }); }
    if (!S.idem) S.idem = 'I' + Date.now().toString(36) + rnd(6);   /* กดซ้ำ/เน็ตหลุดแล้วส่งใหม่ = idempotencyKey เดิม */
    var idn = null;
    if (S.sess && S.sess.identify) {
      var inn = String(S.idn && S.idn.name || '').replace(/^\s+|\s+$/g, ''), inp = String(S.idn && S.idn.phone || '').replace(/^\s+|\s+$/g, '');
      if (!inn) { S.sendErr = ERR.ID_NAME; return rerenderCart(); }
      if (SIM.phoneNorm(inp).length < 9) { S.sendErr = ERR.ID_PHONE; return rerenderCart(); }
      idn = { name: inn, phone: inp }; sset(IDN_K, idn);
    }
    S.sending = true; S.sendErr = ''; rerenderCart();
    API.submit({ idempotencyKey: S.idem, items: items, note: S.note, hp: hp, identity: idn }, function (e, r) {
      S.sending = false;
      if (e) { S.sendErr = ERR[e] || ERR.NET; return rerenderCart(); }
      S.done = { key: r.key, status: 'SENT' }; S.cart = {}; S.note = ''; S.cartOpen = false; S.idem = ''; saveCart(); S.view = 'done'; render(); startPoll();
    });
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target; while (t && t !== document && !(t.getAttribute && t.getAttribute('data-act'))) t = t.parentNode;
    if (!t || t === document) return;
    var a = t.getAttribute('data-act'), sku = t.getAttribute('data-sku');
    if (a === 'inc' || a === 'cinc') { setQty(sku, qtyOf(sku) + 1); S.cartOpen && a === 'cinc' ? rerenderCart() : renderGrid(); }
    else if (a === 'dec' || a === 'cdec') { setQty(sku, qtyOf(sku) - 1); S.cartOpen && a === 'cdec' ? rerenderCart() : renderGrid(); }
    else if (a === 'rm') { setQty(sku, 0); rerenderCart(); }
    else if (a === 'cat') { S.cat = t.getAttribute('data-c') || ''; renderGrid(); }
    else if (a === 'img') { S.img[sku] = +t.getAttribute('data-i'); renderGrid(); }
    else if (a === 'openCart') { S.cartOpen = true; S.sendErr = ''; render(); }
    else if (a === 'closeCart') { var ne = $('note'); if (ne) S.note = ne.value; saveCart(); S.cartOpen = false; render(); }
    else if (a === 'send') send();
    else if (a === 'again') { stopPoll(); S.done = null; S.view = 'shop'; render(); }
    else if (a === 'retry') boot();
    else if (a === 'tab') setTab(t.getAttribute('data-v'));
    else if (a === 'toOrders') { stopPoll(); S.done = null; setTab('orders'); }
    else if (a === 'open') openDetail(t.getAttribute('data-no'));
    else if (a === 'closeDetail') closeDetail();
    else if (a === 'sel') { S.sel[t.getAttribute('data-no')] = !!t.checked; updOBar(); }
    else if (a === 'signSel') openSign(selList());
    else if (a === 'signOne') openSign([t.getAttribute('data-no')]);
    else if (a === 'closeSign') closeSign();
    else if (a === 'sgClear') clearSig();
    else if (a === 'sgSend') sgSend();
  }, false);
  document.addEventListener('change', function (ev) {
    var t = ev.target, a = t && t.getAttribute && t.getAttribute('data-act');
    if (a === 'qty' || a === 'cqty') { setQty(t.getAttribute('data-sku'), t.value); a === 'cqty' ? rerenderCart() : renderGrid(); }
  }, false);
  var qT = null;
  document.addEventListener('input', function (ev) {
    var t = ev.target; if (!t) return;
    if (t.getAttribute && t.getAttribute('data-sg') === 'acc') { var q = parseFloat(t.getAttribute('data-q')), v2 = parseFloat(String(t.value).replace(/,/g, '')), rm = document.querySelectorAll('[data-sg="rem"][data-no="' + t.getAttribute('data-no') + '"][data-i="' + t.getAttribute('data-i') + '"]')[0]; if (rm) rm.className = 'rm2' + (v2 >= 0 && v2 < q ? '' : ' hide'); return; }
    if (t.id === 'q') { if (qT) clearTimeout(qT); var v = t.value; qT = setTimeout(function () { S.q = v; var g = $('grid'); if (g) { var keep = document.activeElement === t; renderGrid(); if (keep) { try { t.focus(); } catch (e) {} } } }, 160); }
    else if (t.id === 'note') { S.note = t.value; }
    else if (t.id === 'idName' || t.id === 'idPhone') { S.idn = S.idn || {}; S.idn[t.id === 'idName' ? 'name' : 'phone'] = t.value; }
  }, false);
  window.addEventListener('storage', function (e) { if (e.key === K.cat && S.view === 'shop' && !CONFIG.API_BASE) { var c = sget(K.cat, null); if (c && c.items) { var i; S.items = c.items; S.by = {}; for (i = 0; i < S.items.length; i++) S.by[S.items[i].sku] = S.items[i]; if (!S.cartOpen) renderGrid(); } } }, false);

  boot();
})();
</script>
</body>
</html>
