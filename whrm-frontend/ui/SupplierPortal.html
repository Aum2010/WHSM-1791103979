<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Supplier Corrective Action Portal</title>
<style>
  :root{--red:#9A0007;--red2:#C8102E;--pale:#FFF1F2;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--ok:#047857;--warn:#b45309;--bg:#f8fafc}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header{background:linear-gradient(90deg,var(--red),var(--red2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:17px} header small{opacity:.85;display:block;font-size:12px}
  main{max-width:880px;margin:18px auto;padding:0 14px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h2{margin:0 0 10px;font-size:14px;color:var(--red);display:flex;align-items:center;gap:8px}
  .step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;align-items:center;justify-content:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .kv label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .kv div{font-weight:600;word-break:break-word}
  label.f{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:#334155}
  input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;font:inherit;background:#fff}
  textarea{min-height:64px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid #fecaca;border-color:var(--red2)}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
  .btn.sec{background:#fff;color:var(--red);border:1px solid #fca5a5}.btn.gray{background:#e2e8f0;color:#334155}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
  .c-ok{background:#ecfdf5;color:var(--ok);border-color:#a7f3d0}.c-warn{background:#fffbeb;color:var(--warn);border-color:#fde68a}.c-bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.c-info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
  .cats label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:13px}
  .note{font-size:12px;color:var(--mut)} .err{color:#b91c1c;font-size:12px;margin-top:6px;white-space:pre-line}
  .tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px} .tl div{margin-bottom:8px;font-size:13px}.tl small{color:var(--mut);display:block}
  .banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}
  .ro{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
  .hidden{display:none!important}
  .files span{display:inline-flex;gap:6px;align-items:center;background:#f1f5f9;border-radius:8px;padding:3px 8px;margin:2px;font-size:12px}
  .files b{cursor:pointer;color:#b91c1c}
</style>
</head>

<main id="app"><div class="card">กำลังโหลด…</div></main>
<script>

  /* โหมด API: ดึงเหตุการณ์ใหม่ (ฝั่งภายใน = ทั้งหมดตั้งแต่ cursor · ฝั่งพอร์ทัล = เฉพาะเคส+โทเคน) */
  function pull(opt) {

    var url = portal ? (c.apiUrl + '/portal/events?case=' + encodeURIComponent(opt.caseId) + '&token=' + encodeURIComponent(opt.token)) : (c.apiUrl + '/events?since=' + cur);
    var h = {}; if (!portal && c.apiKey) h['X-Api-Key'] = c.apiKey;

(function () {
  'use strict';

  if (API) SPS.setCfg({ transport: 'API', apiUrl: API });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  }
  function boot() {
    var go = function () { try { var act = document.activeElement; if (act && /^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName) && act.id !== 'f-file') return; render(); } catch (e) { app.innerHTML = '<div class="card">เกิดข้อผิดพลาดในการแสดงผล: ' + esc(e.message) + '</div>'; } };
    SPS.subscribe(go);
    var poll = function () { SPS.pull({ portal: true, caseId: CASE, token: TOKEN }).then(function (r) { if (r && r.added) go(); }); };
    if (SPS.cfg().transport === 'API') { poll(); setInterval(poll, 5000); } else go();
    setTimeout(go, 600); render();
  }
  window.SupplierPortal = { render: render, state: function () { return getCase(); }, store: SPS };
  boot();
})();
</script>
</body>
