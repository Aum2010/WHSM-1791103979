  const list = getTransfers(); list.push(tr); U.wr(K.TRANS, list);
  const assets = getAssets(); const idx = assets.findIndex(a=>a.id===assetId);
  if (idx>=0){ assets[idx].location = toLoc; assets[idx].updatedAt = new Date().toISOString(); U.wr('fa_assets_v1', assets); }
  document.getElementById('faTransferModal').remove(); refresh(); U.toast('โอนย้ายแล้ว','success');
}

function openReval(){
  const assets = getAssets().filter(a=>a.status==='active');
  if (!assets.length){ U.toast('ไม่มีสินทรัพย์','warn'); return; }
  modalWrap('faRevalModal','<i class="fa-solid fa-arrow-up text-emerald-400 mr-2"></i>ตีราคาใหม่',
    `<div><label class="block text-xs text-slate-400 mb-1">สินทรัพย์ *</label><select id="rAsset" onchange="__faAdj.onRevalAssetChange()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">${assets.map(a=>`<option value="${a.id}" data-cost="${a.acquisitionCost}" data-name="${U.esc(a.name)}" data-code="${U.esc(a.code||'')}">${U.esc(a.code||'')} — ${U.esc(a.name)} (฿${U.fmt(a.acquisitionCost)})</option>`).join('')}</select></div>
     <div><label class="block text-xs text-slate-400 mb-1">วันที่ *</label><input id="rDate" type="date" value="${U.todayISO()}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div>
     <div class="grid grid-cols-2 gap-3"><div><label class="block text-xs text-slate-400 mb-1">เดิม</label><input id="rOld" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400 font-mono text-right"></div>
     <div><label class="block text-xs text-slate-400 mb-1">ใหม่ *</label><input id="rNew" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div></div>
     <div><label class="block text-xs text-slate-400 mb-1">บัญชี Revaluation Surplus (OCI)</label><input id="rGlOci" value="3200" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></div>
     <div><label class="block text-xs text-slate-400 mb-1">บัญชี Gain/Loss (ถ้าลด)</label><input id="rGlPl" value="4990" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></div>`,
    '__faAdj.saveReval()');
  setTimeout(()=>onRevalAssetChange(), 50);
}

function onRevalAssetChange(){
  const sel = document.getElementById('rAsset'); if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('rOld').value = U.fmt(opt.getAttribute('data-cost'));
  document.getElementById('rNew').value = U.num(opt.getAttribute('data-cost'));
}

function saveReval(){
  const sel = document.getElementById('rAsset'); const opt = sel.options[sel.selectedIndex];
  const assetId = sel.value, date = document.getElementById('rDate').value;
  const newVal = U.num(document.getElementById('rNew').value), oldVal = U.num(opt.getAttribute('data-cost'));
  if (!date||newVal<=0){ U.toast('กรอกให้ครบ','warn'); return; }
  const adj = newVal - oldVal;
  const assets = getAssets(); const asset = assets.find(a=>a.id===assetId); if (!asset) return;
  const lines = [];
  if (adj > 0){ lines.push({account: asset.glAssetAccount||'1410', description:'Reval '+asset.name, debit: adj, credit:0}); lines.push({account: document.getElementById('rGlOci').value, description:'Reval surplus', debit:0, credit: adj}); }
  else if (adj < 0){ lines.push({account: document.getElementById('rGlPl').value, description:'Reval loss', debit: Math.abs(adj), credit:0}); lines.push({account: asset.glAssetAccount||'1410', description:'Reval', debit:0, credit: Math.abs(adj)}); }
  const je = lines.length ? { id: U.uid('je'), date, ref:'REVAL-'+(asset.code||asset.id), description:'ตีราคา '+asset.name, status:'POSTED', source:'ASSETS-REVAL', lines: lines.map(l=>({...l, debit: Math.round(l.debit*100)/100, credit: Math.round(l.credit*100)/100})) } : null;
  const jeId = je ? U.postJE(je) : null;
  const reval = { id: U.uid('reval'), assetId, assetCode: opt.getAttribute('data-code'), assetName: opt.getAttribute('data-name'), revalDate: date, oldValue: oldVal, newValue: newVal, adjustment: adj, jeId, revaluedAt: new Date().toISOString() };
  const list = getRevals(); list.push(reval); U.wr(K.REVAL, list);
  const idx = assets.findIndex(a=>a.id===assetId);
  if (idx>=0){ assets[idx].acquisitionCost = newVal; assets[idx].updatedAt = new Date().toISOString(); U.wr('fa_assets_v1', assets); }
  document.getElementById('faRevalModal').remove(); refresh(); U.toast('ตีราคาแล้ว'+(jeId?' (JE)':''),'success');
}

function openImpair(){
  const assets = getAssets().filter(a=>a.status==='active');
  if (!assets.length){ U.toast('ไม่มีสินทรัพย์','warn'); return; }
  modalWrap('faImpairModal','<i class="fa-solid fa-arrow-down text-rose-400 mr-2"></i>ตัดค่าเสื่อม',
    `<div><label class="block text-xs text-slate-400 mb-1">สินทรัพย์ *</label><select id="iAsset" onchange="__faAdj.onImpairAssetChange()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">${assets.map(a=>`<option value="${a.id}" data-cost="${a.acquisitionCost}" data-name="${U.esc(a.name)}" data-code="${U.esc(a.code||'')}">${U.esc(a.code||'')} — ${U.esc(a.name)} (฿${U.fmt(a.acquisitionCost)})</option>`).join('')}</select></div>
     <div><label class="block text-xs text-slate-400 mb-1">วันที่ *</label><input id="iDate" type="date" value="${U.todayISO()}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div>
     <div class="grid grid-cols-2 gap-3"><div><label class="block text-xs text-slate-400 mb-1">Book ก่อน</label><input id="iBook" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400 font-mono text-right"></div>
     <div><label class="block text-xs text-slate-400 mb-1">Recoverable *</label><input id="iRecover" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div></div>
     <div><label class="block text-xs text-slate-400 mb-1">บัญชีขาดทุน</label><input id="iGlLoss" value="5920" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></div>
     <div><label class="block text-xs text-slate-400 mb-1">บัญชี Accum Impairment</label><input id="iGlAccum" value="1428" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></div>`,
    '__faAdj.saveImpair()');
  setTimeout(()=>onImpairAssetChange(), 50);
}

function onImpairAssetChange(){
  const sel = document.getElementById('iAsset'); if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('iBook').value = U.fmt(opt.getAttribute('data-cost'));
  document.getElementById('iRecover').value = U.num(opt.getAttribute('data-cost'));
}

function saveImpair(){
  const sel = document.getElementById('iAsset'); const opt = sel.options[sel.selectedIndex];
  const assetId = sel.value, date = document.getElementById('iDate').value;
  const recoverable = U.num(document.getElementById('iRecover').value), bookBefore = U.num(opt.getAttribute('data-cost'));
  if (!date||recoverable<0||recoverable>=bookBefore){ U.toast('Recoverable ต้องน้อยกว่า Book','warn'); return; }
  const loss = bookBefore - recoverable;
  const assets = getAssets(); const asset = assets.find(a=>a.id===assetId); if (!asset) return;
  const je = { id: U.uid('je'), date, ref:'IMPAIR-'+(asset.code||asset.id), description:'ด้อยค่า '+asset.name, status:'POSTED', source:'ASSETS-IMPAIR',
    lines: [{account: document.getElementById('iGlLoss').value, description:'Impairment '+asset.name, debit: Math.round(loss*100)/100, credit:0},
            {account: document.getElementById('iGlAccum').value, description:'Accum impair', debit:0, credit: Math.round(loss*100)/100}] };
  const jeId = U.postJE(je);
  const impair = { id: U.uid('impair'), assetId, assetCode: opt.getAttribute('data-code'), assetName: opt.getAttribute('data-name'), impairDate: date, bookBefore, recoverableAmount: recoverable, lossAmount: loss, jeId, impairedAt: new Date().toISOString() };
  const list = getImpairs(); list.push(impair); U.wr(K.IMPAIR, list);
  document.getElementById('faImpairModal').remove(); refresh(); U.toast('บันทึกแล้ว'+(jeId?' (JE)':''),'success');
}

function boot(){
  U.hookPage('asset-adj', render);
  setTimeout(()=>{ const p = document.getElementById('page-asset-adj'); if (p && !p.classList.contains('hidden') && !p.querySelector('[data-fa-adj-v3]')) render(p); }, 500);
  console.log('%c[FA-Adj-V3] ✅ '+VER, 'color:#22d3ee;font-weight:bold');
}

window.__faAdj = { version: VER, refresh, setTab, openTransfer, saveTransfer, openReval, saveReval, onRevalAssetChange, openImpair, onImpairAssetChange, saveImpair, delTransfer, delReval, delImpair };
boot();
})();
</script>
<!-- [FA-PHASE3-A-END] -->
 <!-- [FA-PHASE3-B-BEGIN] -->
<script>
(function FA_PHASE3_B(){
'use strict';
const U = window.__FA3;
if (!U) { console.error('[FA-Aging] Requires Phase 3-A first'); return; }
const VER = 'FA-PHASE3-B.1.0.0';
if (window.__faAging) return;
window.__faAging = true;

/* [FA-AGING-FIX] ใช้คีย์เดียวกับหน้า AR/AP หลัก (เดิม AP ชี้ไป fa_ap_invoices_v1 ซึ่งไม่มีใครเขียน → Aging เจ้าหนี้ว่างเสมอ) */
const K = { AR:'fa_ar_invoices_v1', AP:'fa_ap_bills_v1' };
const DEAD_ST = ['CANCELLED','VOID','REJECTED','DRAFT'];
function norm(x, isAR){
  if (!x || typeof x !== 'object') return null;
  return Object.assign({}, x, {
    invoiceNo: x.invoiceNo || x.id,
    partyName: x.partyName || (isAR ? x.customerName : x.supplierName) || x.customerName || x.supplierName || '',
    amount: x.amount != null ? x.amount : x.total,
    isCore: x.amount == null && x.total != null
  });
}
const state = { tab:'ar' };

function getAR(){ return U.rd(K.AR,[]).map(x => norm(x, true)).filter(x => x && DEAD_ST.indexOf(x.status) < 0); }
function getAP(){ return U.rd(K.AP,[]).map(x => norm(x, false)).filter(x => x && DEAD_ST.indexOf(x.status) < 0); }

function agingBucket(days){
  if (days <= 0) return 'current';
  if (days <= 30) return '30';
  if (days <= 60) return '60';
  if (days <= 90) return '90';
  return 'over90';
}

function calcAging(invoices){
  const b = { current:0, 30:0, 60:0, 90:0, over90:0 };
  const today = new Date();
  invoices.forEach(inv => {
    const bal = U.num(inv.amount) - U.num(inv.paidAmount||0);
    if (bal <= 0) return;
    const days = Math.floor((today - new Date(inv.dueDate)) / 86400000);
    b[agingBucket(days)] += bal;
  });
  return b;
}

function render(container){
  const isAR = state.tab==='ar';
  const invoices = isAR ? getAR() : getAP();
  const b = calcAging(invoices);
  const total = Object.values(b).reduce((s,v)=>s+v,0);

  container.innerHTML = `
    <div class="space-y-3" data-fa-aging-v3="1">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 flex items-center gap-3 flex-wrap">
        <i class="fa-solid fa-clock text-cyan-400"></i>
        <span class="text-white font-bold text-sm">Aging Report</span>
        <span class="text-xs text-slate-500 ml-auto">ณ ${U.thDate(U.todayISO())}</span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        ${U.summaryCard('Current', b.current, 'fa-check', 'text-emerald-400', 'ยังไม่ครบกำหนด')}
        ${U.summaryCard('1-30 Days', b[30], 'fa-clock', 'text-yellow-400', 'เลยกำหนด 1-30')}
        ${U.summaryCard('31-60 Days', b[60], 'fa-triangle-exclamation', 'text-orange-400', 'เลยกำหนด 31-60')}
        ${U.summaryCard('61-90 Days', b[90], 'fa-exclamation', 'text-rose-400', 'เลยกำหนด 61-90')}
        ${U.summaryCard('Over 90 Days', b.over90, 'fa-skull-crossbones', 'text-red-500', 'เลยกำหนด >90')}
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="__faAging.setTab('ar')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${isAR?'bg-fa-600 text-white':'bg-slate-800 text-slate-300'}"><i class="fa-solid fa-receipt mr-1"></i>ลูกหนี้ (AR) (${getAR().length})</button>
        <button onclick="__faAging.setTab('ap')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${!isAR?'bg-fa-600 text-white':'bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar mr-1"></i>เจ้าหนี้ (AP) (${getAP().length})</button>
        <span class="ml-auto text-sm font-bold font-mono text-white">รวมค้าง: ${U.fmtAmt(total)}</span>
      </div>
      ${renderTable(invoices, isAR)}
    </div>`;
}

function renderTable(invoices, isAR){
  return `<div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
    <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">
      <h4 class="font-bold text-sm text-white">${isAR?'ลูกหนี้':'เจ้าหนี้'} — รายละเอียด</h4>
      <div class="flex gap-2">
        <button onclick="__faAging.openAdd()" class="px-3 py-1.5 rounded-lg bg-fa-600 hover:bg-fa-500 text-white text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>เพิ่ม</button>
        <button onclick="__faAging.exportCSV()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"><i class="fa-solid fa-download mr-1"></i>CSV</button>
      </div>
    </div>
    ${invoices.length===0?`<div class="p-10 text-center text-slate-500 text-xs"><i class="fa-solid fa-inbox text-3xl mb-2 block opacity-30"></i>ไม่มีข้อมูล</div>`:`
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-900 text-slate-400"><tr>
        <th class="text-left py-2 px-2">เลขที่</th><th class="text-left py-2 px-2">${isAR?'ลูกค้า':'ผู้ขาย'}</th>
        <th class="text-left py-2 px-2">วันที่</th><th class="text-left py-2 px-2">ครบกำหนด</th>
        <th class="text-right py-2 px-2">มูลค่า</th><th class="text-right py-2 px-2">ชำระแล้ว</th>
        <th class="text-right py-2 px-2">คงเหลือ</th><th class="text-center py-2 px-2">อายุ</th><th class="text-center py-2 px-2">Actions</th>
      </tr></thead><tbody>
        ${invoices.map(inv=>{
          const bal = U.num(inv.amount) - U.num(inv.paidAmount||0);
          const days = Math.floor((new Date() - new Date(inv.dueDate)) / 86400000);
          const bucket = agingBucket(days);
          const colors = { current:'text-emerald-400', 30:'text-yellow-400', 60:'text-orange-400', 90:'text-rose-400', over90:'text-red-500' };
          return `<tr class="border-b border-slate-800/60 ${bal<=0?'opacity-50':''}">
            <td class="py-2 px-2 font-mono text-cyan-400">${U.esc(inv.invoiceNo)}</td>
            <td class="py-2 px-2 text-white">${U.esc(inv.partyName)}</td>
            <td class="py-2 px-2 font-mono text-slate-300">${U.thDate(inv.date)}</td>
            <td class="py-2 px-2 font-mono ${days>0?'text-rose-400':'text-slate-300'}">${U.thDate(inv.dueDate)}</td>
            <td class="py-2 px-2 text-right font-mono">${U.fmt(inv.amount)}</td>
            <td class="py-2 px-2 text-right font-mono text-emerald-400">${U.fmt(inv.paidAmount||0)}</td>
            <td class="py-2 px-2 text-right font-mono font-bold ${colors[bucket]}">${U.fmt(bal)}</td>
            <td class="py-2 px-2 text-center ${colors[bucket]} font-bold">${days>0?days+'d':'—'}</td>
            <td class="py-2 px-2 text-center">
              ${bal>0?`<button onclick="__faAging.openPay('${inv.id}')" class="text-emerald-400 hover:text-emerald-300 px-1" title="ชำระ"><i class="fa-solid fa-money-bill"></i></button>`:''}
              <button onclick="__faAging.del('${inv.id}')" class="text-slate-500 hover:text-rose-400 px-1"><i class="fa-solid fa-xmark"></i></button>
            </td>
          </tr>`;
        }).join('')}
      </tbody></table></div>`}
  </div>`;
}

function setTab(t){ state.tab=t; refresh(); }
function refresh(){ const p = document.getElementById('page-aging'); if (p) render(p); }
function getInvoices(){ return state.tab==='ar' ? getAR() : getAP(); }
function rawInvoices(){ return U.rd(state.tab==='ar'?K.AR:K.AP, []); }
function saveInvoices(v){ return U.wr(state.tab==='ar'?K.AR:K.AP, v); }
function del(id){ if(!confirm('ลบ?')) return; saveInvoices(rawInvoices().filter(x=>x.id!==id)); refresh(); }
/* เปิดหน้าต่างของหน้า AR/AP หลัก (บันทึก JE ให้ครบ) แล้วรีเฟรช Aging เมื่อปิดหน้าต่าง */
function watchClose(modalId){
  let n = 0; const t = setInterval(() => { n++; if (!document.getElementById(modalId) || n > 600){ clearInterval(t); refresh(); } }, 400);
}

function openAdd(){
  const isAR = state.tab==='ar';
  const core = isAR ? window.openARInvoiceModal : window.openAPBillModal;
  if (typeof core === 'function'){ core(); watchClose(isAR ? 'arModal' : 'apModal'); return; }
  const m = document.createElement('div');
  m.id = 'faAgingAddModal';
  m.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  m.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800"><h3 class="font-bold text-white">เพิ่ม${isAR?'ลูกหนี้':'เจ้าหนี้'}</h3><button onclick="document.getElementById('faAgingAddModal').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-5 space-y-3">
      <div><label class="block text-xs text-slate-400 mb-1">เลขที่ *</label><input id="agNo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></div>
      <div><label class="block text-xs text-slate-400 mb-1">${isAR?'ลูกค้า':'ผู้ขาย'} *</label><input id="agParty" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div class="grid grid-cols-2 gap-3"><div><label class="block text-xs text-slate-400 mb-1">วันที่ *</label><input id="agDate" type="date" value="${U.todayISO()}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-xs text-slate-400 mb-1">ครบกำหนด *</label><input id="agDue" type="date" value="${U.todayISO()}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div></div>
      <div><label class="block text-xs text-slate-400 mb-1">มูลค่า *</label><input id="agAmount" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div>
    </div>
    <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button onclick="document.getElementById('faAgingAddModal').remove()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">ยกเลิก</button><button onclick="__faAging.saveAdd()" class="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold">บันทึก</button></div>
  </div>`;
  (document.getElementById('modals-container')||document.body).appendChild(m);
}

function saveAdd(){
  const no = document.getElementById('agNo').value.trim(), party = document.getElementById('agParty').value.trim();
  const date = document.getElementById('agDate').value, due = document.getElementById('agDue').value;
  const amount = U.num(document.getElementById('agAmount').value);
  if (!no||!party||!date||!due||amount<=0){ U.toast('กรอกให้ครบ','warn'); return; }
  const list = rawInvoices();
  list.push({ id: U.uid(state.tab), invoiceNo: no, partyName: party, date, dueDate: due, amount, paidAmount: 0, createdAt: new Date().toISOString() });
  saveInvoices(list);
  document.getElementById('faAgingAddModal').remove(); refresh(); U.toast('เพิ่มแล้ว','success');
}

function openPay(id){
  const inv = getInvoices().find(x=>x.id===id); if (!inv) return;
  if (inv.isCore){
    const f = state.tab==='ar' ? window.openARPaymentModal : window.openAPPaymentModal;
    if (typeof f === 'function'){ f(id); watchClose(state.tab==='ar' ? 'arPayModal' : 'apPayModal'); return; }
  }
  const bal = U.num(inv.amount) - U.num(inv.paidAmount||0);
  const amt = prompt(`คงเหลือ: ${U.fmtAmt(bal)}\nระบุจำนวนที่ชำระ:`, bal);
  if (amt === null) return;
  const n = U.num(amt);
  if (n<=0||n>bal+0.01){ U.toast('จำนวนไม่ถูกต้อง','warn'); return; }
  const list = rawInvoices(); const idx = list.findIndex(x=>x.id===id);
  list[idx].paidAmount = U.num(inv.paidAmount||0) + n;

function getRate(currency, period){
  if (currency==='THB') return 1;

<script>
(function FA_PHASE3_D(){
'use strict';
const U = window.__FA3;
if (!U) { console.error('[FA-Reports] Requires Phase 3-A first'); return; }
const VER = 'FA-PHASE3-D.1.0.0';
if (window.__faReports) return;

const state = { tab:'tb', period: U.getCurrentPeriod(), fromPeriod: U.getCurrentPeriod() };

/* [FA-NAMES-FIX] สำรองไว้เมื่อไม่พบบัญชีในผังบัญชีจริง (ชื่อตรงกับผังบัญชีตั้งต้น) — ปกติอ่านชื่อจากผังบัญชีของผู้ใช้โดยตรง */
const ACCOUNT_NAMES = {'1000':'สินทรัพย์','1100':'สินทรัพย์หมุนเวียน','1110':'เงินสดในมือ','1120':'เงินฝากธนาคาร','1130':'ลูกหนี้การค้า','1140':'สินค้าคงเหลือ - วัตถุดิบ','1141':'สินค้าคงเหลือ - ระหว่างผลิต','1142':'สินค้าคงเหลือ - สินค้าสำเร็จรูป','1143':'สินค้าคงเหลือ - บรรจุภัณฑ์','1150':'ค่าใช้จ่ายจ่ายล่วงหน้า','1160':'ภาษีมูลค่าเพิ่ม - ซื้อ (รอเครดิต)','1200':'สินทรัพย์ไม่หมุนเวียน','1210':'ที่ดิน','1220':'อาคารและสิ่งปลูกสร้าง','1230':'เครื่องจักรและอุปกรณ์','1240':'ยานพาหนะ','1250':'อุปกรณ์สำนักงาน','1290':'ค่าเสื่อมราคาสะสม','2000':'หนี้สิน','2100':'หนี้สินหมุนเวียน','2110':'เจ้าหนี้การค้า','2120':'ค่าใช้จ่ายค้างจ่าย','2130':'ภาษีมูลค่าเพิ่ม - ขาย (ค้างชำระ)','2140':'ภาษีหัก ณ ที่จ่ายค้างนำส่ง','2150':'เงินเดือนค้างจ่าย','2200':'หนี้สินไม่หมุนเวียน','2210':'เงินกู้ยืมระยะยาว','3000':'ส่วนของผู้ถือหุ้น','3110':'ทุนจดทะเบียน','3120':'กำไรสะสม','3130':'กำไร (ขาดทุน) งวดปัจจุบัน','4000':'รายได้','4110':'รายได้จากการขาย','4120':'รายได้จากการขายส่งออก','4190':'รายได้อื่น','5000':'ต้นทุนขาย','5110':'ต้นทุนวัตถุดิบ','5120':'ต้นทุนแรงงานทางตรง','5130':'ค่าใช้จ่ายการผลิต','5140':'ต้นทุนบรรจุภัณฑ์','6000':'ค่าใช้จ่ายในการดำเนินงาน','6110':'เงินเดือนและค่าจ้าง','6120':'ค่าน้ำ ค่าไฟ','6130':'ค่าเสื่อมราคา','6140':'ค่าการตลาดและโฆษณา','6150':'ค่าขนส่งและโลจิสติกส์','6160':'ค่าซ่อมแซมและบำรุงรักษา','6170':'ค่าเช่าสำนักงาน','6180':'ค่าที่ปรึกษาและบริการวิชาชีพ','6190':'ค่าใช้จ่ายอื่นๆ'};
let __coaRaw = null, __coaMap = {};
function coaNameMap(){
  try { const raw = localStorage.getItem('fa_coa_v1') || ''; if (raw !== __coaRaw){ __coaRaw = raw; __coaMap = {}; (JSON.parse(raw||'[]')||[]).forEach(a => { if (a && a.code) __coaMap[String(a.code)] = a.name; }); } } catch(e){ __coaMap = {}; }
  return __coaMap;
}
function getAcctName(c){ return coaNameMap()[String(c)] || ACCOUNT_NAMES[c] || c; }
function getAcctType(c){ const s=String(c); return s.startsWith('1')?'asset':s.startsWith('2')?'liability':s.startsWith('3')?'equity':s.startsWith('4')?'revenue':s.startsWith('5')?'expense':'other'; }

function getPeriodJE(period){
  const range = U.getPeriodRange(period);
  return U.getJE().filter(j=>j.status==='POSTED' && j.date>=range.start && j.date<=range.end);
}
function aggregate(jes){
  const map = {};
  jes.forEach(j=>(j.lines||[]).forEach(l=>{
    if (!map[l.account]) map[l.account] = { debit:0, credit:0 };
    map[l.account].debit += U.num(l.debit); map[l.account].credit += U.num(l.credit);
  }));
  return map;
}

function buildTB(period){
  const rows = Object.entries(aggregate(getPeriodJE(period))).map(([acct, v])=>({
    account: acct, name: getAcctName(acct), type: getAcctType(acct), debit: v.debit, credit: v.credit
  })).sort((a,b)=>a.account.localeCompare(b.account));
  const totalDr = rows.reduce((s,r)=>s+r.debit,0);
  const totalCr = rows.reduce((s,r)=>s+r.credit,0);
  return { rows, totalDr, totalCr, diff: totalDr - totalCr };
}

function buildPL(from, to){
  const jes = [];
  let cur = from;
  while (cur <= to){
    jes.push(...getPeriodJE(cur));
    const [y,m] = cur.split('-').map(Number);
    let ny = y, nm = m+1; if (nm>12){ nm=1; ny++; }
    cur = ny+'-'+U.pad2(nm);
    if (jes.length>10000) break;
  }
  const agg = aggregate(jes);
  const revenue = [], expense = [];
  Object.entries(agg).forEach(([acct, v])=>{
    const t = getAcctType(acct);
    if (t === 'revenue') revenue.push({ account: acct, name: getAcctName(acct), amount: v.credit - v.debit });
    else if (t === 'expense') expense.push({ account: acct, name: getAcctName(acct), amount: v.debit - v.credit });
  });
  revenue.sort((a,b)=>a.account.localeCompare(b.account));
  expense.sort((a,b)=>a.account.localeCompare(b.account));
  const totalRev = revenue.reduce((s,r)=>s+r.amount,0);
  const totalExp = expense.reduce((s,r)=>s+r.amount,0);
  return { revenue, expense, totalRev, totalExp, netIncome: totalRev - totalExp };
}

function buildBS(period){
  const end = U.getPeriodRange(period).end;

  const agg = aggregate(allJEs);
  const assets = [], liabilities = [], equity = [];
  Object.entries(agg).forEach(([acct, v])=>{
    const t = getAcctType(acct), bal = v.debit - v.credit;
    if (t === 'asset' && Math.abs(bal)>0.01) assets.push({ account:acct, name:getAcctName(acct), amount: bal });
    else if (t === 'liability' && Math.abs(bal)>0.01) liabilities.push({ account:acct, name:getAcctName(acct), amount: -bal });
    else if (t === 'equity' && Math.abs(bal)>0.01) equity.push({ account:acct, name:getAcctName(acct), amount: -bal });
  });

  if (Math.abs(pl.netIncome)>0.01) equity.push({ account:'3999', name:'กำไร(ขาดทุน)งวดปัจจุบัน', amount: pl.netIncome });
  assets.sort((a,b)=>a.account.localeCompare(b.account));
  liabilities.sort((a,b)=>a.account.localeCompare(b.account));
  equity.sort((a,b)=>a.account.localeCompare(b.account));
  const totalAssets = assets.reduce((s,r)=>s+r.amount,0);
  const totalLiab = liabilities.reduce((s,r)=>s+r.amount,0);
  const totalEquity = equity.reduce((s,r)=>s+r.amount,0);
  return { assets, liabilities, equity, totalAssets, totalLiab, totalEquity, diff: totalAssets - (totalLiab+totalEquity) };
}

          <button onclick="__faReports.exportCSV()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"><i class="fa-solid fa-download mr-1"></i>CSV</button>

function exportCSV(){
  let lines = [];
  if (state.tab==='tb'){ const tb = buildTB(state.period); lines.push('Code,Account,Debit,Credit'); tb.rows.forEach(r=>lines.push([r.account, r.name, r.debit.toFixed(2), r.credit.toFixed(2)].map(x=>`"${String(x||'').replace(/"/g,'""')}"`).join(','))); lines.push(`"","Total",${tb.totalDr.toFixed(2)},${tb.totalCr.toFixed(2)}`); }
  else if (state.tab==='pl'){ const pl = buildPL(state.fromPeriod, state.period); lines.push('Type,Code,Account,Amount'); pl.revenue.forEach(r=>lines.push(['Revenue', r.account, r.name, r.amount.toFixed(2)].map(x=>`"${x}"`).join(','))); pl.expense.forEach(r=>lines.push(['Expense', r.account, r.name, r.amount.toFixed(2)].map(x=>`"${x}"`).join(','))); lines.push(`"","","Net Income",${pl.netIncome.toFixed(2)}`); }
  else { const bs = buildBS(state.period); lines.push('Category,Code,Account,Amount'); bs.assets.forEach(r=>lines.push(['Asset', r.account, r.name, r.amount.toFixed(2)].map(x=>`"${x}"`).join(','))); bs.liabilities.forEach(r=>lines.push(['Liability', r.account, r.name, r.amount.toFixed(2)].map(x=>`"${x}"`).join(','))); bs.equity.forEach(r=>lines.push(['Equity', r.account, r.name, r.amount.toFixed(2)].map(x=>`"${x}"`).join(','))); }
  const blob = new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = state.tab+'_'+state.period+'.csv'; a.click();
  U.toast('Export แล้ว','success');
}

function boot(){

  console.log('%c[FA-Reports-V3] ✅ '+VER, 'color:#22d3ee;font-weight:bold');
}

window.__faReports = { version: VER, refresh, setTab, exportCSV, buildTB, buildPL, buildBS };
boot();
})();

<script>
(function FA_PHASE3_E(){
'use strict';

const WHT_RATES = [
  { code:'PND53_service', rate:3, label:'ค่าบริการ (3%)' },

  { code:'PND53_transport', rate:1, label:'ค่าขนส่ง (1%)' },
  { code:'PND53_advert', rate:2, label:'ค่าโฆษณา (2%)' },
  { code:'PND3_individual', rate:3, label:'บุคคลธรรมดา (3%)' }
];

function getWHT(){ return U.rd(K.WHT, []); }
function setWHT(v){ return U.wr(K.WHT, v); }

function buildVATReturn(period){
  const range = U.getPeriodRange(period);
  const jes = U.getJE().filter(j=>j.status==='POSTED' && j.date>=range.start && j.date<=range.end);
  let outVAT=0, inVAT=0, outCount=0, inCount=0;
  jes.forEach(j=>{
    let hasOut=false, hasIn=false, oDr=0, oCr=0, iDr=0, iCr=0;
    (j.lines||[]).forEach(l=>{
      const a = String(l.account);   /* [FA-VAT-FIX] ภาษีขาย = 2130, ภาษีซื้อ = 1160 ตามผังบัญชี (เดิมอ่าน 2200/2210 ซึ่งเป็นหัวหมวด/เงินกู้ระยะยาว ทำให้ ภ.พ.30 เป็น 0) */
      if (a === '2130'){ oCr += U.num(l.credit); oDr += U.num(l.debit); hasOut = true; }
      if (a === '1160'){ iDr += U.num(l.debit); iCr += U.num(l.credit); hasIn = true; }
    });
    if (hasOut){ outVAT += (oCr - oDr); outCount++; }
    if (hasIn){ inVAT += (iDr - iCr); inCount++; }
  });
  const net = outVAT - inVAT;
  return { outputVAT: outVAT, inputVAT: inVAT, netVAT: net, salesCount: outCount, purchaseCount: inCount, status: net>0?'payable':(net<0?'refundable':'zero') };
}

function render(container){

function renderVAT(){
  const v = buildVATReturn(state.period);

        <div class="flex justify-between py-2 font-bold"><span class="text-white">Net VAT</span><span class="font-mono text-lg ${color}">${v.netVAT>=0?'':'-'}${U.fmtAmt(Math.abs(v.netVAT))}</span></div>
        ${v.netVAT>0?'<div class="text-[10px] text-rose-300 mt-1">🔔 ต้องชำระภายในวันที่ 15 ของเดือนถัดไป</div>':''}
        ${v.netVAT<0?'<div class="text-[10px] text-emerald-300 mt-1">🔔 เครดิตภาษี — ยกไปเดือนถัดไป</div>':''}

    </div>`;
}

function renderWHT(){
  const whtList = getWHT().filter(w=>w.period === state.period);

  const totalBase = whtList.reduce((s,w)=>s+U.num(w.baseAmount),0);

    </div>
    <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden mt-3">
      <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">

          <button onclick="__faTax.exportWHT()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"><i class="fa-solid fa-download mr-1"></i>CSV</button>
        </div>
      </div>
      ${whtList.length===0?`<div class="p-10 text-center text-slate-500 text-xs"><i class="fa-solid fa-file-signature text-3xl mb-2 block opacity-30"></i>ยังไม่มีรายการในงวดนี้</div>`:`
        <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-900 text-slate-400"><tr>
          <th class="text-left py-2 px-2">วันที่</th><th class="text-left py-2 px-2">ผู้ถูกหัก</th>
          <th class="text-left py-2 px-2">เลขผู้เสียภาษี</th><th class="text-left py-2 px-2">ประเภท</th>

            <td class="py-2 px-2 text-right font-mono">${U.fmt(w.baseAmount)}</td>
            <td class="py-2 px-2 text-right font-mono text-slate-400">${w.rate}%</td>
            <td class="py-2 px-2 text-right font-mono font-bold text-amber-400">${U.fmt(w.whtAmount)}</td>
            <td class="py-2 px-2 text-center"><button onclick="__faTax.delWHT('${w.id}')" class="text-slate-500 hover:text-rose-400 px-1"><i class="fa-solid fa-xmark"></i></button></td>
          </tr>`).join('')}
          <tr class="bg-slate-900 font-bold"><td colspan="4" class="py-2 px-2 text-right text-white">รวม</td><td class="py-2 px-2 text-right font-mono">${U.fmt(totalBase)}</td><td></td><td class="py-2 px-2 text-right font-mono text-amber-400">${U.fmt(totalWHT)}</td><td></td></tr>
        </tbody></table></div>`}
    </div>`;
}

function onWHTTypeChange(){
  const sel = document.getElementById('whtType'); if (!sel) return;
  document.getElementById('whtRate').value = sel.options[sel.selectedIndex].getAttribute('data-rate');
}

function saveWHT(){
  const date = document.getElementById('whtDate').value;
  const payee = document.getElementById('whtPayee').value.trim();
  const taxId = document.getElementById('whtTaxId').value.trim();
  const type = document.getElementById('whtType').value;
  const base = U.num(document.getElementById('whtBase').value);
  const rate = U.num(document.getElementById('whtRate').value);
  if (!date||!payee||base<=0||rate<=0){ U.toast('กรอกให้ครบ','warn'); return; }
  const w = { id: U.uid('wht'), period: date.slice(0,7), date, payeeName: payee, payeeTaxId: taxId, type, rate, baseAmount: base, whtAmount: Math.round(base*rate)/100, createdAt: new Date().toISOString() };
  const list = getWHT(); list.push(w); setWHT(list);
  document.getElementById('taxWHTModal').remove(); refresh(); U.toast('บันทึกแล้ว','success');
}

function delWHT(id){ if(!confirm('ลบ?')) return; setWHT(getWHT().filter(x=>x.id!==id)); refresh(); }

function exportWHT(){
  const list = getWHT().filter(w=>w.period === state.period);
  const lines = ['Date,Payee,TaxId,Type,Rate,Base,WHT'];
  list.forEach(w=>lines.push([w.date, w.payeeName, w.payeeTaxId||'', w.type, w.rate, w.baseAmount.toFixed(2), w.whtAmount.toFixed(2)].map(x=>`"${String(x||'').replace(/"/g,'""')}"`).join(',')));
  const blob = new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'wht_'+state.period+'.csv'; a.click();
  U.toast('Export แล้ว','success');
}

function boot(){
  U.hookPage('tax', render);

}

window.__faTax = { version: VER, refresh, setTab, openAddWHT, saveWHT, onWHTTypeChange, delWHT, exportWHT, buildVATReturn };
boot();
})();

const K = 'fa_period_locks_v1';

<script>
(function FA_PHASE4_H(){
'use strict';
const U = window.__FA3;
if (!U) return;
const VER = 'FA-PHASE4-H.1.0.0';
if (window.__faBudget) return;
window.__faBudget = true;

const K = 'fa_budgets_v1';
const state = { period: U.getCurrentPeriod() };

function getBudgets(){ return U.rd(K, []); }
function setBudgets(v){ return U.wr(K, v); }

function getActuals(period){
  const range = U.getPeriodRange(period);
  const jes = U.getJE().filter(j => j.status === 'POSTED' && j.date >= range.start && j.date <= range.end);
  const agg = {};
  jes.forEach(j => (j.lines||[]).forEach(l => {
    const acct = String(l.account);
    if (!agg[acct]) agg[acct] = 0;
    // รายได้/หนี้สิน/ทุน (credit balance), ค่าใช้จ่าย/สินทรัพย์ (debit balance)
    const isDebitNature = /^[125]/.test(acct); 
    agg[acct] += isDebitNature ? (U.num(l.debit) - U.num(l.credit)) : (U.num(l.credit) - U.num(l.debit));
  }));
  return agg;
}

function render(container){
  const budgets = getBudgets().filter(b => b.period === state.period);
  const actuals = getActuals(state.period);
  
  // รวมบัญชีที่มีอยู่ใน budget หรือมี actual
  const allAccounts = new Set([...budgets.map(b=>b.account), ...Object.keys(actuals)]);
  const rows = Array.from(allAccounts).sort().map(acct => {
    const b = budgets.find(x => x.account === acct);
    const budgetAmt = b ? U.num(b.amount) : 0;
    const actualAmt = actuals[acct] || 0;
    const variance = actualAmt - budgetAmt;
    const pct = budgetAmt !== 0 ? (variance / budgetAmt) * 100 : 0;
    return { account: acct, budget: budgetAmt, actual: actualAmt, variance, pct };
  });

  const totalBudget = rows.reduce((s,r)=>s+r.budget,0);
  const totalActual = rows.reduce((s,r)=>s+r.actual,0);

  container.innerHTML = `
    <div class="space-y-3" data-fa-budget-v4="1">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 flex items-center gap-3 flex-wrap">
        <i class="fa-solid fa-scale-balanced text-cyan-400"></i>
        <span class="text-white font-bold text-sm">Budget vs Actual</span>
        <div class="flex items-center gap-2 ml-auto">
          <input id="bgtPeriod" type="month" value="${U.esc(state.period)}" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
          <button onclick="__faBudget.openAdd()" class="px-3 py-1.5 rounded-lg bg-fa-600 hover:bg-fa-500 text-white text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>ตั้งงบ</button>
          <button onclick="__faBudget.refresh()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        ${U.summaryCard('งบประมาณรวม', totalBudget, 'fa-bullseye', 'text-fa-400', 'ตามที่ตั้งไว้')}
        ${U.summaryCard('ใช้จริงรวม', totalActual, 'fa-chart-simple', 'text-cyan-400', 'ตาม JE ที่ Post แล้ว')}
        ${U.summaryCard('ผลต่างรวม', totalActual - totalBudget, 'fa-scale-balanced', totalActual > totalBudget ? 'text-rose-400':'text-emerald-400', totalActual > totalBudget?'เกินงบ':'อยู่ในงบ')}
      </div>
      
      <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
        <table class="w-full text-xs"><thead class="bg-slate-900 text-slate-400"><tr>
          <th class="text-left py-2 px-3">บัญชี</th>
          <th class="text-right py-2 px-3">งบประมาณ</th>
          <th class="text-right py-2 px-3">ใช้จริง</th>
          <th class="text-right py-2 px-3">ผลต่าง</th>
          <th class="text-right py-2 px-3">%</th>
          <th class="text-center py-2 px-3">Actions</th>
        </tr></thead><tbody>
          ${rows.length===0?`<tr><td colspan="6" class="py-10 text-center text-slate-500">ยังไม่มีข้อมูลงบประมาณ</td></tr>`:rows.map(r=>{
            const isOver = r.variance > 0; // สมมติว่าค่าใช้จ่ายเกินงบคือแย่ (ถ้าเป็นรายได้อาจจะกลับกัน)
            return `<tr class="border-b border-slate-800/60 hover:bg-slate-900/30">
              <td class="py-2 px-3 font-mono text-slate-300">${U.esc(r.account)}</td>
              <td class="py-2 px-3 text-right font-mono text-slate-400">${U.fmt(r.budget)}</td>
              <td class="py-2 px-3 text-right font-mono text-white">${U.fmt(r.actual)}</td>
              <td class="py-2 px-3 text-right font-mono font-bold ${isOver?'text-rose-400':'text-emerald-400'}">${r.variance>0?'+':''}${U.fmt(r.variance)}</td>
              <td class="py-2 px-3 text-right font-mono text-[10px] ${isOver?'text-rose-400/70':'text-emerald-400/70'}">${r.pct.toFixed(1)}%</td>
              <td class="py-2 px-3 text-center">
                <button onclick="__faBudget.openAdd('${r.account}')" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-pen"></i></button>
              </td>
            </tr>`;
          }).join('')}
        </tbody></table>
      </div>
    </div>`;

  const per = container.querySelector('#bgtPeriod');
  if (per) per.onchange = (e)=>{ if(/^\d{4}-\d{2}$/.test(e.target.value)){ state.period = e.target.value; render(container); } };
}

function refresh(){ const p = document.getElementById('page-budget'); if (p) render(p); }

function openAdd(account){
  const acc = account || '';
  const m = document.createElement('div');

  m.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  m.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800"><h3 class="font-bold text-white">ตั้งงบประมาณ</h3><button onclick="document.getElementById('faBudgetModal').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-5 space-y-3">
      <div><label class="block text-xs text-slate-400 mb-1">รหัสบัญชี *</label><input id="bgtAcc" value="${U.esc(acc)}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono" placeholder="เช่น 5100"></div>
      <div><label class="block text-xs text-slate-400 mb-1">งบประมาณ (บาท) *</label><input id="bgtAmt" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div>
    </div>
    <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button onclick="document.getElementById('faBudgetModal').remove()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">ยกเลิก</button><button onclick="__faBudget.save()" class="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold">บันทึก</button></div>
  </div>`;
  (document.getElementById('modals-container')||document.body).appendChild(m);
}

function save(){
  const acc = document.getElementById('bgtAcc').value.trim();
  const amt = U.num(document.getElementById('bgtAmt').value);
  if (!acc || amt < 0){ U.toast('กรอกให้ถูกต้อง','warn'); return; }
  const budgets = getBudgets().filter(b => !(b.account === acc && b.period === state.period));
  budgets.push({ id: U.uid('bgt'), account: acc, period: state.period, amount: amt, updatedAt: new Date().toISOString() });
  setBudgets(budgets);

}

function boot(){
  U.hookPage('budget', render);
  setTimeout(()=>{ const p = document.getElementById('page-budget'); if (p && !p.classList.contains('hidden') && !p.querySelector('[data-fa-budget-v4]')) render(p); }, 500);
  console.log('%c[FA-Budget-V4] ✅ '+VER, 'color:#22d3ee;font-weight:bold');
}

window.__faBudget = { version: VER, refresh, openAdd, save };
boot();
})();
</script>

<script>

// 1. Tax Calendar Logic
// ═══════════════════════════════════════════════════════════
function getTaxDeadlines(period) {
  const [year, month] = period.split('-').map(Number);
  
  // คำนวณเดือนถัดไป
  let nextMonth = month + 1;
  let nextYear = year;
  if (nextMonth > 12) { nextMonth = 1; nextYear++; }
  
  const nextPeriod = `${nextYear}-${U.pad2(nextMonth)}`;
  
  // ภ.พ.30 (VAT) และ ภ.ง.ด.3/53 (WHT) ต้องยื่นภายในวันที่ 15 และ 7 ของเดือนถัดไป
  const vatDeadline = `${nextPeriod}-15`;
  const whtDeadline = `${nextPeriod}-07`;
  
  // ภ.ง.ด.50 (นิติบุคคล) ภายใน 150 วันนับจากวันสิ้นรอบบัญชี (สมมติรอบบัญชีสิ้นสุด ธ.ค.)
  const yearEnd = `${year}-12-31`;
  const d = new Date(yearEnd);
  d.setDate(d.getDate() + 150);
  const citDeadline = d.toISOString().slice(0, 10);

  return [
    { id: 'vat', name: 'ภ.พ.30 (VAT)', deadline: vatDeadline, desc: 'ยื่นแบบและชำระภาษีมูลค่าเพิ่ม', status: new Date(vatDeadline) < new Date() ? 'passed' : 'pending' },
    { id: 'wht', name: 'ภ.ง.ด.3 / 53 (WHT)', deadline: whtDeadline, desc: 'ยื่นแบบและชำระภาษีหัก ณ ที่จ่าย', status: new Date(whtDeadline) < new Date() ? 'passed' : 'pending' },
    { id: 'cit', name: 'ภ.ง.ด.50 (CIT)', deadline: citDeadline, desc: 'ยื่นแบบและชำระภาษีเงินได้นิติบุคคล', status: new Date(citDeadline) < new Date() ? 'passed' : 'pending' }
  ];
}

// ═══════════════════════════════════════════════════════════
// 2. Labor Law Calculator (SSF & PIT)
// ═══════════════════════════════════════════════════════════
function calcSSF(salary) {
  // ประกันสังคม 5% สูงสุดไม่เกิน 750 บาท/เดือน
  const ssf = Math.min(salary * 0.05, 750);
  return Math.round(ssf * 100) / 100;
}

function calcPIT(annualIncome, expenseDeduction = 100000, personalAllowance = 60000) {
  // คำนวณภาษีเงินได้บุคคลธรรมดาแบบขั้นบันได (Simplify)
  const netIncome = Math.max(0, annualIncome - expenseDeduction - personalAllowance);
  let tax = 0;
  
  if (netIncome > 5000000) tax += (netIncome - 5000000) * 0.35;
  if (netIncome > 2000000) tax += (Math.min(netIncome, 5000000) - 2000000) * 0.30;
  if (netIncome > 1000000) tax += (Math.min(netIncome, 2000000) - 1000000) * 0.25;
  if (netIncome > 750000) tax += (Math.min(netIncome, 1000000) - 750000) * 0.20;
  if (netIncome > 500000) tax += (Math.min(netIncome, 750000) - 500000) * 0.15;
  if (netIncome > 300000) tax += (Math.min(netIncome, 500000) - 300000) * 0.10;
  if (netIncome > 150000) tax += (Math.min(netIncome, 300000) - 150000) * 0.05;
  
  return { netIncome, annualTax: Math.round(tax * 100) / 100, monthlyTax: Math.round((tax / 12) * 100) / 100 };
}

            <td class="py-2 px-3 text-center font-mono ${bookLife !== taxLife ? 'text-amber-400 font-bold' : 'text-slate-400'}">${bookLife} ปี</td>
            <td class="py-2 px-3 text-center font-mono text-emerald-400">${taxLife} ปี</td>
            <td class="py-2 px-3 text-right font-mono text-slate-300">${U.fmt(bookDep)}</td>
            <td class="py-2 px-3 text-right font-mono text-emerald-400">${U.fmt(taxDep)}</td>
            <td class="py-2 px-3 text-right font-mono font-bold ${diff > 0 ? 'text-rose-400' : diff < 0 ? 'text-emerald-400' : 'text-slate-400'}">${diff > 0 ? '+' : ''}${U.fmt(diff)}</td>
          </tr>`;
        }).join('')}
      </tbody></table></div>
    <div class="p-3 bg-amber-500/10 border-t border-amber-500/30 text-[10px] text-amber-300">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i> <b>หมายเหตุทางภาษี:</b> หากค่าเสื่อมทางบัญชีสูงกว่าทางภาษี (ผลต่างเป็นบวก) บริษัทจะต้องนำผลต่างนี้ไป <b>บวกกลับ (Add back)</b> เพื่อคำนวณกำไรสุทธิทางภาษีในแบบ ภ.ง.ด.50
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// Boot & Expose
// ═══════════════════════════════════════════════════════════
function setTab(t) { state.tab = t; refresh(); }
function refresh() { const p = document.getElementById('page-tax-compliance'); if (p) render(p); }

function boot() {
  U.hookPage('tax-compliance', render);
  setTimeout(() => { 
    const p = document.getElementById('page-tax-compliance'); 
    if (p && !p.classList.contains('hidden') && !p.querySelector('[data-fa-compliance-v45]')) render(p); 
  }, 500);
  console.log('%c[FA-Compliance-V4.5] ✅ ' + VER, 'color:#22d3ee;font-weight:bold');
}

window.__faCompliance = { version: VER, refresh, setTab, calcSSFUI, calcPITUI, print50Tawi, calcSSF, calcPIT };
boot();
})();
</script>

 <!-- ═══════════════════════════════════════════════════════════
     [FA-PHASE5-PLANNING-BEGIN] v1.0.0 — CAPEX & OPEX Planning
     ═══════════════════════════════════════════════════════════ -->
<script>
(function FA_PHASE5_PLANNING(){
'use strict';
const U = window.__FA3;
if (!U) { console.error('[FA-Planning] Requires Phase 3-A'); return; }
const VER = 'FA-PHASE5-PLAN.1.0.0';
if (window.__faPlanning) return;
window.__faPlanning = true;

const K = { CAPEX: 'fa_capex_plans_v1', OPEX: 'fa_opex_plans_v1' };
const state = { tab: 'capex', period: U.getCurrentPeriod() };

const CAPEX_CATS = [
  { id: '01', name: 'ที่ดิน', icon: 'fa-mountain' },
  { id: '02', name: 'ส่วนปรับปรุงที่ดิน', icon: 'fa-road' },
  { id: '03', name: 'อาคาร', icon: 'fa-building' },
  { id: '04', name: 'ส่วนปรับปรุงอาคาร', icon: 'fa-tools' },
  { id: '05', name: 'ส่วนตกแต่ง', icon: 'fa-couch' },
  { id: '06', name: 'ระบบภายใน', icon: 'fa-network-wired' },
  { id: '07', name: 'เครื่องจักรการผลิต', icon: 'fa-industry' },
  { id: '08', name: 'เครื่องใช้สำนักงาน', icon: 'fa-chair' },
  { id: '09', name: 'เครื่องตกแต่งและติดตั้ง', icon: 'fa-lightbulb' },
  { id: '10', name: 'ยานพาหนะ', icon: 'fa-car' },
  { id: '11', name: 'เครื่องใช้ในร้านอาหาร', icon: 'fa-utensils' },
  { id: '12', name: 'โปรแกรมคอมพิวเตอร์', icon: 'fa-laptop-code' },
  { id: '13', name: 'อื่นๆ', icon: 'fa-box' }
];

const OPEX_CATS = [
  { id: 'personnel', name: 'ค่าใช้จ่ายด้านบุคคลากร' },
  { id: 'facility', name: 'ค่าใช้จ่ายสถานที่' },
  { id: 'energy', name: 'พลังงานและวัสดุสิ้นเปลือง' },
  { id: 'tax', name: 'ภาษีและค่าธรรมเนียม' },
  { id: 'other', name: 'ค่าใช้จ่ายอื่นๆ' },
  { id: 'depreciation', name: 'ค่าเสื่อมราคา (Auto)' }
];

function getCAPEX() { return U.rd(K.CAPEX, []); }
function getOPEX() { return U.rd(K.OPEX, []); }

// ═══════════════════════════════════════════════════════════
// Main Render
// ═══════════════════════════════════════════════════════════
function render(container) {
  container.innerHTML = `
    <div class="space-y-3" data-fa-planning-v5="1">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 flex flex-wrap items-center gap-3">
        <i class="fa-solid fa-chart-pie text-cyan-400"></i>
        <span class="text-white font-bold text-sm">Manufacturing Planning</span>
        <div class="flex items-center gap-2 ml-auto">
          <input id="planPeriod" type="month" value="${U.esc(state.period)}" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
          <button onclick="__faPlanning.refresh()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        ${tabBtn('capex', 'fa-building', 'CAPEX Planning')}
        ${tabBtn('opex', 'fa-file-invoice-dollar', 'OPEX Planning')}
      </div>

      ${state.tab === 'capex' ? renderCAPEX() : renderOPEX()}
    </div>`;

  const per = container.querySelector('#planPeriod');
  if (per) per.onchange = (e) => { if (/^\d{4}-\d{2}$/.test(e.target.value)) { state.period = e.target.value; render(container); } };
}

function tabBtn(id, icon, label) {
  const active = state.tab === id;
  return `<button onclick="__faPlanning.setTab('${id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${active?'bg-fa-600 text-white':'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><i class="fa-solid ${icon} mr-1"></i>${label}</button>`;
}

// ═══════════════════════════════════════════════════════════
// CAPEX Tab
// ═══════════════════════════════════════════════════════════
function renderCAPEX() {
  const plans = getCAPEX().filter(p => p.period === state.period);
  const totalPlanned = plans.reduce((s, p) => s + U.num(p.amount), 0);
  const totalApproved = plans.filter(p => p.status === 'approved').reduce((s, p) => s + U.num(p.amount), 0);

  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
      ${U.summaryCard('งบ CAPEX รวม', totalPlanned, 'fa-coins', 'text-cyan-400', plans.length + ' รายการ')}
      ${U.summaryCard('อนุมัติแล้ว', totalApproved, 'fa-check-double', 'text-emerald-400', 'รอจัดซื้อ')}
      ${U.summaryCard('รออนุมัติ', totalPlanned - totalApproved, 'fa-hourglass-half', 'text-amber-400', 'รอพิจารณา')}
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 flex flex-col justify-center items-center">
        <button onclick="__faPlanning.openAddCAPEX()" class="w-full py-2 rounded-lg bg-fa-600 hover:bg-fa-500 text-white text-xs font-bold mb-1"><i class="fa-solid fa-plus mr-1"></i>ตั้งงบ CAPEX</button>
      </div>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
      <table class="w-full text-xs"><thead class="bg-slate-900 text-slate-400"><tr>
        <th class="text-left py-2 px-3">หมวดหมู่</th>
        <th class="text-left py-2 px-3">รายการ</th>
        <th class="text-left py-2 px-3">เหตุผล / ผู้ขอ</th>
        <th class="text-right py-2 px-3">งบประมาณ</th>
        <th class="text-center py-2 px-3">สถานะ</th>
        <th class="text-center py-2 px-3">Actions</th>
      </tr></thead><tbody>
        ${plans.length === 0 ? `<tr><td colspan="6" class="py-10 text-center text-slate-500">ไม่มีรายการตั้งงบในเดือนนี้</td></tr>` : plans.map(p => {
          const cat = CAPEX_CATS.find(c => c.id === p.categoryId) || { name: 'ไม่ระบุ', icon: 'fa-box' };
          const statusMap = {
            planned: ['bg-slate-800 text-slate-400 border-slate-700', 'รออนุมัติ'],
            approved: ['bg-emerald-500/20 text-emerald-400 border-emerald-500/40', 'อนุมัติแล้ว'],
            purchased: ['bg-cyan-500/20 text-cyan-400 border-cyan-500/40', 'จัดซื้อแล้ว']
          };
          const [cls, label] = statusMap[p.status] || statusMap.planned;

          return `<tr class="border-b border-slate-800/60 hover:bg-slate-900/30">
            <td class="py-2 px-3 text-slate-300"><i class="fa-solid ${cat.icon} mr-1 text-slate-500"></i>${cat.name}</td>
            <td class="py-2 px-3 text-white font-semibold">${U.esc(p.name)}</td>
            <td class="py-2 px-3 text-slate-400"><div class="text-[10px]">${U.esc(p.reason)}</div><div class="text-[9px] text-slate-500">โดย: ${U.esc(p.requester)}</div></td>
            <td class="py-2 px-3 text-right font-mono font-bold text-fa-400">${U.fmt(p.amount)}</td>
            <td class="py-2 px-3 text-center"><span class="text-[9px] font-bold border px-1.5 py-0.5 rounded ${cls}">${label}</span></td>
            <td class="py-2 px-3 text-center whitespace-nowrap">
              ${p.status === 'planned' ? `<button onclick="__faPlanning.approveCAPEX('${p.id}')" class="px-2 py-1 rounded bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 text-[10px] mr-1">อนุมัติ</button>` : ''}
              ${p.status === 'approved' ? `<button onclick="__faPlanning.convertToAsset('${p.id}')" class="px-2 py-1 rounded bg-cyan-600/20 text-cyan-400 hover:bg-cyan-600/30 text-[10px] mr-1">สร้างเป็น Asset</button>` : ''}
              <button onclick="__faPlanning.delCAPEX('${p.id}')" class="text-slate-500 hover:text-rose-400 px-1"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>`;
}

function openAddCAPEX() {
  const m = document.createElement('div');
  m.id = 'capexModal';
  m.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  m.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800"><h3 class="font-bold text-white">ตั้งงบ CAPEX</h3><button onclick="document.getElementById('capexModal').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-5 space-y-3">
      <div><label class="block text-xs text-slate-400 mb-1">หมวดหมู่ *</label><select id="cxCat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">${CAPEX_CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div><label class="block text-xs text-slate-400 mb-1">ชื่อรายการ *</label><input id="cxName" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="เช่น เครื่องบรรจุขวดอัตโนมัติ"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-slate-400 mb-1">ผู้ขอ *</label><input id="cxReq" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="เช่น ฝ่ายผลิต"></div>
        <div><label class="block text-xs text-slate-400 mb-1">งบประมาณ (บาท) *</label><input id="cxAmt" type="number" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div>
      </div>
      <div><label class="block text-xs text-slate-400 mb-1">เหตุผลความจำเป็น</label><textarea id="cxReason" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></textarea></div>
    </div>
    <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button onclick="document.getElementById('capexModal').remove()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">ยกเลิก</button><button onclick="__faPlanning.saveCAPEX()" class="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold">บันทึก</button></div>
  </div>`;
  (document.getElementById('modals-container')||document.body).appendChild(m);
}

function saveCAPEX() {
  const cat = document.getElementById('cxCat').value;
  const name = document.getElementById('cxName').value.trim();
  const req = document.getElementById('cxReq').value.trim();
  const amt = U.num(document.getElementById('cxAmt').value);
  const reason = document.getElementById('cxReason').value.trim();
  if (!name || !req || amt <= 0) { U.toast('กรอกข้อมูลไม่ครบ', 'warn'); return; }

  const list = getCAPEX();
  list.push({ id: U.uid('cx'), period: state.period, categoryId: cat, name, requester: req, amount: amt, reason, status: 'planned', createdAt: new Date().toISOString() });
  U.wr(K.CAPEX, list);
  document.getElementById('capexModal').remove();
  refresh();
  U.toast('ตั้งงบ CAPEX แล้ว', 'success');
}

function approveCAPEX(id) {
  const list = getCAPEX();
  const idx = list.findIndex(x => x.id === id);
  if (idx >= 0) { list[idx].status = 'approved'; U.wr(K.CAPEX, list); refresh(); U.toast('อนุมัติแล้ว', 'success'); }
}

function delCAPEX(id) {
  if (!confirm('ลบรายการนี้?')) return;
  U.wr(K.CAPEX, getCAPEX().filter(x => x.id !== id));
  refresh();
}

function convertToAsset(id) {
  const p = getCAPEX().find(x => x.id === id);
  if (!p) return;
  
  // แปลงหมวดหมู่ CAPEX ให้ตรงกับหมวดหมู่ Assets ของ Phase 2.2
  const catMap = { '03': 'building', '07': 'machinery', '08': 'furniture', '10': 'vehicle', '12': 'it', '13': 'equipment' };
  const assetCat = catMap[p.categoryId] || 'equipment';

  if (!window.__faAssets) { U.toast('ไม่พบโมดูล Fixed Assets', 'error'); return; }
  
  // เปิด Modal ของ Phase 2.2 พร้อมข้อมูล Pre-fill
  const m = document.createElement('div');
  m.id = 'convertAssetModal';
  m.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  m.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800"><h3 class="font-bold text-white">ยืนยันสร้างเป็นสินทรัพย์</h3><button onclick="document.getElementById('convertAssetModal').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-5 space-y-3">
      <div class="bg-slate-900 rounded-lg p-3 text-xs mb-2">
        <div class="text-slate-400">รายการ:</div><div class="text-white font-bold mb-1">${U.esc(p.name)}</div>
        <div class="text-slate-400">งบประมาณ:</div><div class="text-fa-400 font-mono font-bold">${U.fmtAmt(p.amount)}</div>
      </div>
      <div><label class="block text-xs text-slate-400 mb-1">วันที่ได้มา (Acquisition Date) *</label><input id="cxAcqDate" type="date" value="${U.todayISO()}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <p class="text-[10px] text-slate-500">ระบบจะเปิดหน้าสร้างสินทรัพย์ (Phase 2.2) โดยกรอกข้อมูลให้อัตโนมัติ</p>
    </div>
    <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button onclick="document.getElementById('convertAssetModal').remove()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">ยกเลิก</button><button onclick="__faPlanning.doConvert('${p.id}')" class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">ยืนยัน</button></div>
  </div>`;
  (document.getElementById('modals-container')||document.body).appendChild(m);
}

function doConvert(id) {
  const p = getCAPEX().find(x => x.id === id);
  const acqDate = document.getElementById('cxAcqDate').value;
  if (!p || !acqDate) return;

  // 1. เปลี่ยนสถานะใน CAPEX
  const list = getCAPEX();
  const idx = list.findIndex(x => x.id === id);
  if (idx >= 0) { list[idx].status = 'purchased'; U.wr(K.CAPEX, list); }

  // 2. สร้าง Asset ใน Phase 2.2 (จำลองการเรียกใช้ API ของ __faAssets)
  if (window.__faAssets) {
    // สร้าง Draft Asset แล้วบันทึก
    const assets = U.rd('fa_assets_v1', []);
    const catMap = { '03': 'building', '07': 'machinery', '08': 'furniture', '10': 'vehicle', '12': 'it', '13': 'equipment' };
    const assetCat = catMap[p.categoryId] || 'equipment';
    
    assets.push({
      id: U.uid('ast'),
      code: 'FA-' + String(assets.length + 1).padStart(4, '0'),
      name: p.name,
      category: assetCat,
      acquisitionDate: acqDate,
      acquisitionCost: p.amount,
      salvageValue: 0,
      usefulLifeYears: (assetCat === 'it' ? 3 : assetCat === 'vehicle' ? 5 : 10),
      depreciationMethod: 'straight_line',
      glAssetAccount: '1410',
      glDepAccount: '5910',
      glAccumDepAccount: '1429',
      status: 'active',
      createdAt: new Date().toISOString()
    });
    U.wr('fa_assets_v1', assets);
    U.toast('สร้างสินทรัพย์สำเร็จ! ตรวจสอบได้ที่เมนู Fixed Assets', 'success');
  }

  document.getElementById('convertAssetModal').remove();
  refresh();
}

// ═══════════════════════════════════════════════════════════
// OPEX Tab
// ═══════════════════════════════════════════════════════════
function renderOPEX() {
  const plans = getOPEX().filter(p => p.period === state.period);
  
  // คำนวณค่าเสื่อมจาก Phase 2.2 (Auto)
  let autoDep = 0;
  if (window.FA && window.FA.getJE) {
    // ดึงจาก dep_runs หรือคำนวณ
    const runs = U.rd('fa_dep_runs_v1', []);
    autoDep = runs.filter(r => r.period === state.period).reduce((s, r) => s + U.num(r.amount), 0);
  }

  const getAmt = (catId) => {
    if (catId === 'depreciation') return autoDep;
    return plans.filter(p => p.categoryId === catId).reduce((s, p) => s + U.num(p.amount), 0);
  };

  const total = OPEX_CATS.reduce((s, c) => s + getAmt(c.id), 0);

  return `<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <div class="md:col-span-2 space-y-3">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
        <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">
          <h4 class="font-bold text-sm text-white">งบประมาณ OPEX — ${U.esc(state.period)}</h4>
          <button onclick="__faPlanning.openAddOPEX()" class="px-3 py-1.5 rounded-lg bg-fa-600 hover:bg-fa-500 text-white text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>เพิ่มงบ</button>
        </div>
        <table class="w-full text-xs"><tbody>
          ${OPEX_CATS.map(c => {
            const amt = getAmt(c.id);
            return `<tr class="border-b border-slate-800/60 hover:bg-slate-900/30">
              <td class="py-3 px-3 text-slate-300 font-semibold">${c.name}</td>
              <td class="py-3 px-3 text-right font-mono text-white">${U.fmt(amt)}</td>
              <td class="py-3 px-3 text-right w-16">
                ${c.id !== 'depreciation' ? `<button onclick="__faPlanning.openAddOPEX('${c.id}')" class="text-cyan-400 hover:text-cyan-300"><i class="fa-solid fa-pen"></i></button>` : '<i class="fa-solid fa-robot text-slate-500" title="Auto from Fixed Assets"></i>'}
              </td>
            </tr>`;
          }).join('')}
          <tr class="bg-slate-900 font-bold">
            <td class="py-3 px-3 text-white">รวม OPEX ทั้งสิ้น</td>
            <td class="py-3 px-3 text-right font-mono text-fa-400 text-lg">${U.fmt(total)}</td>
            <td></td>
          </tr>
        </tbody></table>
      </div>
    </div>
    <div class="space-y-3">
      ${U.summaryCard('Total OPEX', total, 'fa-wallet', 'text-fa-400', 'ประจำเดือน')}
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-xs text-slate-400">
        <p class="font-bold text-white mb-2"><i class="fa-solid fa-circle-info text-cyan-400 mr-1"></i>ข้อมูลเพิ่มเติม</p>
        <ul class="list-disc pl-4 space-y-1">
          <li>หมวด <b>"ค่าเสื่อมราคา"</b> ระบบจะดึงข้อมูลจากโมดูล Fixed Assets (Phase 2.2) อัตโนมัติ</li>
          <li>สามารถตั้งงบ OPEX ล่วงหน้าและเทียบกับยอดใช้จริงได้ที่เมนู <b>Budget vs Actual</b> (Phase 4)</li>
        </ul>
      </div>
    </div>
  </div>`;
}

function openAddOPEX(prefillCat) {
  const m = document.createElement('div');
  m.id = 'opexModal';
  m.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  m.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800"><h3 class="font-bold text-white">ตั้งงบ OPEX</h3><button onclick="document.getElementById('opexModal').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-5 space-y-3">
      <div><label class="block text-xs text-slate-400 mb-1">หมวดหมู่ *</label><select id="oxCat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">${OPEX_CATS.filter(c=>c.id!=='depreciation').map(c=>`<option value="${c.id}" ${prefillCat===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div><label class="block text-xs text-slate-400 mb-1">รายละเอียด</label><input id="oxDesc" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="เช่น ค่าไฟฟ้าสำนักงาน"></div>
      <div><label class="block text-xs text-slate-400 mb-1">งบประมาณ (บาท) *</label><input id="oxAmt" type="number" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div>
    </div>
    <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button onclick="document.getElementById('opexModal').remove()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">ยกเลิก</button><button onclick="__faPlanning.saveOPEX()" class="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold">บันทึก</button></div>
  </div>`;
  (document.getElementById('modals-container')||document.body).appendChild(m);
}

function saveOPEX() {
  const cat = document.getElementById('oxCat').value;
  const desc = document.getElementById('oxDesc').value.trim();
  const amt = U.num(document.getElementById('oxAmt').value);
  if (amt <= 0) { U.toast('กรอกจำนวนเงิน', 'warn'); return; }

  const list = getOPEX();
  list.push({ id: U.uid('ox'), period: state.period, categoryId: cat, description: desc, amount: amt, createdAt: new Date().toISOString() });
  U.wr(K.OPEX, list);
  document.getElementById('opexModal').remove();
  refresh();
  U.toast('บันทึกงบ OPEX แล้ว', 'success');
}

function setTab(t) { state.tab = t; refresh(); }
function refresh() { const p = document.getElementById('page-planning'); if (p) render(p); }

function boot() {
  U.hookPage('planning', render);
  setTimeout(() => { const p = document.getElementById('page-planning'); if (p && !p.classList.contains('hidden') && !p.querySelector('[data-fa-planning-v5]')) render(p); }, 500);
  console.log('%c[FA-Planning-V5] ✅ ' + VER, 'color:#22d3ee;font-weight:bold');
}

window.__faPlanning = { version: VER, refresh, setTab, openAddCAPEX, saveCAPEX, approveCAPEX, delCAPEX, convertToAsset, doConvert, openAddOPEX, saveOPEX };
boot();
})();
</script>
