<script>
(function(){
  'use strict';
  if (window.__pmpDocNo) return;
  var mem = {};
  function p2(n){ return n < 10 ? '0'+n : ''+n; }
  function ymd(d){ d=d||new Date(); return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate()); }
  function pad4(n){ var s=String(n); while(s.length<4) s='0'+s; return s; }
  window.__pmpDocNo = function(prefix, isTaken){
    var d=ymd(), key='__idseq_'+prefix+'_'+d, id, guard=0;
    do {
      var c=0;
      try { c = parseInt(localStorage.getItem(key)||'0',10)||0; } catch(e){ c=0; }
      c = Math.max(c, mem[key]||0) + 1; mem[key]=c;
      try { localStorage.setItem(key, String(c)); } catch(e){}
      id = prefix + d + pad4(c);
    } while (typeof isTaken === 'function' && isTaken(id) && ++guard < 9999);
    return id;
  };
  window.__pmpDocNo.isStandard = function(id){ return /^[A-Z]{3}\d{12}$/.test(String(id||'')); };
})();
</script>

<script>
/* ============================================================================
   FINANCE & ACCOUNTING — Core
   Storage keys:
     fa_coa_v1              : Chart of Accounts
     fa_journal_v1          : Journal Entries
     fa_ar_invoices_v1      : AR Invoices
     fa_ap_bills_v1         : AP Bills
     fa_bank_statement_v1   : Bank Statement lines
     fa_bank_matches_v1     : Bank Reconciliation matches
     fa_assets_v1           : Fixed Assets
     fa_production_cost_v1  : Production Cost sheets
     fa_budget_v1           : Budget
     fa_tax_returns_v1      : Tax Returns
     fa_audit_log_v1        : Audit log
     fa_period_v1           : Active period (YYYY-MM)
     fa_banks_v1            : Bank accounts master
     fa_settings_v1         : Settings (approval matrix, tax rates)
   ============================================================================ */
(function FA_CORE(){
'use strict';

/* ─────────── Constants ─────────── */
const K = {
  COA: 'fa_coa_v1',
  JE: 'fa_journal_v1',
  AR: 'fa_ar_invoices_v1',
  AP: 'fa_ap_bills_v1',
  BANK_STMT: 'fa_bank_statement_v1',
  BANK_MATCH: 'fa_bank_matches_v1',
  ASSETS: 'fa_assets_v1',
  PROD_COST: 'fa_production_cost_v1',
  BUDGET: 'fa_budget_v1',
  TAX: 'fa_tax_returns_v1',
  AUDIT: 'fa_audit_log_v1',
  PERIOD: 'fa_period_v1',
  BANKS: 'fa_banks_v1',
  SETTINGS: 'fa_settings_v1'
};

const ACCOUNT_TYPES = {
  ASSET:     { label: 'สินทรัพย์',         short: 'A', normalDebit: true,  cls: 'text-sky-400' },
  LIABILITY: { label: 'หนี้สิน',           short: 'L', normalDebit: false, cls: 'text-rose-400' },
  EQUITY:    { label: 'ส่วนของผู้ถือหุ้น', short: 'E', normalDebit: false, cls: 'text-violet-400' },
  REVENUE:   { label: 'รายได้',             short: 'R', normalDebit: false, cls: 'text-emerald-400' },
  EXPENSE:   { label: 'ค่าใช้จ่าย',         short: 'X', normalDebit: true,  cls: 'text-amber-400' },
  COGS:      { label: 'ต้นทุนขาย',          short: 'C', normalDebit: true,  cls: 'text-orange-400' }
};

const JE_STATUS = {
  DRAFT:     { label: 'Draft',       cls: 'bg-slate-700 text-slate-300' },
  PENDING:   { label: 'รออนุมัติ',   cls: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' },
  POSTED:    { label: 'Posted',      cls: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' },
  UNPOSTED:  { label: 'Unposted',    cls: 'bg-slate-700 text-slate-400' }
};

const AR_STATUS = {
  DRAFT:     { label: 'Draft',         cls: 'bg-slate-700 text-slate-300' },
  ISSUED:    { label: 'Issued',        cls: 'bg-sky-500/20 text-sky-400 border border-sky-500/30' },
  PARTIAL:   { label: 'รับบางส่วน',    cls: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' },
  PAID:      { label: 'ชำระครบ',      cls: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' },
  OVERDUE:   { label: 'เกินกำหนด',    cls: 'bg-rose-500/20 text-rose-400 border border-rose-500/30' },
  CANCELLED: { label: 'ยกเลิก',        cls: 'bg-slate-700 text-slate-500' }
};

const AP_STATUS = {
  DRAFT:     { label: 'Draft',         cls: 'bg-slate-700 text-slate-300' },
  RECEIVED:  { label: 'รับบิลแล้ว',    cls: 'bg-sky-500/20 text-sky-400 border border-sky-500/30' },
  PARTIAL:   { label: 'จ่ายบางส่วน',   cls: 'bg-amber-500/20 text-amber-400 border border-amber-500/30' },
  PAID:      { label: 'จ่ายครบ',      cls: 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' },
  OVERDUE:   { label: 'เกินกำหนด',    cls: 'bg-rose-500/20 text-rose-400 border border-rose-500/30' },
  CANCELLED: { label: 'ยกเลิก',        cls: 'bg-slate-700 text-slate-500' }
};

/* ─────────── Utilities ─────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(v, dec){
  const n = num(v);
  const d = dec != null ? dec : 2;
  return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtAmt(v){ return '฿' + fmt(v); }
function fmtShort(v){
  const n = num(v);
  const a = Math.abs(n);
  if (a >= 1e9) return '฿' + (n/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return '฿' + (n/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return '฿' + (n/1e3).toFixed(2) + 'K';
  return '฿' + n.toFixed(0);
}
function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function thDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear();
}
function currentPeriod(){
  let p = rd(K.PERIOD, null);
  if (p && /^\d{4}-\d{2}$/.test(p)) return p;
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function periodRange(p){
  const [y, m] = p.split('-').map(Number);
  const start = new Date(y, m-1, 1);
  const end = new Date(y, m, 0);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10), label: thDate(start.toISOString()) + ' – ' + thDate(end.toISOString()) };
}
function rd(k, def){
  try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? def : v; } catch(e){ return def; }
}
function wr(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ console.error('write fail', k, e); return false; } }
function showToast(msg, type){
  type = type || 'success';
  const colors = {
    success: { bg: 'rgba(16,185,129,.15)', text: '#34d399', border: 'rgba(16,185,129,.4)' },
    error:   { bg: 'rgba(244,63,94,.15)',  text: '#fb7185', border: 'rgba(244,63,94,.4)' },
    warn:    { bg: 'rgba(245,158,11,.15)', text: '#fbbf24', border: 'rgba(245,158,11,.4)' },
    info:    { bg: 'rgba(56,189,248,.15)', text: '#38bdf8', border: 'rgba(56,189,248,.4)' }
  };
  const c = colors[type] || colors.info;
  const el = document.createElement('div');
  el.className = 'app-toast';
  el.style.background = c.bg; el.style.color = c.text; el.style.border = '1px solid ' + c.border;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; }, 3200);
  setTimeout(() => el.remove(), 3600);
}
window.showToast = showToast;

function audit(action, details){
  const log = rd(K.AUDIT, []);
  const user = window.currentLoggedInUser || { id: 'system' };
  log.unshift({ at: new Date().toISOString(), user: user.id, action, details: details || {} });
  if (log.length > 500) log.length = 500;
  wr(K.AUDIT, log);
}
function bcBroadcast(type, payload){
  try {
    const bc = new BroadcastChannel('whrm-bus');
    bc.postMessage({ type, version: 1, source: 'FA01', timestamp: new Date().toISOString(), payload: payload || {} });
    setTimeout(() => { try { bc.close(); } catch(e){} }, 200);

/* ─────────── Period-aware JE filter ─────────── */
function jeInPeriod(p){
  const r = periodRange(p);
  return getJE().filter(j => j.status === 'POSTED' && j.date >= r.start && j.date <= r.end);
}

/* ─────────── KPI calculations ─────────── */
function calculateKPIs(period){
  const p = period || currentPeriod();
  const journal = jeInPeriod(p);
  const coa = getCOA();
  const balByCode = {};

  journal.forEach(j => {
    (j.lines || []).forEach(l => {
      if (!balByCode[l.account]) balByCode[l.account] = 0;
      balByCode[l.account] += num(l.debit) - num(l.credit);
    });
  });

  function sumGroup(prefixes){
    let sum = 0;
    Object.keys(balByCode).forEach(code => {
      if (prefixes.some(pfx => code.startsWith(pfx))) sum += balByCode[code];
    });
    return sum;
  }

  const cash = sumGroup(['1110','1120']);
  const ar = sumGroup(['1130']);
  const inventory = sumGroup(['1140','1141','1142','1143']);
  const ap = -sumGroup(['2110']);
  const revenue = -sumGroup(['4110','4120']);
  const cogs = sumGroup(['5110','5120','5130','5140']);
  const expenses = sumGroup(['6110','6120','6130','6140','6150','6160','6170','6180','6190']);
  const grossProfit = revenue - cogs;
  const netProfit = grossProfit - expenses;

  // AR Aging
  const arInvoices = getAR().filter(i => ['ISSUED','PARTIAL','OVERDUE'].includes(i.status));
  const arAging = { '0-30':0, '31-60':0, '61-90':0, '>90':0 };
  const today = new Date();
  arInvoices.forEach(inv => {
    const due = new Date(inv.dueDate);
    const days = Math.floor((today - due) / 86400000);
    const outstanding = num(inv.total) - num(inv.paidAmount);
    if (days <= 30) arAging['0-30'] += outstanding;
    else if (days <= 60) arAging['31-60'] += outstanding;
    else if (days <= 90) arAging['61-90'] += outstanding;
    else arAging['>90'] += outstanding;
  });

  const apBills = getAP().filter(b => ['RECEIVED','PARTIAL','OVERDUE'].includes(b.status));
  const apAging = { '0-30':0, '31-60':0, '61-90':0, '>90':0 };
  apBills.forEach(bill => {
    const due = new Date(bill.dueDate);
    const days = Math.floor((today - due) / 86400000);
    const outstanding = num(bill.total) - num(bill.paidAmount);
    if (days <= 30) apAging['0-30'] += outstanding;
    else if (days <= 60) apAging['31-60'] += outstanding;
    else if (days <= 90) apAging['61-90'] += outstanding;
    else apAging['>90'] += outstanding;
  });

  return {
    period: p,
    cash, ar, ap, inventory,
    revenue, cogs, grossProfit, expenses, netProfit,
    arAging, apAging,
    arInvoices, apBills,
    journalCount: journal.length
  };
}

function renderAgingBar(aging, color){
  const total = Object.values(aging).reduce((s, v) => s + v, 0);
  const buckets = [
    { label: '0-30',    v: aging['0-30'] },
    { label: '31-60',   v: aging['31-60'] },
    { label: '61-90',   v: aging['61-90'] },
    { label: '>90',     v: aging['>90'] }
  ];
  const colorCls = color === 'emerald' ? ['bg-emerald-500','bg-emerald-400','bg-amber-500','bg-rose-500'] : ['bg-rose-500','bg-orange-500','bg-amber-500','bg-slate-500'];
  return `
    <div class="space-y-2">
      ${buckets.map((b, i) => {
        const pct = total > 0 ? (b.v / total * 100) : 0;
        return `
          <div>
            <div class="flex justify-between text-[11px] mb-1">
              <span class="text-slate-400">${b.label} วัน</span>
              <span class="font-bold text-slate-200 font-mono">${fmtShort(b.v)}</span>
            </div>
            <div class="h-2 bg-slate-800 rounded-full overflow-hidden">
              <div class="${colorCls[i]} h-full" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('')}
      ${total === 0 ? '<div class="text-center text-slate-500 text-xs py-3 italic">ไม่มีรายการค้างชำระ</div>' : ''}
    </div>
  `;
}

let cashflowChartInst = null, revenueMixChartInst = null;

function renderCashflowChart(){
  const ctx = document.getElementById('cashflowChart');
  if (!ctx || !window.Chart) return;
  if (cashflowChartInst) cashflowChartInst.destroy();

  // Build 6-month trend from current period backwards
  const today = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    const p = d.getFullYear() + '-' + pad2(d.getMonth()+1);
    const kpi = calculateKPIs(p);
    months.push({
      label: d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }),
      cash: kpi.cash,
      revenue: kpi.revenue,
      profit: kpi.netProfit
    });
  }

  cashflowChartInst = new Chart(ctx.getContext('2d'), {
    type: 'line',
    data: {
      labels: months.map(m => m.label),
      datasets: [
        { label: 'เงินสดคงเหลือ', data: months.map(m => m.cash), borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,.08)', fill: true, tension: .3 },
        { label: 'รายได้', data: months.map(m => m.revenue), borderColor: '#4DC19C', backgroundColor: 'rgba(77,193,156,.05)', fill: true, tension: .3 },
        { label: 'กำไรสุทธิ', data: months.map(m => m.profit), borderColor: '#a78bfa', backgroundColor: 'transparent', tension: .3, borderDash: [4,4] }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ฿' + fmt(c.parsed.y) } }
      },
      scales: {
        y: { grid: { color: 'rgba(148,163,184,.1)' }, ticks: { color: '#64748b', font: { size: 10 }, callback: v => fmtShort(v) } },
        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } }
      }
    }
  });
}

function renderRevenueMixChart(){
  const ctx = document.getElementById('revenueMixChart');
  if (!ctx || !window.Chart) return;
  if (revenueMixChartInst) revenueMixChartInst.destroy();

  const kpi = calculateKPIs();
  const data = kpi.revenue > 0 ? [kpi.revenue, kpi.cogs, kpi.expenses] : [1,1,1];
  const colors = kpi.revenue > 0 ? ['#4DC19C','#f59e0b','#f43f5e'] : ['#1e293b','#1e293b','#1e293b'];

  revenueMixChartInst = new Chart(ctx.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: ['รายได้', 'ต้นทุนขาย', 'ค่าใช้จ่าย'],
      datasets: [{ data, backgroundColor: colors, borderColor: '#020617', borderWidth: 2 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 }, boxWidth: 10 } },
        tooltip: { callbacks: { label: c => c.label + ': ' + (kpi.revenue > 0 ? fmtShort(c.parsed) : 'ไม่มีข้อมูล') } }
      }
    }
  });
}

function saveCOA(id){
  const code = document.getElementById('coaCode').value.trim();
  const name = document.getElementById('coaName').value.trim();
  const type = document.getElementById('coaType').value;
  const nameEn = document.getElementById('coaNameEn').value.trim();
  const parent = document.getElementById('coaParent').value || null;
  const isHeader = document.getElementById('coaIsHeader').checked;
  if (!code || !name) { showToast('กรุณากรอกรหัสและชื่อบัญชี', 'error'); return; }
  const coa = getCOA();
  if (coa.some(a => a.code === code && a.id !== id)) { showToast('รหัสบัญชีซ้ำ', 'error'); return; }
  if (id) {
    const idx = coa.findIndex(a => a.id === id);
    coa[idx] = { ...coa[idx], code, name, type, nameEn, parent, isHeader };
  } else {
    coa.push({ id: 'coa_' + Date.now(), code, name, type, nameEn, parent, isHeader, contra: false, active: true, createdAt: new Date().toISOString() });
  }
  setCOA(coa);
  document.getElementById('coaModal').remove();
  renderCOA();
  showToast('บันทึกบัญชีสำเร็จ');
  audit('COA_SAVE', { id, code, name });
}

function deleteCOA(id){
  if (!confirm('ยืนยันการลบบัญชีนี้?')) return;
  const coa = getCOA().filter(a => a.id !== id);
  setCOA(coa);
  renderCOA();
  showToast('ลบบัญชีสำเร็จ');
}

function exportCOA(){
  const coa = getCOA();
  const rows = [['Code','Name','Name EN','Type','Parent','Header']];
  coa.forEach(a => rows.push([a.code, a.name, a.nameEn||'', a.type, a.parent||'', a.isHeader ? 'Y' : 'N']));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'chart_of_accounts_' + todayISO() + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

function recalcJE(){
  const lines = document.querySelectorAll('.je-line');
  let dr = 0, cr = 0;
  lines.forEach(tr => {
    dr += num((tr.querySelector('.je-dr')||{}).value);
    cr += num((tr.querySelector('.je-cr')||{}).value);
  });
  const tdr = document.getElementById('jeTotalDr');
  const tcr = document.getElementById('jeTotalCr');
  if (tdr) tdr.textContent = fmtAmt(dr);
  if (tcr) tcr.textContent = fmtAmt(cr);
  const chk = document.getElementById('jeBalanceCheck');
  if (chk) {
    if (Math.abs(dr - cr) < 0.01 && dr > 0) {
      chk.innerHTML = '<span class="text-emerald-400 font-bold"><i class="fa-solid fa-check-circle mr-1"></i>Dr. = Cr. (฿' + fmt(dr) + ')</span>';
    } else if (dr === 0 && cr === 0) {
      chk.innerHTML = '<span class="text-slate-500">ยังไม่มีรายการ</span>';
    } else {
      chk.innerHTML = '<span class="text-rose-400 font-bold"><i class="fa-solid fa-exclamation-triangle mr-1"></i>Dr. ≠ Cr. (ต่าง ฿' + fmt(Math.abs(dr - cr)) + ')</span>';
    }
  }
}

function saveJournal(status){
  const id = document.getElementById('jeId').value;
  const date = document.getElementById('jeDate').value;
  const desc = document.getElementById('jeDesc').value.trim();
  const ref = document.getElementById('jeRef').value.trim();

  const lines = [];
  document.querySelectorAll('.je-line').forEach(tr => {
    const acct = tr.querySelector('.je-acct').value;
    const d = num(tr.querySelector('.je-dr').value);
    const c = num(tr.querySelector('.je-cr').value);
    const ldesc = tr.querySelector('.je-desc').value.trim();
    const lcc = ((tr.querySelector('.je-cc') || {}).value || '');
    if (acct && (d > 0 || c > 0)){ const ln = { account: acct, debit: d, credit: c, description: ldesc }; if (lcc){ ln.costCenter = lcc; ln.ccPeriod = String(date || '').slice(0, 7); } lines.push(ln); }
  });
  { const bad = lines.find(l => l.costCenter && !(accountByCode(l.account) && ['EXPENSE', 'COGS'].indexOf(accountByCode(l.account).type) >= 0));   /* [FA-COST] แท็ก Cost Center ใช้กับบัญชีค่าใช้จ่ายเท่านั้น */
    if (bad) { showToast('Cost Center ใช้กับบัญชีค่าใช้จ่าย/ต้นทุนขายเท่านั้น (บัญชี ' + bad.account + ')', 'error'); return; } }

  if (!date) { showToast('กรุณาระบุวันที่', 'error'); return; }
  if (!desc) { showToast('กรุณาระบุคำอธิบาย', 'error'); return; }
  if (lines.length < 2) { showToast('ต้องมีอย่างน้อย 2 รายการ', 'error'); return; }

  const dr = lines.reduce((s, l) => s + l.debit, 0);
  const cr = lines.reduce((s, l) => s + l.credit, 0);
  if (Math.abs(dr - cr) > 0.01) { showToast('Dr. ≠ Cr.', 'error'); return; }
  if (status === 'POSTED' && dr === 0) { showToast('ยอดรวมต้องมากกว่า 0', 'error'); return; }

  const je = getJE();
  je.unshift({
    id, date, description: desc, ref, status,
    lines,
    total: dr,
    createdBy: (window.currentLoggedInUser||{}).id || 'system',
    createdAt: new Date().toISOString(),
    postedAt: status === 'POSTED' ? new Date().toISOString() : null
  });
  setJE(je);
  document.getElementById('jeModal').remove();
  renderJournal();
  showToast(`บันทึก Journal ${id} แล้ว (${status})`);
  audit('JE_SAVE', { id, status, total: dr });
  bcBroadcast('FA_JE_POSTED', { id, status, total: dr });
}

function postJournal(id){
  const je = getJE();
  const j = je.find(x => x.id === id);
  if (!j) return;
  j.status = 'POSTED';
  j.postedAt = new Date().toISOString();
  setJE(je);
  renderJournal();
  showToast('Post Journal ' + id + ' สำเร็จ');
  bcBroadcast('FA_JE_POSTED', { id, total: j.total });
}

function unpostJournal(id){
  if (!confirm('ยืนยันการ Unpost? รายการจะออกจาก Trial Balance')) return;
  const je = getJE();
  const j = je.find(x => x.id === id);
  if (!j) return;
  j.status = 'UNPOSTED';
  setJE(je);
  renderJournal();
  showToast('Unpost Journal ' + id);
}

/* ─────────── Render: Trial Balance ─────────── */
function renderTB(){
  const el = document.getElementById('page-tb');
  const p = currentPeriod();
  const journal = jeInPeriod(p);
  const balByCode = {};
  journal.forEach(j => (j.lines||[]).forEach(l => {
    if (!balByCode[l.account]) balByCode[l.account] = { dr: 0, cr: 0 };
    balByCode[l.account].dr += num(l.debit);
    balByCode[l.account].cr += num(l.credit);
  }));

  const rows = [];
  let totalDr = 0, totalCr = 0;
  Object.keys(balByCode).sort().forEach(code => {
    const acc = accountByCode(code);
    if (!acc) return;
    const net = balByCode[code].dr - balByCode[code].cr;
    const drBal = net > 0 ? net : 0;
    const crBal = net < 0 ? -net : 0;
    totalDr += drBal; totalCr += crBal;
    rows.push({ code, name: acc.name, drBal, crBal, type: acc.type });
  });

  const balanced = Math.abs(totalDr - totalCr) < 0.01;

  el.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-xl font-bold text-white">Trial Balance</h2>
        <p class="text-xs text-slate-500 mt-0.5">งวด ${p} · ${journal.length} Journal ที่ Post แล้ว</p>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-500">สถานะ</div>
        <div class="text-lg font-bold ${balanced ? 'text-emerald-400' : 'text-rose-400'}">
          ${balanced ? '<i class="fa-solid fa-check-circle mr-1"></i>Balanced' : '<i class="fa-solid fa-exclamation-triangle mr-1"></i>Out of Balance'}
        </div>
      </div>
    </div>
    <div class="fa-card overflow-hidden">
      <table class="w-full text-xs">
        <thead><tr class="bg-slate-900 border-b border-slate-800 text-slate-400">
          <th class="text-left py-3 px-4 w-24">รหัส</th>
          <th class="text-left py-3 px-4">ชื่อบัญชี</th>
          <th class="text-center py-3 px-4 w-20">ประเภท</th>
          <th class="text-right py-3 px-4 w-40">เดบิต</th>
          <th class="text-right py-3 px-4 w-40">เครดิต</th>
        </tr></thead>
        <tbody>${rows.length === 0 ? `<tr><td colspan="5" class="py-12 text-center text-slate-500">
          <i class="fa-solid fa-inbox text-4xl mb-2 opacity-30 block"></i>
          <p>ไม่มีรายการ Posted ในงวดนี้</p>
          <p class="text-[10px] mt-1">สร้าง Journal และกด Post เพื่อให้ปรากฏใน Trial Balance</p>
        </td></tr>` : rows.map(r => `
          <tr class="border-b border-slate-800/60 hover:bg-slate-900/50">
            <td class="py-2 px-4 font-mono text-fa-400">${esc(r.code)}</td>
            <td class="py-2 px-4 text-white">${esc(r.name)}</td>
            <td class="py-2 px-4 text-center"><span class="text-[10px] font-bold ${ACCOUNT_TYPES[r.type].cls}">${ACCOUNT_TYPES[r.type].short}</span></td>
            <td class="py-2 px-4 text-right font-mono ${r.drBal ? 'text-emerald-400' : 'text-slate-600'}">${r.drBal ? fmtAmt(r.drBal) : '-'}</td>
            <td class="py-2 px-4 text-right font-mono ${r.crBal ? 'text-rose-400' : 'text-slate-600'}">${r.crBal ? fmtAmt(r.crBal) : '-'}</td>
          </tr>`).join('')}</tbody>
        ${rows.length > 0 ? `<tfoot><tr class="bg-slate-900 border-t-2 border-slate-700 font-bold">

          <td class="py-3 px-4 text-right font-mono text-rose-400">${fmtAmt(totalCr)}</td>

  `;
}

function renderGLTable(){
  const code = document.getElementById('glAccount').value;
  const from = document.getElementById('glFrom').value;
  const to = document.getElementById('glTo').value;
  const content = document.getElementById('glContent');
  if (!code) { content.innerHTML = '<p class="text-slate-500 text-center">เลือกบัญชี</p>'; return; }

  const entries = [];
  getJE().filter(j => j.status === 'POSTED' && j.date >= from && j.date <= to).forEach(j => {
    (j.lines||[]).forEach(l => {
      if (l.account === code) entries.push({ date: j.date, id: j.id, description: j.description, lineDesc: l.description, debit: num(l.debit), credit: num(l.credit) });
    });
  });
  entries.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

  let running = 0;
  const acc = accountByCode(code);
  const isDebit = acc && (acc.type === 'ASSET' || acc.type === 'EXPENSE' || acc.type === 'COGS');

  content.innerHTML = entries.length === 0 ? '<p class="text-slate-500 text-center py-6">ไม่มีรายการในช่วงเวลานี้</p>' : `

        <th class="text-right py-2 px-3">เดบิต</th>
        <th class="text-right py-2 px-3">เครดิต</th>
        <th class="text-right py-2 px-3">คงเหลือ</th>
      </tr></thead>
      <tbody>${entries.map(e => {
        running += isDebit ? (e.debit - e.credit) : (e.credit - e.debit);
        return `<tr class="border-b border-slate-800/60 hover:bg-slate-900/50">
          <td class="py-2 px-3 text-slate-300">${thDate(e.date)}</td>
          <td class="py-2 px-3 font-mono text-fa-400">${esc(e.id)}</td>
          <td class="py-2 px-3 text-white">${esc(e.lineDesc || e.description)}</td>

          <td class="py-2 px-3 text-right font-mono text-fa-400 font-bold">${fmtAmt(running)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
  `;
}

function calcAR(){
  const sub = num(document.getElementById('arSubtotal').value);
  const rate = num(document.getElementById('arVatRate').value);
  const vat = sub * rate / 100;
  const total = sub + vat;
  document.getElementById('arVatAmt').textContent = '฿' + fmt(vat);
  document.getElementById('arTotal').textContent = '฿' + fmt(total);
}

function saveARInvoice(){
  const id = document.getElementById('arId').value;
  const ref = document.getElementById('arRef').value.trim();
  const date = document.getElementById('arDate').value;
  const due = document.getElementById('arDue').value;
  const customer = document.getElementById('arCustomer').value.trim();
  const subtotal = num(document.getElementById('arSubtotal').value);
  const vatRate = num(document.getElementById('arVatRate').value);
  const vat = subtotal * vatRate / 100;
  const total = subtotal + vat;

  if (!customer) { showToast('กรุณาระบุชื่อลูกค้า', 'error'); return; }
  if (subtotal <= 0) { showToast('ยอดต้องมากกว่า 0', 'error'); return; }

  const inv = getAR();
  inv.unshift({
    id, ref, date, dueDate: due, customerName: customer,
    subtotal, vatRate, vat, total, paidAmount: 0, status: 'ISSUED',
    createdBy: (window.currentLoggedInUser||{}).id || 'system',
    createdAt: new Date().toISOString()
  });
  setAR(inv);

  // Auto-create JE for AR Invoice
  const jeId = window.__pmpDocNo('JEN');
  const je = getJE();
  je.unshift({
    id: jeId, date, description: `AR Invoice ${id} - ${customer}`, ref: id, status: 'POSTED',
    lines: [
      { account: '1130', debit: total, credit: 0, description: customer },
      { account: '4110', debit: 0, credit: subtotal, description: 'Sales' },
      { account: '2130', debit: 0, credit: vat, description: 'Output VAT' }
    ],
    total, createdBy: 'system', createdAt: new Date().toISOString(), postedAt: new Date().toISOString()
  });
  setJE(je);

  document.getElementById('arModal').remove();
  renderAR();
  showToast(`ออกใบแจ้งหนี้ ${id} + สร้าง JE ${jeId}`);
  audit('AR_ISSUE', { id, total });
  bcBroadcast('FA_AR_ISSUED', { id, total, customer });
}

function saveARPayment(invId){
  const inv = getAR().find(i => i.id === invId);
  if (!inv) return;
  const amount = num(document.getElementById('arPayAmount').value);
  const date = document.getElementById('arPayDate').value;
  const bankAcct = document.getElementById('arPayBank').value;
  if (amount <= 0) { showToast('จำนวนต้องมากกว่า 0', 'error'); return; }

  inv.paidAmount = num(inv.paidAmount) + amount;
  if (inv.paidAmount >= inv.total - 0.01) inv.status = 'PAID';
  else inv.status = 'PARTIAL';

  const invs = getAR();
  const idx = invs.findIndex(i => i.id === invId);
  invs[idx] = inv;
  setAR(invs);

  const jeId = window.__pmpDocNo('JEN');
  const je = getJE();
  je.unshift({
    id: jeId, date, description: `รับชำระ ${invId} - ${inv.customerName}`, ref: invId, status: 'POSTED',
    lines: [
      { account: bankAcct, debit: amount, credit: 0, description: 'Cash receipt' },
      { account: '1130', debit: 0, credit: amount, description: invId }
    ],
    total: amount, createdBy: 'system', createdAt: new Date().toISOString(), postedAt: new Date().toISOString()
  });
  setJE(je);

  document.getElementById('arPayModal').remove();
  renderAR();
  showToast(`รับชำระ ${fmtAmt(amount)} จาก ${invId}`);
  audit('AR_PAYMENT', { invId, amount });
}

      </div>

function getNextDue(day, fixedMonth){
  const now = new Date();
  let target;
  if (fixedMonth) {
    target = new Date(now.getFullYear(), fixedMonth - 1, day);
    if (target < now) target = new Date(now.getFullYear() + 1, fixedMonth - 1, day);
  } else {
    target = new Date(now.getFullYear(), now.getMonth(), day);
    if (target < now) target = new Date(now.getFullYear(), now.getMonth() + 1, day);
  }
  return target;
}

function openFinancialReport(type){
  const modal = document.createElement('div');
  modal.id = 'finReportModal';
  modal.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  const p = currentPeriod();
  const journal = jeInPeriod(p);
  const coa = getCOA();
  const bal = {};
  journal.forEach(j => (j.lines||[]).forEach(l => {
    if (!bal[l.account]) bal[l.account] = 0;
    bal[l.account] += num(l.debit) - num(l.credit);
  }));

  function sumOf(type){
    return Object.keys(bal).reduce((s, code) => {
      const acc = coa.find(a => a.code === code);
      if (!acc || acc.type !== type) return s;
      return s + (type === 'ASSET' || type === 'EXPENSE' || type === 'COGS' ? bal[code] : -bal[code]);
    }, 0);
  }

  let content = '';
  let title = '';

  if (type === 'PL') {
    title = 'งบกำไรขาดทุน';
    const revenue = sumOf('REVENUE');
    const cogs = sumOf('COGS');
    const expenses = sumOf('EXPENSE');
    const gross = revenue - cogs;
    const net = gross - expenses;
    content = `
      <table class="w-full text-xs">
        <tr class="border-b border-slate-800"><td class="py-2 text-slate-300">รายได้</td><td class="py-2 text-right font-mono text-emerald-400">${fmtAmt(revenue)}</td></tr>
        <tr class="border-b border-slate-800"><td class="py-2 text-slate-300">หัก ต้นทุนขาย</td><td class="py-2 text-right font-mono text-orange-400">(${fmtAmt(cogs)})</td></tr>
        <tr class="border-b border-slate-800 font-bold"><td class="py-2 text-white">กำไรขั้นต้น</td><td class="py-2 text-right font-mono text-fa-400">${fmtAmt(gross)}</td></tr>
        <tr class="border-b border-slate-800"><td class="py-2 text-slate-300">หัก ค่าใช้จ่ายดำเนินงาน</td><td class="py-2 text-right font-mono text-amber-400">(${fmtAmt(expenses)})</td></tr>
        <tr class="border-b-2 border-slate-700 font-bold text-lg"><td class="py-3 text-white">กำไร (ขาดทุน) สุทธิ</td><td class="py-3 text-right font-mono ${net>=0?'text-emerald-400':'text-rose-400'}">${fmtAmt(net)}</td></tr>
      </table>
    `;
  } else if (type === 'BS') {
    title = 'งบดุล';
    const assets = sumOf('ASSET');
    const liabilities = sumOf('LIABILITY');
    const equity = sumOf('EQUITY');
    const net = sumOf('REVENUE') - sumOf('COGS') - sumOf('EXPENSE');
    content = `
      <div class="space-y-3">
        <div>
          <div class="font-bold text-sky-400 mb-1">สินทรัพย์</div>
          <div class="flex justify-between py-1 border-b border-slate-800/60 text-xs"><span class="text-slate-300">รวมสินทรัพย์</span><span class="font-mono text-sky-400">${fmtAmt(assets)}</span></div>
        </div>
        <div>
          <div class="font-bold text-rose-400 mb-1">หนี้สิน</div>
          <div class="flex justify-between py-1 border-b border-slate-800/60 text-xs"><span class="text-slate-300">รวมหนี้สิน</span><span class="font-mono text-rose-400">${fmtAmt(liabilities)}</span></div>
        </div>
        <div>
          <div class="font-bold text-violet-400 mb-1">ส่วนของผู้ถือหุ้น</div>
          <div class="flex justify-between py-1 border-b border-slate-800/60 text-xs"><span class="text-slate-300">ทุน + กำไรสะสม</span><span class="font-mono text-violet-400">${fmtAmt(equity)}</span></div>
          <div class="flex justify-between py-1 border-b border-slate-800/60 text-xs"><span class="text-slate-300">กำไร (ขาดทุน) งวดนี้</span><span class="font-mono ${net>=0?'text-emerald-400':'text-rose-400'}">${fmtAmt(net)}</span></div>
        </div>
        <div class="border-t-2 border-slate-700 pt-2 font-bold flex justify-between">
          <span class="text-white">หนี้สิน + ส่วนของผู้ถือหุ้น</span>
          <span class="font-mono text-fa-400">${fmtAmt(liabilities + equity + net)}</span>
        </div>
      </div>
    `;
  } else {
    title = 'Trial Balance';
    content = '<p class="text-xs text-slate-400">ดูรายละเอียดที่หน้า Trial Balance</p>';
  }

  modal.innerHTML = `
    <div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-2xl shadow-2xl">
      <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800">

  document.getElementById('modals-container').appendChild(modal);

function apprCheck(j){
  if (!j || j.status !== 'PENDING') return 'รายการนี้ไม่ได้อยู่ในสถานะรออนุมัติ';

  const miss = (j.lines || []).find(l => !accountByCode(l.account)); if (miss) return 'ไม่พบบัญชี ' + miss.account + ' ในผังบัญชี';

function rd(k, d){ try { const v = JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; } catch(e){ return d; } }
function wr(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ console.error('write', k, e); return false; } }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(v, dec){ const n = num(v); const d = dec != null ? dec : 2; return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtAmt(v){ return '฿' + fmt(v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return n<10?'0'+n:''+n; }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

function getMatches(){ return rd(K.MATCH, []); }
function setMatches(v){ return wr(K.MATCH, v); }
function getRecon(){ return rd(K.RECON, {}); }
function setRecon(v){ return wr(K.RECON, v); }

function getGLEntries(bankCode, fromDate, toDate){
  const bank = getBank(bankCode);
  if (!bank) return [];
  const glAcct = bank.glAccount;
  const entries = [];
  getJE().filter(j => j.status === 'POSTED' && j.date >= fromDate && j.date <= toDate).forEach(j => {
    (j.lines || []).forEach((l, idx) => {
      if (String(l.account) === String(glAcct)){
        entries.push({
          key: j.id + ':' + idx,
          jeId: j.id,
          date: j.date,
          description: l.description || j.description || '',
          ref: j.ref || '',
          debit: num(l.debit),
          credit: num(l.credit)
        });
      }
    });
  });
  entries.sort((a,b) => a.date.localeCompare(b.date) || a.jeId.localeCompare(b.jeId));
  return entries;

  return getStatement().filter(s => s.bankCode === bankCode && s.date >= fromDate && s.date <= toDate)

function parseCSV(text){
  const lines = String(text||'').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { error: 'CSV ต้องมีหัวตาราง + อย่างน้อย 1 แถว' };
  // Handle quoted cells (simple)
  function splitLine(line){
    const out = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++){
      const c = line[i];
      if (c === '"'){
        if (inQ && line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ){ out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(x => x.trim());
  }
  const header = splitLine(lines[0]).map(h => h.toLowerCase().replace(/^\uFEFF/, '').trim());
  const cIdx = {
    date:   header.findIndex(h => /date|วันที่/.test(h)),
    desc:   header.findIndex(h => /desc|description|รายการ|คำอธิบาย/.test(h)),
    amount: header.findIndex(h => /^amount|^amt|จำนวนเงิน(?!.*เดบิต)/.test(h)),
    debit:  header.findIndex(h => /debit|เดบิต/.test(h)),
    credit: header.findIndex(h => /credit|เครดิต/.test(h)),
    ref:    header.findIndex(h => /ref|reference|อ้างอิง|เอกสาร/.test(h))
  };
  if (cIdx.date < 0 || cIdx.desc < 0){ return { error: 'ต้องมีคอลัมน์ Date และ Description' }; }
  const isSplit = cIdx.debit >= 0 && cIdx.credit >= 0;
  if (!isSplit && cIdx.amount < 0){ return { error: 'ต้องมี Amount หรือ Debit+Credit' }; }

  const rows = [];
  for (let i = 1; i < lines.length; i++){
    const cells = splitLine(lines[i]);
    if (cells.length === 0 || !cells[cIdx.date]) continue;
    const debit  = isSplit ? num(cells[cIdx.debit])  : Math.max(0, num(cells[cIdx.amount]));
    const credit = isSplit ? num(cells[cIdx.credit]) : Math.max(0, -num(cells[cIdx.amount]));
    if (debit === 0 && credit === 0) continue;
    rows.push({
      date: normalizeDate(cells[cIdx.date]),
      description: cells[cIdx.desc] || '',
      ref: cIdx.ref >= 0 ? cells[cIdx.ref] : '',
      debit, credit
    });
  }
  return { rows, isSplit };
}

function normalizeDate(s){
  s = String(s||'').trim();
  if (!s) return todayISO();
  // YYYY-MM-DD
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // DD/MM/YYYY or DD-MM-YYYY
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return m[3]+'-'+pad2(+m[2])+'-'+pad2(+m[1]);
  // DD/MM/YY
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
  if (m) return '20'+m[3]+'-'+pad2(+m[2])+'-'+pad2(+m[1]);
  return todayISO();
}

function summaryCard(label, value, icon, cls, subtitle){
  const vCls = typeof value === 'number' && value < 0 ? 'text-rose-400' : cls;
  const display = typeof value === 'number' ? fmtAmt(Math.abs(value)) : value;
  const sign = typeof value === 'number' && value < 0 ? '−' : '';
  return `
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4">
      <div class="flex items-start justify-between mb-1">
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">${esc(label)}</p>
        <i class="fa-solid ${icon} text-slate-600 text-xs"></i>
      </div>
      <div class="text-xl font-bold font-mono ${vCls}">${sign}${display}</div>
      <div class="text-[10px] text-slate-500 mt-0.5">${esc(subtitle||'')}</div>
    </div>
  `;
}

/* ─────────── Actions ─────────── */
function toggleStmt(id, ev){
  if (ev && ev.target.tagName === 'INPUT'){ /* allow native checkbox */ }
  const matches = getMatches();
  if (matches.find(m => m.statementId === id)) return; // already matched
  if (state.selectedStmt.has(id)) state.selectedStmt.delete(id);
  else state.selectedStmt.add(id);
  refresh();
}
function toggleGL(key, ev){
  const matches = getMatches();
  if (matches.find(m => m.glKey === key)) return;
  if (state.selectedGL.has(key)) state.selectedGL.delete(key);
  else state.selectedGL.add(key);
  refresh();
}
function clearSelection(){
  state.selectedStmt.clear();
  state.selectedGL.clear();
  refresh();
}
function setFilter(f){
  state.filter = f;
  refresh();
}
function refresh(){
  const page = document.getElementById('page-bank');
  if (page) renderV2(page);
}

function matchSelected(){
  if (state.selectedStmt.size !== 1 || state.selectedGL.size !== 1){ toast('ต้องเลือก 1 Statement + 1 GL', 'warn'); return; }
  const stmtId = [...state.selectedStmt][0];
  const glKey  = [...state.selectedGL][0];
  const matches = getMatches();
  const match = {
    id: uid('match'),
    bankCode: state.bank,
    statementId: stmtId,
    glKey: glKey,
    matchedAt: new Date().toISOString(),
    matchedBy: (window.currentLoggedInUser && window.currentLoggedInUser.id) || 'system',
    method: 'MANUAL'
  };
  matches.push(match);
  setMatches(matches);
  state.selectedStmt.clear();
  state.selectedGL.clear();
  refresh();
  toast('✓ Match สำเร็จ');
}

function unmatchSelected(){
  const matches = getMatches();
  let removed = 0;
  if (state.selectedStmt.size > 0){
    for (const sid of state.selectedStmt){
      const idx = matches.findIndex(m => m.statementId === sid);
      if (idx >= 0){ matches.splice(idx,1); removed++; }
    }
  }
  if (state.selectedGL.size > 0){
    for (const gk of state.selectedGL){
      const idx = matches.findIndex(m => m.glKey === gk);
      if (idx >= 0){ matches.splice(idx,1); removed++; }
    }
  }
  setMatches(matches);
  state.selectedStmt.clear();
  state.selectedGL.clear();
  refresh();
  if (removed > 0) toast(`ยกเลิก ${removed} คู่`, 'info');
  else toast('ไม่มีรายการที่เลือกให้ Unmatch', 'warn');
}

function autoMatch(){
  if (!state.bank){ toast('เลือกธนาคารก่อน', 'warn'); return; }
  const range = getPeriodRange(state.period);
  const stmtAll = getStatementFor(state.bank, range.start, range.end);
  const glAll = getGLEntries(state.bank, range.start, range.end);
  const matches = getMatches();
  const matchedGL = new Set(matches.map(m => m.glKey));
  const matchedStmt = new Set(matches.map(m => m.statementId));
  const unmatched = stmtAll.filter(s => !matchedStmt.has(s.id));
  const glCand = glAll.filter(g => !matchedGL.has(g.key));

  let count = 0;
  unmatched.forEach(s => {
    for (const g of glCand){
      if (matchedGL.has(g.key)) continue;
      if (Math.abs(num(s.debit) - num(g.debit)) > 0.01) continue;
      if (Math.abs(num(s.credit) - num(g.credit)) > 0.01) continue;
      const days = Math.abs((new Date(s.date) - new Date(g.date)) / 86400000);
      if (days > 3) continue;
      matches.push({
        id: uid('match'),
        bankCode: state.bank,
        statementId: s.id,
        glKey: g.key,
        matchedAt: new Date().toISOString(),
        matchedBy: 'AUTO',
        method: 'AUTO'
      });
      matchedGL.add(g.key);
      matchedStmt.add(s.id);
      count++;
      break;
    }
  });

  setMatches(matches);
  refresh();
  if (count > 0) toast(`✓ Auto-match ${count} คู่`, 'success');
  else toast('ไม่พบรายการที่ตรงกัน (จำนวนเงินเท่ากัน ±3 วัน)', 'info');
}

function closeRecon(){
  const range = getPeriodRange(state.period);
  const stmtAll = getStatementFor(state.bank, range.start, range.end);
  const glAll = getGLEntries(state.bank, range.start, range.end);
  const matches = getMatchesFor(state.bank);
  const matchedGL = new Set(matches.map(m => m.glKey));
  const matchedStmt = new Set(matches.map(m => m.statementId));
  const unmatchedStmt = stmtAll.filter(s => !matchedStmt.has(s.id));
  const unmatchedGL = glAll.filter(g => !matchedGL.has(g.key));

  if (unmatchedStmt.length > 0 || unmatchedGL.length > 0){
    if (!confirm(`ยังมีรายการค้าง:\n• Statement ${unmatchedStmt.length} รายการ\n• GL ${unmatchedGL.length} รายการ\n\nต้องการปิดงวดหรือไม่? (รายการค้างจะถูกบันทึกเป็น "unreconciled")`)) return;
  }

  if (!confirm(`ยืนยันปิดงวด ${state.period} ของ ${state.bank}?\nหลังปิดจะไม่สามารถแก้ไขได้`)) return;

  const recon = getRecon();
  const key = state.bank + '|' + state.period;
  recon[key] = {
    closedAt: new Date().toISOString(),
    closedBy: (window.currentLoggedInUser && window.currentLoggedInUser.id) || 'system',
    stmtBalance: stmtAll.reduce((s,x) => s + num(x.debit) - num(x.credit), 0),
    glBalance: glAll.reduce((s,x) => s + num(x.debit) - num(x.credit), 0),
    matchedCount: matches.filter(m => stmtAll.some(s => s.id === m.statementId)).length,
    unmatchedStmt: unmatchedStmt.length,
    unmatchedGL: unmatchedGL.length
  };
  setRecon(recon);
  refresh();
  toast(`✓ ปิดงวด ${state.period} ของ ${state.bank} แล้ว`, 'success');
}

function confirmCSV(){
  if (!state.bank){ toast('เลือกธนาคารก่อน', 'warn'); return; }
  const file = document.getElementById('faBankCsvFile').files[0];
  if (!file){ toast('ยังไม่ได้เลือกไฟล์', 'warn'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const res = parseCSV(ev.target.result);
    if (res.error){ toast(res.error, 'error'); return; }
    const statement = getStatement();
    let added = 0, skipped = 0;
    res.rows.forEach(r => {
      // Dedup by date+description+debit+credit+ref
      const dup = statement.find(s => s.bankCode === state.bank && s.date === r.date && s.description === r.description && Math.abs(num(s.debit)-r.debit)<0.01 && Math.abs(num(s.credit)-r.credit)<0.01 && (s.ref||'') === (r.ref||''));
      if (dup){ skipped++; return; }
      statement.push({
        id: uid('stmt'),
        bankCode: state.bank,
        date: r.date, description: r.description, ref: r.ref,
        debit: r.debit, credit: r.credit,
        importedAt: new Date().toISOString(),
        source: 'CSV:' + file.name
      });
      added++;
    });
    setStatement(statement);
    document.getElementById('faBankCsvModal').remove();
    refresh();
    toast(`✓ Import ${added} รายการ${skipped>0?' · ข้ามซ้ำ '+skipped:''}`, 'success');
  };
  reader.readAsText(file, 'UTF-8');
}

function saveManual(){

  const debit = num(document.getElementById('mDebit').value);

  const statement = getStatement();

  setStatement(statement);

function generateTestLines(){
  if (!state.bank){ toast('เลือกธนาคารก่อน', 'warn'); return; }
  const range = getPeriodRange(state.period);
  const glAll = getGLEntries(state.bank, range.start, range.end);
  const matches = getMatches();
  const matchedGL = new Set(matches.map(m => m.glKey));
  const cand = glAll.filter(g => !matchedGL.has(g.key)).slice(0, 3);
  if (cand.length === 0){ toast('ไม่มี GL entries ให้ทดสอบ', 'warn'); return; }
  if (!confirm(`สร้าง ${cand.length} test statement lines ที่ mirror GL? (สำหรับทดสอบ Auto-Match เท่านั้น)`)) return;

  const statement = getStatement();
  cand.forEach(g => {
    statement.push({
      id: uid('stmt'),
      bankCode: state.bank,
      date: g.date,
      description: '[TEST] ' + g.description,
      ref: g.ref,
      debit: g.debit,
      credit: g.credit,
      importedAt: new Date().toISOString(),
      source: 'TEST'
    });
  });
  setStatement(statement);
  refresh();
  toast(`สร้าง ${cand.length} test lines แล้ว — ลองกด Auto-Match`, 'success');
}

  const original = window.switchPage;
  if (!original.__faBankV2Wrapped){

      const r = original.call(this, pageId);

          if (page) renderV2(page);
        }, 80);
      }
      return r;
    };
    window.switchPage.__faBankV2Wrapped = true;

  // If already on bank page
  setTimeout(() => {
    const page = document.getElementById('page-bank');
    if (page && !page.classList.contains('hidden') && !page.querySelector('[data-fa-bank-v2]')){
      renderV2(page);
    }
  }, 400);

  console.log('%c[FA-Bank-V2] ✅ ' + VER + ' ready', 'color:#22d3ee;font-weight:bold;font-size:13px');

  console.log('  → Dev: __faBank.*');
}

<script>
(function FA_PHASE2_ASSETS(){
'use strict';
if (window.__faAssetsV2) return;
window.__faAssetsV2 = true;

const VER = 'FA-PHASE2-ASSETS.1.0.0';
const K = { ASSETS:'fa_assets_v1', DEP_RUNS:'fa_dep_runs_v1', DISPOSALS:'fa_disposals_v1' };

const CATEGORIES = {
  land:       { label:'ที่ดิน',              icon:'fa-mountain',  life:null, noDep:true },
  building:   { label:'อาคาร',              icon:'fa-building',  life:20 },
  machinery:  { label:'เครื่องจักร',         icon:'fa-industry',  life:10 },
  vehicle:    { label:'ยานพาหนะ',           icon:'fa-car',       life:5  },
  equipment:  { label:'อุปกรณ์',             icon:'fa-tools',     life:5  },
  it:         { label:'คอมพิวเตอร์ / IT',     icon:'fa-laptop',    life:3  },
  furniture:  { label:'เครื่องใช้สำนักงาน',  icon:'fa-chair',     life:5  }
};

/* ─────────── Utils ─────────── */
function rd(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ console.error('write',k,e); return false; } }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function fmt(v,dec){ const n=num(v); const d=dec!=null?dec:2; return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtAmt(v){ return '฿'+fmt(v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return n<10?'0'+n:''+n; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function thDate(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?iso:pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg,type){ if(typeof window.showToast==='function'){ try{ window.showToast(msg,type); return; }catch(e){} } console.log('[Assets]',msg); }
function addMonths(period,n){ const [y,m]=period.split('-').map(Number); const t=y*12+(m-1)+n; return Math.floor(t/12)+'-'+pad2((t%12)+1); }
function monthEndISO(period){ const [y,m]=period.split('-').map(Number); const d=new Date(y,m,0); return y+'-'+pad2(m)+'-'+pad2(d.getDate()); }
function getCurrentPeriod(){ return (window.FA&&window.FA.currentPeriod)?window.FA.currentPeriod():(()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1);})(); }

/* ─────────── Storage ─────────── */
function getAssets(){ return rd(K.ASSETS,[]); }
function setAssets(v){ return wr(K.ASSETS,v); }
function getDepRuns(){ return rd(K.DEP_RUNS,[]); }
function setDepRuns(v){ return wr(K.DEP_RUNS,v); }
function getDisposals(){ return rd(K.DISPOSALS,[]); }
function setDisposals(v){ return wr(K.DISPOSALS,v); }

/* ─────────── Depreciation math ─────────── */
function getAccumDepBefore(assetId, period){
  return getDepRuns().filter(r => r.assetId===assetId && r.period < period).reduce((s,r)=>s+num(r.amount),0);
}
function getAccumDepThrough(assetId, period){
  return getDepRuns().filter(r => r.assetId===assetId && r.period <= period).reduce((s,r)=>s+num(r.amount),0);
}
function getBookValue(asset, period){
  return num(asset.acquisitionCost) - getAccumDepThrough(asset.id, period);
}

function calcMonthlyDep(asset, period){
  const cat = CATEGORIES[asset.category];
  if (!cat || cat.noDep) return null;
  if (asset.status !== 'active') return null;

  const acqPeriod = String(asset.acquisitionDate||'').slice(0,7);
  if (!acqPeriod) return null;
  const startPeriod = addMonths(acqPeriod, asset.depStartOffset != null ? asset.depStartOffset : 1);
  if (period < startPeriod) return null;

  const lifeMonths = (num(asset.usefulLifeYears) || cat.life || 0) * 12;
  if (!lifeMonths) return null;

  const cost = num(asset.acquisitionCost);
  const salvage = num(asset.salvageValue);
  const base = cost - salvage;
  const accumBefore = getAccumDepBefore(asset.id, period);
  if (accumBefore >= base - 0.01) return null;

  let amount;
  if (asset.depreciationMethod === 'declining_balance'){
    const rate = num(asset.decliningRate || 0) / 12;
    amount = Math.min((cost - accumBefore) * rate, base - accumBefore);
  } else {
    amount = Math.min(base / lifeMonths, base - accumBefore);
  }
  if (amount <= 0.005) return null;
  amount = Math.round(amount * 100) / 100;

  return {
    amount,
    accumBefore,
    accumAfter: accumBefore + amount,
    bookBefore: cost - accumBefore,
    bookAfter: cost - accumBefore - amount
  };
}

/* ─────────── JE helpers ─────────── */
function postJE(je){
  if (!je) return null;
  if (window.FA){
    for (const fn of ['postJE','addJE','saveJE','createJE']){
      if (typeof window.FA[fn]==='function'){ try{ const r=window.FA[fn](je); return (r&&r.id)||je.id; }catch(e){ console.warn('[Assets] FA.'+fn+' failed:',e.message); } }
    }
  }
  const keys = ['fa_journal_entries_v1','fa_journals_v1','fa_je_v1','fa_journal_v1','fa_gl_entries_v1'];
  for (const k of keys){
    try{
      const v = localStorage.getItem(k);
      if (v !== null){
        const list = JSON.parse(v);
        list.push(je);
        localStorage.setItem(k, JSON.stringify(list));
        return je.id;
      }
    }catch(e){}
  }
  console.warn('[Assets] ไม่สามารถบันทึก JE อัตโนมัติ — บันทึกแค่ dep_runs (post JE ด้วยตนเอง)');
  return null;
}

function buildDepJE(period, preview){
  if (preview.length === 0) return null;
  const accMap = {};
  preview.forEach(p => {
    const asset = getAssets().find(a=>a.id===p.assetId);
    if (!asset) return;
    const dep = asset.glDepAccount || '5910';
    const acc = asset.glAccumDepAccount || '1429';
    if (!accMap[dep]) accMap[dep] = { debit:0, credit:0 };
    if (!accMap[acc]) accMap[acc] = { debit:0, credit:0 };
    accMap[dep].debit += p.amount;
    accMap[acc].credit += p.amount;
  });
  const lines = Object.entries(accMap).filter(([,v]) => v.debit>0 || v.credit>0).map(([acct,v]) => ({
    account: acct,
    description: 'ค่าเสื่อมราคา ' + period,
    debit: Math.round(v.debit*100)/100,
    credit: Math.round(v.credit*100)/100
  }));
  return {
    id: uid('je'),
    date: monthEndISO(period),
    ref: 'DEP-' + period,
    description: 'ค่าเสื่อมราคาประจำเดือน ' + period,
    status: 'POSTED',
    source: 'ASSETS-DEP',
    lines
  };
}

function buildDisposalJE(asset, disposal){
  const accum = getAccumDepThrough(asset.id, disposal.disposalPeriod);
  const cost = num(asset.acquisitionCost);
  const nbv = cost - accum;
  const proceeds = num(disposal.proceeds);
  const gainLoss = proceeds - nbv;
  const lines = [];

  if (proceeds > 0){
    lines.push({ account: disposal.cashAccount || '1110', description: 'รับจากการจำหน่าย '+asset.name, debit: proceeds, credit: 0 });
  }
  if (accum > 0){
    lines.push({ account: asset.glAccumDepAccount || '1429', description: 'ตัดค่าเสื่อมสะสม '+asset.name, debit: accum, credit: 0 });
  }
  if (gainLoss < 0){
    lines.push({ account: disposal.glLossAccount || '5990', description: 'ขาดทุนจากการจำหน่าย '+asset.name, debit: Math.abs(gainLoss), credit: 0 });
  }
  lines.push({ account: asset.glAssetAccount || '1410', description: 'ตัดจำหน่าย '+asset.name, debit: 0, credit: cost });
  if (gainLoss > 0){
    lines.push({ account: disposal.glGainAccount || '4990', description: 'กำไรจากการจำหน่าย '+asset.name, debit: 0, credit: gainLoss });
  }

  return {
    id: uid('je'),
    date: disposal.disposalDate,
    ref: 'DISP-' + (asset.code||asset.id),
    description: 'จำหน่ายสินทรัพย์ ' + asset.name,
    status: 'POSTED',
    source: 'ASSETS-DISPOSAL',
    lines: lines.map(l => ({ ...l, debit: Math.round(l.debit*100)/100, credit: Math.round(l.credit*100)/100 }))
  };
}

/* ─────────── Tab: Reports ─────────── */
function renderReports(assets){
  const active = assets.filter(a=>a.status==='active');
  const byCat = {};
  active.forEach(a => {
    const cat = CATEGORIES[a.category] || { label:a.category };
    if (!byCat[a.category]) byCat[a.category] = { label:cat.label, cost:0, accum:0, book:0, count:0 };
    const accum = getAccumDepThrough(a.id, state.period);
    byCat[a.category].cost += num(a.acquisitionCost);
    byCat[a.category].accum += accum;

function setTab(t){ state.tab = t; refresh(); }
function setSearch(v){ state.search = v; refresh(); }
function setFilterCat(v){ state.filterCategory = v; refresh(); }
function refresh(){ const p = document.getElementById('page-assets'); if (p) renderV2(p); }

function runDep(){
  const period = state.period;
  const preview = getAssets().filter(a=>a.status==='active').map(a => {
    const d = calcMonthlyDep(a, period);
    return d ? { assetId:a.id, ...d } : null;
  }).filter(Boolean);
  if (preview.length === 0){ toast('ไม่มีรายการ', 'warn'); return; }
  const total = preview.reduce((s,p)=>s+p.amount,0);
  if (!confirm(`Run ค่าเสื่อมรอบ ${period}\n\n${preview.length} รายการ · รวม ${fmtAmt(total)}\n\nOK = สร้าง JE + บันทึก / Cancel = ยกเลิก`)) return;

  const je = buildDepJE(period, preview);
  const jeId = je ? postJE(je) : null;

  const runs = getDepRuns();
  preview.forEach(p => runs.push({
    id: uid('dep'), period, assetId: p.assetId, amount: p.amount,
    accumBefore: p.accumBefore, accumAfter: p.accumAfter,
    bookBefore: p.bookBefore, bookAfter: p.bookAfter,
    jeId, runAt: new Date().toISOString(),
    runBy: (window.currentLoggedInUser && window.currentLoggedInUser.id) || 'system'
  }));
  setDepRuns(runs);
  refresh();
  toast(`✓ Run ${preview.length} รายการ รวม ${fmtAmt(total)}` + (jeId?' (สร้าง JE)':' (ไม่มี JE — post เอง)'), 'success');
}

function deleteDepRun(period){
  if (!confirm(`ยกเลิกค่าเสื่อมรอบ ${period}?\n(JE ที่สร้างไว้จะไม่ถูกลบ — ต้องไปลบเองใน JE)`)) return;
  setDepRuns(getDepRuns().filter(r => r.period !== period));
  refresh();
  toast('ยกเลิกรอบ ' + period, 'info');
}

function deleteAsset(id){
  const a = getAssets().find(x=>x.id===id);
  if (!a) return;
  if (!confirm(`ลบสินทรัพย์ "${a.name}"?\n(dep_runs ที่เกี่ยวข้องจะยังอยู่ — แนะนำให้ใช้ "จำหน่าย" แทน)`)) return;
  setAssets(getAssets().filter(x=>x.id!==id));

  toast('ลบแล้ว', 'info');
}

function saveAsset(editId){
  const v = (id)=>document.getElementById(id).value;
  const errEl = document.getElementById('aErr');
  const code = v('aCode').trim(), name = v('aName').trim();
  const acqDate = v('aAcqDate');
  const cost = num(v('aCost'));
  if (!code || !name){ errEl.textContent='กรอกรหัสและชื่อ'; errEl.classList.remove('hidden'); return; }
  if (!acqDate){ errEl.textContent='กรอกวันที่ได้มา'; errEl.classList.remove('hidden'); return; }
  if (cost <= 0){ errEl.textContent='ราคาทุนต้องมากกว่า 0'; errEl.classList.remove('hidden'); return; }

  const assets = getAssets();
  const dup = assets.find(a => a.code === code && a.id !== editId);
  if (dup){ errEl.textContent='รหัสซ้ำ'; errEl.classList.remove('hidden'); return; }

  const data = {
    code, name,
    category: v('aCategory'),
    acquisitionDate: acqDate,
    acquisitionCost: cost,
    salvageValue: num(v('aSalvage')),
    usefulLifeYears: num(v('aLife')),
    depreciationMethod: v('aMethod'),
    decliningRate: num(v('aRate'))/100,
    glAssetAccount: v('aGlAsset'),
    glDepAccount: v('aGlDep'),
    glAccumDepAccount: v('aGlAccum'),
    location: v('aLocation'),
    custodian: v('aCustodian'),
    status: 'active',
    updatedAt: new Date().toISOString()
  };

  if (editId){
    const idx = assets.findIndex(a=>a.id===editId);
    assets[idx] = { ...assets[idx], ...data };
  } else {
    assets.push({ id: uid('ast'), ...data, createdAt: new Date().toISOString() });
  }
  setAssets(assets);
  document.getElementById('faAssetModal').remove();
  refresh();
  toast(editId?'แก้ไขแล้ว':'เพิ่มสินทรัพย์แล้ว', 'success');
}

function saveDispose(assetId){
  const a = getAssets().find(x=>x.id===assetId);
  if (!a) return;
  const v = (id)=>document.getElementById(id).value;
  const disposalDate = v('dDate');
  const proceeds = num(v('dProceeds'));
  if (!disposalDate){ document.getElementById('dErr').textContent='กรอกวันที่'; document.getElementById('dErr').classList.remove('hidden'); return; }

  const accum = getAccumDepThrough(a.id, state.period);
  const cost = num(a.acquisitionCost);
  const nbv = cost - accum;

  const disposal = {
    id: uid('disp'),
    assetId: a.id, assetCode: a.code, assetName: a.name,
    disposalDate, disposalPeriod: disposalDate.slice(0,7),
    cost, accum, nbv, proceeds,
    cashAccount: v('dCash'), glGainAccount: v('dGain'), glLossAccount: v('dLoss')
  };
  const je = buildDisposalJE(a, disposal);
  const jeId = je ? postJE(je) : null;
  disposal.jeId = jeId;
  disposal.disposedAt = new Date().toISOString();

  const disposals = getDisposals();
  disposals.push(disposal);
  setDisposals(disposals);

  const assets = getAssets();
  const idx = assets.findIndex(x=>x.id===assetId);
  assets[idx].status = 'disposed';
  assets[idx].disposedAt = disposalDate;
  setAssets(assets);

  document.getElementById('faDisposeModal').remove();
  refresh();
  toast('จำหน่ายแล้ว' + (jeId?' (สร้าง JE)':' (post JE เอง)'), 'success');
}

/* ─────────── Export ─────────── */
function exportCSV(){
  const assets = getAssets().filter(a=>a.status==='active');
  const lines = ['Code,Name,Category,AcquisitionDate,Cost,Salvage,LifeYrs,Method,AccumDep,BookValue'];
  assets.forEach(a => {
    const accum = getAccumDepThrough(a.id, state.period);
    const book = num(a.acquisitionCost) - accum;
    lines.push([a.code, a.name, a.category, a.acquisitionDate, a.acquisitionCost, a.salvageValue||0, a.usefulLifeYears, a.depreciationMethod, accum.toFixed(2), book.toFixed(2)].map(x=>`"${String(x||'').replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `assets_${state.period}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('Export CSV แล้ว', 'success');
}

    num(v){ const n=parseFloat(v); return isFinite(n)?n:0; },
