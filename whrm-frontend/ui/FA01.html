 <!-- ═══════════════════════════════════════════════════════════
     [FA-AUTO-SIDEBAR-INJECT] v3 — เมนูครบทุก Phase (1 ถึง 5)
     ═══════════════════════════════════════════════════════════ -->
<script>
(function FA_AUTO_SIDEBAR_V3(){
  setTimeout(() => {
    // ค้นหาตำแหน่งเมนูหลัก (เช่น Bank Reconciliation หรือ Fixed Assets)
    const allElements = document.querySelectorAll('a, button, li, div[onclick]');
    let anchor = null;
    for (let el of allElements) {
      const text = el.textContent || '';
      const onclick = el.getAttribute('onclick') || '';
      if (text.includes('Bank Reconciliation') || text.includes('Fixed Assets') || onclick.includes("switchPage('bank')")) {
        if (el.closest('aside') || el.closest('nav') || el.parentElement.tagName === 'UL' || el.parentElement.tagName === 'DIV') {
          anchor = el; break;
        }
      }
    }

    if (!anchor) {
      console.warn('[Auto-Sidebar v3] ❌ หาเมนูหลักไม่เจอ (กรุณาใช้วิธีที่ 1)');
      return;
    }

    // ดึง class ของเมนูเดิมมาใช้เพื่อให้หน้าตาเหมือนกันเป๊ะ
    const originalClass = anchor.className;
    
    // รายชื่อเมนูทั้งหมด
    const menus = [
      { id: 'asset-adj', icon: 'fa-right-left', name: 'Transfer / Reval' },
      { id: 'aging', icon: 'fa-clock', name: 'AR/AP Aging' },
      { id: 'fx', icon: 'fa-dollar-sign', name: 'Currency & FX' },
      { id: 'reports', icon: 'fa-chart-line', name: 'Financial Reports' },
      { id: 'tax', icon: 'fa-file-invoice', name: 'Tax Reports' },
      { id: 'period-lock', icon: 'fa-lock', name: 'Period Lock' },
      { id: 'budget', icon: 'fa-scale-balanced', name: 'Budget vs Actual' },
      { id: 'audit', icon: 'fa-clipboard-list', name: 'Audit Trail' },
      { id: 'tax-compliance', icon: 'fa-scale-balanced', name: 'Tax & Compliance' },
      { id: 'planning', icon: 'fa-chart-pie', name: 'Planning (CAPEX/OPEX)' },
      { id: 'coq', icon: 'fa-award', name: 'Cost of Quality' }
    ];

    // แปลงเป็น HTML
    let newMenuHTML = '';
    menus.forEach(m => {
      newMenuHTML += `
        <a href="#" onclick="event.preventDefault();switchPage('${m.id}')" class="${originalClass}">
          <i class="fa-solid ${m.icon} w-4 text-center"></i><span class="ml-2">${m.name}</span>
        </a>
      `;
    });

    // ตรวจสอบว่าเคยแทรกหรือยัง (กันซ้ำซ้อน)
    if (document.getElementById('fa-auto-menus-inserted')) return;
    
    const wrapper = document.createElement('div');
    wrapper.id = 'fa-auto-menus-inserted';
    wrapper.innerHTML = newMenuHTML;

    // แทรกต่อท้ายเมนูหลัก
    anchor.parentElement.insertBefore(wrapper, anchor.nextSibling);
    console.log('✅ [Auto-Sidebar v3] แทรกเมนู 11 หน้า (ครบ Phase 5) สำเร็จ!');
  }, 1500);
})();

</script><!-- ═══════════════════════════════════════════════════════════
     [FA-PHASE5-COQ-FULL] v2.0.0 — Cost of Quality + Business Metrics
     รวม Dashboard, COPQ, Hidden Costs, COP, Defect Logs ไว้ในที่เดียว
     ═══════════════════════════════════════════════════════════ -->
<script>
(function FA_PHASE5_COQ_FULL(){
'use strict';
const U = window.__FA3;
if (!U) { console.error('[FA-COQ] Requires Phase 3-A'); return; }
const VER = 'FA-PHASE5-COQ-FULL.2.0.0';
if (window.__faCoqFull) return;
window.__faCoqFull = true;

const K = { 
  RECORDS: 'fa_coq_records_v1', 
  RATES: 'fa_coq_rates_v1',
  HIDDEN: 'fa_coq_hidden_v1',
  COP: 'fa_coq_cop_v1',
  SALES: 'fa_coq_sales_v1'
};
const state = { tab: 'dashboard', period: U.getCurrentPeriod() };

const CATEGORIES = {
  prevention: { label: 'Prevention (ป้องกัน)', icon: 'fa-shield-halved', color: 'text-emerald-400' },
  appraisal: { label: 'Appraisal (ตรวจสอบ)', icon: 'fa-magnifying-glass', color: 'text-cyan-400' },
  internal: { label: 'Internal Failure (ของเสียในระบบ)', icon: 'fa-trash', color: 'text-amber-400' },
  external: { label: 'External Failure (ของเสียถึงลูกค้า)', icon: 'fa-triangle-exclamation', color: 'text-rose-400' }
};

function getRecords() { return U.rd(K.RECORDS, []); }
function getRates() { return U.rd(K.RATES, {}); }
function getHidden() { return U.rd(K.HIDDEN, []); }
function getCOP() { return U.rd(K.COP, []); }
function getSales() { return U.rd(K.SALES, {}); }

// ═══════════════════════════════════════════════════════════
// Main Render
// ═══════════════════════════════════════════════════════════
function render(container) {
  container.innerHTML = `
    <div class="space-y-3" data-fa-coq-full="1">
      <div class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 flex flex-wrap items-center gap-3">
        <i class="fa-solid fa-award text-cyan-400"></i>
        <span class="text-white font-bold text-sm">Cost of Quality & Waste Analysis</span>
        <div class="flex items-center gap-2 ml-auto">
          <input id="coqPeriod" type="month" value="${U.esc(state.period)}" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono">
          <button onclick="__faCoqFull.refresh()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        ${tabBtn('dashboard', 'fa-chart-pie', 'Dashboard')}
        ${tabBtn('copq', 'fa-percent', 'COPQ % Revenue')}
        ${tabBtn('hidden', 'fa-eye-slash', 'Hidden Costs')}
        ${tabBtn('cop', 'fa-calculator', 'Cost of Process')}
        ${tabBtn('records', 'fa-list', 'Defect Logs (NCR)')}
        ${tabBtn('settings', 'fa-gear', 'Standard Rates')}
      </div>

      ${state.tab === 'dashboard' ? renderDashboard() : 
        state.tab === 'copq' ? renderCOPQ() : 
        state.tab === 'hidden' ? renderHidden() : 
        state.tab === 'cop' ? renderCOP() :
        state.tab === 'records' ? renderRecords() :
        renderSettings()}
    </div>`;

  const per = container.querySelector('#coqPeriod');
  if (per) per.onchange = (e) => { if (/^\d{4}-\d{2}$/.test(e.target.value)) { state.period = e.target.value; render(container); } };
}

function tabBtn(id, icon, label) {
  const active = state.tab === id;
  return `<button onclick="__faCoqFull.setTab('${id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${active?'bg-fa-600 text-white':'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><i class="fa-solid ${icon} mr-1"></i>${label}</button>`;
}

// ═══════════════════════════════════════════════════════════
// Tab 1: Dashboard
// ═══════════════════════════════════════════════════════════
function renderDashboard() {
  const records = getRecords().filter(r => r.period === state.period);
  const totals = { prevention: 0, appraisal: 0, internal: 0, external: 0 };
  records.forEach(r => { if (totals[r.category] !== undefined) totals[r.category] += U.num(r.totalCost); });
  
  const grandTotal = Object.values(totals).reduce((s, v) => s + v, 0);
  const failureTotal = totals.internal + totals.external;
  const controlTotal = totals.prevention + totals.appraisal;

  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      ${Object.entries(CATEGORIES).map(([key, cat]) => `
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4">
          <div class="flex items-start justify-between mb-1"><p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">${cat.label}</p><i class="fa-solid ${cat.icon} ${cat.color} text-xs"></i></div>
          <div class="text-xl font-bold font-mono ${cat.color}">${U.fmt(totals[key])}</div>
          <div class="text-[10px] text-slate-500 mt-0.5">${grandTotal > 0 ? ((totals[key]/grandTotal)*100).toFixed(1) + '%' : '0%'} ของ COQ</div>
        </div>
      `).join('')}
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row items-center gap-6">
      <div class="flex-1 w-full">
        <h4 class="font-bold text-sm text-white mb-3">Control vs Failure</h4>
        <div class="w-full bg-slate-900 h-6 rounded-full overflow-hidden flex">
          <div class="bg-emerald-500 h-full text-[10px] flex items-center justify-center font-bold text-white" style="width: ${grandTotal > 0 ? (controlTotal/grandTotal)*100 : 0}%">Control</div>
          <div class="bg-rose-500 h-full text-[10px] flex items-center justify-center font-bold text-white" style="width: ${grandTotal > 0 ? (failureTotal/grandTotal)*100 : 0}%">Failure</div>
        </div>
        <div class="flex justify-between text-xs mt-2 text-slate-400">
          <span>Control: ${U.fmtAmt(controlTotal)}</span>
          <span>Failure: ${U.fmtAmt(failureTotal)}</span>
        </div>
      </div>
      <div class="text-center">
        <p class="text-xs text-slate-400 mb-1">Total COQ</p>
        <p class="text-3xl font-bold font-mono text-white">${U.fmtAmt(grandTotal)}</p>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// Tab 2: COPQ
// ═══════════════════════════════════════════════════════════
function renderCOPQ() {
  const records = getRecords().filter(r => r.period === state.period);
  const failureTotal = records.filter(r => r.category === 'internal' || r.category === 'external').reduce((s, r) => s + U.num(r.totalCost), 0);
  
  const salesData = getSales()[state.period] || {};
  const netSales = U.num(salesData.netSales);
  const copqPct = netSales > 0 ? (failureTotal / netSales) * 100 : 0;

  return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5">
      <h4 class="font-bold text-sm text-white mb-3">ข้อมูลยอดขาย (Net Sales)</h4>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">ยอดขายสุทธิประจำเดือน (บาท)</label>
          <input id="netSales" type="number" value="${netSales}" oninput="__faCoqFull.calcCOPQUI()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right">
        </div>
        <div class="bg-slate-900 rounded-lg p-3 text-sm flex justify-between items-center">
          <span class="text-slate-400">ต้นทุน Failure (COPQ):</span>
          <span class="font-bold font-mono text-rose-400">${U.fmtAmt(failureTotal)}</span>
        </div>
        <div class="bg-slate-900 rounded-lg p-3 text-sm flex justify-between items-center">
          <span class="text-slate-400">COPQ (% ของยอดขาย):</span>
          <span id="copqPct" class="font-bold font-mono text-amber-400 text-lg">${copqPct.toFixed(2)}%</span>
        </div>
        <p class="text-[10px] text-slate-500">* COPQ ที่ดีควรต่ำกว่า 5% ของยอดขาย (มาตรฐานสากล)</p>
      </div>
    </div>
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 flex flex-col justify-center items-center">
      <p class="text-xs text-slate-400 mb-2">COPQ Ratio</p>
      <div class="text-5xl font-bold font-mono ${copqPct > 5 ? 'text-rose-400' : 'text-emerald-400'}">${copqPct.toFixed(1)}%</div>
      <p class="text-xs text-slate-400 mt-2 text-center">ของยอดขายคือต้นทุนความไม่มีคุณภาพ</p>
    </div>
  </div>`;
}

function calcCOPQUI() {
  const val = U.num(document.getElementById('netSales').value);
  const records = getRecords().filter(r => r.period === state.period);
  const failureTotal = records.filter(r => r.category === 'internal' || r.category === 'external').reduce((s, r) => s + U.num(r.totalCost), 0);
  const pct = val > 0 ? (failureTotal / val) * 100 : 0;
  document.getElementById('copqPct').textContent = pct.toFixed(2) + '%';
}

// ═══════════════════════════════════════════════════════════
// Tab 3: Hidden Costs
// ═══════════════════════════════════════════════════════════
function renderHidden() {
  const hiddenList = getHidden().filter(h => h.period === state.period);
  const totalHidden = hiddenList.reduce((s, h) => s + U.num(h.amount), 0);

  return `<div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden">
    <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between">
      <h4 class="font-bold text-sm text-white">วิเคราะห์ต้นทุนแฝง (Hidden Costs)</h4>
      <button onclick="__faCoqFull.openAddHidden()" class="px-3 py-1.5 rounded-lg bg-fa-600 hover:bg-fa-500 text-white text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>เพิ่มรายการ</button>
    </div>
    ${hiddenList.length === 0 ? `<div class="p-10 text-center text-slate-500 text-xs">ยังไม่มีรายการต้นทุนแฝง</div>` : `
      <table class="w-full text-xs"><thead class="bg-slate-900 text-slate-400"><tr>
        <th class="text-left py-2 px-3">ประเภท</th>
        <th class="text-left py-2 px-3">รายละเอียด</th>
        <th class="text-right py-2 px-3">มูลค่า (ประมาณการ)</th>
        <th class="text-center py-2 px-3">Actions</th>
      </tr></thead><tbody>
        ${hiddenList.map(h => `<tr class="border-b border-slate-800/60">
          <td class="py-2 px-3 font-bold text-amber-400">${U.esc(h.type)}</td>
          <td class="py-2 px-3 text-white">${U.esc(h.description)}</td>
          <td class="py-2 px-3 text-right font-mono text-rose-400">${U.fmt(h.amount)}</td>
          <td class="py-2 px-3 text-center"><button onclick="__faCoqFull.delHidden('${h.id}')" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button></td>
        </tr>`).join('')}
        <tr class="bg-slate-900 font-bold"><td colspan="2" class="py-2 px-3 text-right text-white">รวมต้นทุนแฝง</td><td class="py-2 px-3 text-right font-mono text-amber-400">${U.fmt(totalHidden)}</td><td></td></tr>
      </tbody></table>
    `}
  </div>`;
}

function openAddHidden() {
  const m = document.createElement('div');
  m.id = 'hiddenModal';
  m.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4';
  m.innerHTML = `<div class="bg-slate-950 border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800"><h3 class="font-bold text-white">เพิ่มต้นทุนแฝง</h3><button onclick="document.getElementById('hiddenModal').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="p-5 space-y-3">
      <div><label class="block text-xs text-slate-400 mb-1">ประเภท *</label><select id="hnType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        <option value="Lost Sales">Lost Sales (ยอดขายที่หายไป)</option>
        <option value="Rework Labor">Rework Labor (แรงงานซ่อม)</option>
        <option value="Cycle Time Delay">Cycle Time Delay (เวลาล่าช้า)</option>
        <option value="Market Share Loss">Market Share Loss</option>
        <option value="Other">อื่นๆ</option>
      </select></div>
      <div><label class="block text-xs text-slate-400 mb-1">รายละเอียด</label><input id="hnDesc" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-xs text-slate-400 mb-1">มูลค่า (ประมาณการ) *</label><input id="hnAmt" type="number" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono text-right"></div>
    </div>
    <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button onclick="document.getElementById('hiddenModal').remove()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs">ยกเลิก</button><button onclick="__faCoqFull.saveHidden()" class="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold">บันทึก</button></div>
  </div>`;
  document.body.appendChild(m);
}

function saveHidden() {
  const type = document.getElementById('hnType').value;
  const desc = document.getElementById('hnDesc').value.trim();
  const amt = U.num(document.getElementById('hnAmt').value);
  if (!desc || amt <= 0) { U.toast('กรอกข้อมูลไม่ครบ', 'warn'); return; }
  const list = getHidden();
  list.push({ id: U.uid('hn'), period: state.period, type, description: desc, amount: amt, createdAt: new Date().toISOString() });
  U.wr(K.HIDDEN, list);
  document.getElementById('hiddenModal').remove();
  refresh();
  U.toast('บันทึกต้นทุนแฝงแล้ว', 'success');
}

function delHidden(id) {
  if (!confirm('ลบ?')) return;
  U.wr(K.HIDDEN, getHidden().filter(x => x.id !== id));
  refresh();
}

// ═══════════════════════════════════════════════════════════
// Tab 4: Cost of Process (COP)
// ═══════════════════════════════════════════════════════════

function calcCOPUI() {
  const rm = U.num(document.getElementById('copRM').value);
  const labor = U.num(document.getElementById('copLabor').value);
  const oh = U.num(document.getElementById('copOH').value);
  const qty = U.num(document.getElementById('copQty').value);
  const total = rm + labor + oh;
  const unit = qty > 0 ? total / qty : 0;
  
  document.getElementById('copTotalCost').textContent = U.fmt(total);
  document.getElementById('copUnitCost').textContent = U.fmt(unit);
  
  if(total > 0 && qty > 0) {
    const list = getCOP();
    list.push({ id: U.uid('cop'), period: state.period, date: U.todayISO(), totalCost: total, qty, unitCost: unit });
    U.wr(K.COP, list);
    U.toast('บันทึกผลการคำนวณแล้ว', 'success');
    setTimeout(refresh, 500);
  }
}

function calcCost() {
  const qty = U.num(document.getElementById('cqQty').value);
  const rate = U.num(document.getElementById('cqRate').value);
  document.getElementById('cqTotal').textContent = U.fmt(qty * rate) + ' บาท';
}

function saveRecord() {
  const date = document.getElementById('cqDate').value;
  const cat = document.getElementById('cqCat').value;
  const desc = document.getElementById('cqDesc').value.trim();
  const qty = U.num(document.getElementById('cqQty').value);
  const unit = document.getElementById('cqUnit').value.trim() || 'ชิ้น';
  const rate = U.num(document.getElementById('cqRate').value);
  
  if (!date || !desc || qty <= 0) { U.toast('กรอกข้อมูลไม่ครบ', 'warn'); return; }
  
  const list = getRecords();
  list.push({ id: U.uid('coq'), period: state.period, date, category: cat, description: desc, qty, unit, rate, totalCost: qty * rate, createdAt: new Date().toISOString() });
  U.wr(K.RECORDS, list);
  
  document.getElementById('coqModal').remove();
  refresh();
  U.toast('บันทึกของเสียแล้ว', 'success');
}

function delRecord(id) {
  if (!confirm('ลบรายการนี้?')) return;
  U.wr(K.RECORDS, getRecords().filter(x => x.id !== id));
  refresh();
}

  window.postProdCostJE = function(jobId) {

    const jobs = U.rd(K_JOBS, []);
    const idx = jobs.findIndex(j => j.id === jobId);
    if (idx < 0) return;
    const job = jobs[idx];

    const jeId = U.uid('je');
    const lines = [];
    lines.push({ account: '1320', description: `โอนต้นทุนผลิต ${job.jobNo}`, debit: total, credit: 0 });

    if (oh > 0) lines.push({ account: '2400', description: `โสหุ้ยการผลิต ${job.jobNo}`, debit: 0, credit: oh });

    const je = { id: jeId, date: U.todayISO(), ref: `JOB-${job.jobNo}`, description: `บันทึกต้นทุนการผลิต: ${job.name}`, status: 'POSTED', source: 'PP301', lines: lines };

    jobs[idx].faPosted = true;
    jobs[idx].faJeId = jeId;
    jobs[idx].faTotalCost = total;
    U.wr(K_JOBS, jobs);

    document.getElementById('faProdCostModal').remove();
    
    const page = document.getElementById('page-production-cost');
    if(page) renderUI(page);
    
    U.toast(`บันทึกบัญชีสำเร็จ: ${U.fmtAmt(total)}`, 'success');
  };

  window.refreshProdCost = function() {
    const page = document.getElementById('page-production-cost');
    if(page) renderUI(page);
    U.toast('รีเฟรชข้อมูลแล้ว', 'info');
  };

  // ─────────────────────────────────────────────────────────────
  // 4. ระบบเฝ้าระวัง DOM (MutationObserver)
  // ─────────────────────────────────────────────────────────────
  
  function startObserver() {
    const observer = new MutationObserver(() => {
      // 1. จัดการ Header Title ให้ถูกต้อง
      const activeNav = document.querySelector('.fa-nav-item.active');
      if (activeNav) {
        const pageId = activeNav.getAttribute('data-nav');
        const PAGE_TITLES = {
          'coq': 'Cost of Quality',
          'planning': 'Planning (CAPEX/OPEX)',
          'asset-adj': 'Transfer / Revaluation',
          'aging': 'AR/AP Aging',
          'fx': 'Currency & FX',
          'period-lock': 'Period Lock',
          'budget': 'Budget vs Actual',
          'audit': 'Audit Trail',
          'tax-compliance': 'Tax & Compliance'
        };
        const title = PAGE_TITLES[pageId];
        if (title) {
          const titleEl = document.getElementById('pageTitle');
          if (titleEl && titleEl.innerHTML.indexOf(title) === -1) {
            titleEl.innerHTML = `<i class="fa-solid fa-circle text-fa-400 text-[10px]"></i><span>${title}</span>`;
          }
        }
      }

      // 2. เขียนทับหน้า Production Cost
      const prodPage = document.getElementById('page-production-cost');
      if (prodPage && !prodPage.classList.contains('hidden')) {
        if (prodPage.innerHTML.includes('Production Cost Card')) {
          renderUI(prodPage);
        }
      }
    });
    
    // เฝ้าดูการเปลี่ยนแปลงในเนื้อหาหลัก
    observer.observe(document.getElementById('content-area'), { childList: true, subtree: true });
  }

  // เริ่มทำงานทันที
  window.addEventListener('load', startObserver);

})();
</script>

function bar(){
  const ok = isApprover();
  return '<div class="flex items-center justify-between gap-3 flex-wrap bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 mb-3 text-xs"><span class="text-slate-400">ผู้อนุมัติ JE: <b class="text-white">' + approvers().map(esc).join(', ') + '</b> · ' + (ok ? '<span class="text-emerald-400">คุณเข้าสู่ระบบในฐานะผู้อนุมัติ</span>' : '<span class="text-amber-400">คุณยังไม่ได้เข้าสู่ระบบด้วยบัญชีผู้อนุมัติ (ดูได้ แต่อนุมัติไม่ได้)</span>') + '</span><button onclick="__faAuth.openManage()" class="px-3 py-1 rounded-lg bg-slate-800 text-slate-200 font-semibold">จัดการ / โอนสิทธิ</button></div>';
}
window.__faAuth = { version: VER, login, logout, check, isApprover, approvers, current, setApprovers, openManage, saveManage, bar, get, DENY, status: () => ({ approvers: approvers(), me: current(), isApprover: isApprover(), disabled: disabled() }) };
console.log('%c[FA-AUTH] ✅ ' + VER + ' — ผู้อนุมัติ: ' + approvers().join(', '), 'color:#fbbf24;font-weight:bold');
})();
</script>
<!-- [FA-AUTH-END] -->

<!-- ═══════════════════════════════════════════════════════════
     [FA-CNDN-LINK-BEGIN] v1.0.0 — รับใบลดหนี้/ใบเพิ่มหนี้จาก BD02 (สัญญา BD02.CNDN.FIN v1.1)
     หลักการ:
       · รับเหตุการณ์ FIN_CNDN_EVENT ทาง whrm-bus (หรือนำเข้าไฟล์ Outbox) เข้า "กล่องรับ CN/DN" — ยังไม่ลงบัญชี
       · สร้าง JE สถานะ "รออนุมัติ" (PENDING) ตามบัญชีปลายทางที่เลือกในหน้านี้ — ฝ่ายบัญชีกดอนุมัติ/ปฏิเสธ
       · เมื่ออนุมัติ: Post JE + ตัดใบแจ้งหนี้ (CN) หรือสร้างลูกหนี้ใหม่ (DN) + แจ้งกลับ BD02 (FA_CNDN_STATUS / FA_CNDN_AR)
       · ข้อมูลเก็บแยกคีย์ fa_cndn_* · ใช้ FA.getAR/setAR/getJE/setJE/getCOA/setCOA เท่านั้น ไม่แตะโค้ดเดิม
       · ปิดทั้งบล็อกได้ด้วย localStorage fa_cndn_disabled=1 · Rollback: ลบบล็อกนี้ทั้งหมด
     ═══════════════════════════════════════════════════════════ -->
<script>
(function FA_CNDN_LINK(){
'use strict';
if (window.__faCndn) return;
try { if (/^(1|true)$/.test(localStorage.getItem('fa_cndn_disabled') || '')) return; } catch(e){}
window.__faCndn = true;

const VER = 'FA-CNDN-LINK.1.0.0';
const K = { CFG:'fa_cndn_cfg_v1', IN:'fa_cndn_inbox_v1', AUDIT:'fa_audit_log_v1' };
const BUS = 'whrm-bus', CONTRACT = 'BD02.CNDN.FIN', REPLY_CONTRACT = 'BD02.CNDN.FA-REPLY', MAXBOX = 500;
const EPS = 0.011;

/* ─────────── Utils ─────────── */
function rd(k, d){ try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch(e){ return d; } }
function wr(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ console.error('[FA-CNDN] write', k, e); return false; } }
function num(v){ const n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : 0; }
function r2(n){ return Math.round((n + (n < 0 ? -1e-9 : 1e-9)) * 100) / 100; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(v){ return num(v).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function thDate(iso){ if (!iso) return '-'; const d = new Date(iso + (String(iso).length <= 10 ? 'T12:00:00' : '')); return isNaN(d) ? String(iso) : pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); }
function clean(s, n){ return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, n || 200); }
function norm(s){ return String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase(); }
function toast(m, t){ try { if (typeof window.showToast === 'function') window.showToast(m, t || 'info'); } catch(e){} }
function who(){ const u = window.currentLoggedInUser; return u && u.id ? u.id : 'guest'; }
const FAAPI = () => window.FA || {};
const getCOA = () => (FAAPI().getCOA ? FAAPI().getCOA() : rd('fa_coa_v1', []));
const setCOA = v => (FAAPI().setCOA ? FAAPI().setCOA(v) : wr('fa_coa_v1', v));
const getJE  = () => (FAAPI().getJE ? FAAPI().getJE() : rd('fa_journal_v1', []));
const setJE  = v => (FAAPI().setJE ? FAAPI().setJE(v) : wr('fa_journal_v1', v));
const getAR  = () => (FAAPI().getAR ? FAAPI().getAR() : rd('fa_ar_invoices_v1', []));
const setAR  = v => (FAAPI().setAR ? FAAPI().setAR(v) : wr('fa_ar_invoices_v1', v));
function newId(prefix){ return typeof window.__pmpDocNo === 'function' ? window.__pmpDocNo(prefix) : prefix + Date.now().toString(36).toUpperCase(); }
function audit(action, details){
  const log = rd(K.AUDIT, []); log.unshift({ at: new Date().toISOString(), user: who(), action, details: details || {} });
  if (log.length > 500) log.length = 500; wr(K.AUDIT, log);
}
function locked(date){ try { return !!(window.__faLock && typeof window.__faLock.isLocked === 'function' && window.__faLock.isLocked(String(date).slice(0, 7))); } catch(e){ return false; } }

/* ─────────── ตั้งค่า (บัญชีปลายทางเลือกที่ FA) ─────────── */
const CFG_DEF = { receive: true, accounts: { CN: { adjust:'', vat:'2130', ar:'1130' }, DN: { revenue:'', vat:'2130', ar:'1130' } } };
function cfg(){
  const c = rd(K.CFG, {}) || {};
  return { receive: c.receive !== false, accounts: { CN: Object.assign({}, CFG_DEF.accounts.CN, (c.accounts || {}).CN || {}), DN: Object.assign({}, CFG_DEF.accounts.DN, (c.accounts || {}).DN || {}) } };
}
function setCfg(c){ return wr(K.CFG, c); }
function acct(code){ return getCOA().find(a => a.code === code) || null; }
function acctOk(code){ const a = acct(code); return !!a && !a.isHeader && a.active !== false; }
function acctLabel(code){ const a = acct(code); return a ? code + ' ' + a.name : (code || '(ยังไม่ได้เลือก)'); }
function need(type){
  const a = cfg().accounts[type];
  const miss = [];
  if (type === 'CN' && !acctOk(a.adjust)) miss.push('บัญชีปรับลดรายได้ (ใบลดหนี้)');
  if (type === 'DN' && !acctOk(a.revenue)) miss.push('บัญชีรายได้ (ใบเพิ่มหนี้)');
  if (!acctOk(a.vat)) miss.push('บัญชีภาษีขาย');
  if (!acctOk(a.ar)) miss.push('บัญชีลูกหนี้');
  return miss;
}

/* ─────────── กล่องรับ ─────────── */
const ST = {
  RECEIVED:   { label:'รับแล้ว',            cls:'bg-slate-700 text-slate-300' },
  NEEDS_CONFIG:{ label:'ต้องตั้งค่าบัญชี',  cls:'bg-amber-500/20 text-amber-400 border border-amber-500/30' },
  NEEDS_AR:   { label:'เลือกใบแจ้งหนี้',    cls:'bg-amber-500/20 text-amber-400 border border-amber-500/30' },
  PENDING_JE: { label:'JE รออนุมัติ',       cls:'bg-sky-500/20 text-sky-400 border border-sky-500/30' },
  POSTED:     { label:'ลงบัญชีแล้ว',        cls:'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' },
  BLOCKED:    { label:'ติดปัญหา',           cls:'bg-rose-500/20 text-rose-400 border border-rose-500/30' },
  REJECTED:   { label:'ปฏิเสธแล้ว',         cls:'bg-slate-700 text-slate-500' },
  CANCELLED:  { label:'ยกเลิกก่อนลงบัญชี',  cls:'bg-slate-700 text-slate-500' }
};
const ACTIVE = ['NEEDS_CONFIG', 'NEEDS_AR', 'PENDING_JE', 'BLOCKED', 'RECEIVED'];
function inbox(){ const a = rd(K.IN, []); return Array.isArray(a) ? a : []; }
function saveBox(list){
  if (list.length > MAXBOX){
    const keep = list.filter(x => ACTIVE.indexOf(x.status) >= 0 || x.status === 'POSTED');
    list = keep.length > MAXBOX ? keep.slice(0, MAXBOX) : list.slice(0, MAXBOX);
  }
  return wr(K.IN, list);
}
function upd(key, fn){
  const list = inbox(), it = list.find(x => x.key === key); if (!it) return null;
  fn(it); it.updatedAt = new Date().toISOString(); saveBox(list); return it;
}

/* ─────────── ส่งผลกลับ BD02 ─────────── */
let bc = null;
function send(type, payload){
  try {
    const ch = new BroadcastChannel(BUS);
    ch.postMessage({ type, version: 1, source: 'FA01', timestamp: new Date().toISOString(), payload });
    setTimeout(() => { try { ch.close(); } catch(e){} }, 200);
  } catch(e){}
}
function statusPayload(it){
  return { contract: REPLY_CONTRACT, idempotencyKey: it.key, eventId: it.eventId, event: it.event, docId: it.docId, docNo: it.docNo, status: it.status === 'CANCELLED' ? 'POSTED' : it.status, note: clean(it.note, 300), jeId: it.jeId || '', ref: it.jeId || (it.status === 'CANCELLED' ? 'CANCELLED-BEFORE-POST' : ''), at: new Date().toISOString() };
}
function report(it){ if (it) send('FA_CNDN_STATUS', statusPayload(it)); }
function reportAR(it){ (it.ar || []).forEach(a => send('FA_CNDN_AR', Object.assign({ contract: REPLY_CONTRACT }, a))); }

/* ─────────── รับข้อความ ─────────── */
function validate(p){
  if (!p || typeof p !== 'object') return 'ข้อมูลไม่ถูกต้อง';
  if (p.contract !== CONTRACT) return 'สัญญาข้อมูลไม่ตรง (ต้องเป็น ' + CONTRACT + ')';
  if (p.event !== 'CNDN_ISSUED' && p.event !== 'CNDN_VOIDED') return 'ชนิดเหตุการณ์ไม่รู้จัก';
  if (typeof p.idempotencyKey !== 'string' || !p.idempotencyKey || p.idempotencyKey.length > 120) return 'ไม่มี idempotencyKey';
  const d = p.document; if (!d || typeof d !== 'object') return 'ไม่มีข้อมูลเอกสาร';
  if (d.type !== 'CN' && d.type !== 'DN') return 'ชนิดเอกสารไม่ถูกต้อง';
  if (!d.id || !d.no) return 'ไม่มีเลขที่เอกสาร';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(d.issueDate || ''))) return 'วันที่ออกเอกสารไม่ถูกต้อง';
  const m = d.amounts || {};
  if (!(isFinite(m.amount) && m.amount > 0 && isFinite(m.base) && m.base >= 0 && isFinite(m.vat) && m.vat >= 0)) return 'ยอดเงินไม่ถูกต้อง';
  if (Math.abs(m.base + m.vat - m.amount) > EPS) return 'ฐานภาษี + VAT ไม่เท่ากับยอดรวม';
  if (m.amount > 1e11) return 'ยอดเงินเกินช่วง';
  return '';
}
function receive(env, src){
  const p = env && env.payload && env.type === 'FIN_CNDN_EVENT' ? env.payload : env;
  const err = validate(p);
  if (err){ audit('CNDN_REJECT_MSG', { error: err }); return { ok: false, error: err }; }
  const list = inbox(), ex = list.find(x => x.key === p.idempotencyKey);
  if (ex){ report(ex); reportAR(ex); return { ok: true, duplicate: true, status: ex.status }; }   /* ส่งซ้ำ: ตอบสถานะเดิมกลับ ไม่สร้างซ้ำ */
  const d = p.document, m = d.amounts, now = new Date().toISOString();
  const it = { key: clean(p.idempotencyKey, 120), eventId: clean(p.eventId, 60), event: p.event, src: src || 'bus', receivedAt: now, updatedAt: now,
    docId: clean(d.id, 60), docNo: clean(d.no, 40), type: d.type, currency: clean(d.currency || 'THB', 6).toUpperCase(), issueDate: d.issueDate, dueDate: /^\d{4}-\d{2}-\d{2}$/.test(String(d.dueDate || '')) ? d.dueDate : d.issueDate,
    customer: { code: clean((d.customer || {}).code, 40), name: clean((d.customer || {}).name, 160) }, sbo: clean((d.originalInvoice || {}).sbo, 60), invoiceNo: clean((d.originalInvoice || {}).no, 60),
    reason: clean((d.reason || {}).text, 160), base: r2(m.base), vat: r2(m.vat), amount: r2(m.amount), status: 'RECEIVED', note: '' };
  list.unshift(it); saveBox(list);
  audit('CNDN_RECEIVE', { no: it.docNo, event: it.event, src: it.src });
  proc(it.key); refreshUI();
  return { ok: true, status: (inbox().find(x => x.key === it.key) || {}).status };
}

/* ─────────── จับคู่ใบแจ้งหนี้ ─────────── */
function arCandidates(it){
  const sbo = norm(it.sbo), nm = norm(it.customer.name);
  let c = sbo ? getAR().filter(i => i.status !== 'CANCELLED' && i.docType !== 'DN' && norm(i.ref) === sbo) : [];
  if (c.length > 1){ const n2 = c.filter(i => norm(i.customerName) === nm); if (n2.length) c = n2; }
  if (c.length > 1){ const open = c.filter(i => num(i.total) - num(i.paidAmount) > EPS); if (open.length) c = open; }
  return c;
}
const outstanding = inv => r2(num(inv.total) - num(inv.paidAmount));

/* ─────────── ประมวลผล (สร้าง JE รออนุมัติ) ─────────── */
function setSt(key, st, note, extra){
  const it = upd(key, x => { x.status = st; x.note = note || ''; if (extra) Object.assign(x, extra); });
  if (it) report(it); return it;
}
function jeLines(it){
  const a = cfg().accounts[it.type], cn = it.type === 'CN', who2 = it.customer.name;
  const L = [];
  if (cn){
    L.push({ account: a.adjust, debit: it.base, credit: 0, description: 'ปรับลดรายได้ ' + it.docNo });
    if (it.vat > 0) L.push({ account: a.vat, debit: it.vat, credit: 0, description: 'ปรับลดภาษีขาย ' + it.docNo });
    L.push({ account: a.ar, debit: 0, credit: it.amount, description: who2 });
  } else {
    L.push({ account: a.ar, debit: it.amount, credit: 0, description: who2 });
    L.push({ account: a.revenue, debit: 0, credit: it.base, description: 'ปรับเพิ่มรายได้ ' + it.docNo });
    if (it.vat > 0) L.push({ account: a.vat, debit: 0, credit: it.vat, description: 'ภาษีขายเพิ่ม ' + it.docNo });
  }
  return L;
}
function balanced(lines){ const dr = lines.reduce((s, l) => s + num(l.debit), 0), cr = lines.reduce((s, l) => s + num(l.credit), 0); return Math.abs(dr - cr) < 0.01 && dr > 0; }
function putJE(it, lines, date, desc){
  const id = newId('JEN'), je = getJE();
  je.unshift({ id, date, description: desc, ref: it.docNo, status: 'PENDING', lines, total: r2(lines.reduce((s, l) => s + num(l.debit), 0)), source: 'BD02-CNDN', cndnKey: it.key, createdBy: 'system', createdAt: new Date().toISOString(), postedAt: null });
  setJE(je); return id;
}
function proc(key){
  const it = inbox().find(x => x.key === key); if (!it || it.status === 'POSTED' || it.status === 'REJECTED' || it.status === 'CANCELLED') return;
  if (it.currency !== 'THB') return setSt(key, 'BLOCKED', 'FA01 รองรับสกุลเงินบาทเท่านั้น (เอกสารเป็น ' + it.currency + ') — ลงบัญชีด้วยมือ');
  if (it.event === 'CNDN_VOIDED') return procVoid(it);
  if (it.jeId && getJE().some(j => j.id === it.jeId && (j.status === 'PENDING' || j.status === 'POSTED'))) { if (it.status !== 'PENDING_JE') setSt(key, 'PENDING_JE', ''); return; }
  const miss = need(it.type);
  if (miss.length) return setSt(key, 'NEEDS_CONFIG', 'ยังไม่ได้เลือก: ' + miss.join(', '));
  let arId = it.arId || '';
  if (it.type === 'CN'){
    const c = arCandidates(it);
    if (!arId || !getAR().some(i => i.id === arId)){
      arId = '';
      if (c.length === 1) arId = c[0].id;
      else return setSt(key, 'NEEDS_AR', c.length ? 'พบใบแจ้งหนี้ ' + c.length + ' ใบที่อ้าง SBO นี้ — เลือกใบที่จะตัด' : 'ไม่พบใบแจ้งหนี้ที่อ้าง SBO ' + (it.sbo || '(ไม่มี)') + ' — เลือกใบแจ้งหนี้ที่จะตัด', { candidates: c.map(i => i.id), arId: '' });
    }
  }
  if (locked(it.issueDate)) return setSt(key, 'BLOCKED', 'งวด ' + it.issueDate.slice(0, 7) + ' ถูกล็อก — ปลดล็อกงวดแล้วกด "ลองใหม่"');
  const lines = jeLines(it); if (!balanced(lines)) return setSt(key, 'BLOCKED', 'รายการบัญชีไม่สมดุล (Dr ≠ Cr)');
  const jeId = putJE(it, lines, it.issueDate, (it.type === 'CN' ? 'ใบลดหนี้ ' : 'ใบเพิ่มหนี้ ') + it.docNo + ' - ' + it.customer.name);
  setSt(key, 'PENDING_JE', '', { jeId, arId, candidates: undefined });
  audit('CNDN_JE_PENDING', { no: it.docNo, jeId });
}
function procVoid(it){
  const key = it.key, orig = inbox().find(x => x.key === it.docId + ':CNDN_ISSUED');
  if (!orig) return setSt(key, 'BLOCKED', 'ไม่พบรายการ "ออกเอกสาร" เดิมของ ' + it.docNo + ' — รับไฟล์/ข้อความออกเอกสารก่อน');
  if (orig.status === 'REJECTED' || orig.status === 'CANCELLED') return setSt(key, 'CANCELLED', 'รายการเดิมไม่ได้ลงบัญชี — ไม่ต้องทำอะไร');
  if (orig.status !== 'POSTED'){   /* ยังไม่เคยลงบัญชี → ถอน JE ที่ค้างอยู่ */
    if (orig.jeId){ const je = getJE(), j = je.find(x => x.id === orig.jeId); if (j && j.status === 'PENDING') setJE(je.filter(x => x.id !== orig.jeId)); }
    upd(orig.key, x => { x.status = 'CANCELLED'; x.note = 'BD02 ยกเลิกเอกสารก่อนลงบัญชี'; });
    audit('CNDN_CANCEL_BEFORE_POST', { no: it.docNo });
    return setSt(key, 'CANCELLED', 'ยกเลิกก่อนลงบัญชี — ถอน JE ที่ค้างอยู่แล้ว');
  }
  if (it.jeId && getJE().some(j => j.id === it.jeId && (j.status === 'PENDING' || j.status === 'POSTED'))){ if (it.status !== 'PENDING_JE') setSt(key, 'PENDING_JE', ''); return; }
  if (orig.type === 'DN'){ const inv = getAR().find(i => i.id === orig.arId); if (inv && num(inv.paidAmount) > EPS) return setSt(key, 'BLOCKED', 'ใบเพิ่มหนี้นี้มีการรับชำระแล้ว ' + fmt(inv.paidAmount) + ' — ให้ฝ่ายบัญชีกลับรายการเอง'); }
  const oje = getJE().find(j => j.id === orig.jeId); if (!oje) return setSt(key, 'BLOCKED', 'ไม่พบ JE เดิม ' + orig.jeId);
  const date = todayISO(); if (locked(date)) return setSt(key, 'BLOCKED', 'งวด ' + date.slice(0, 7) + ' ถูกล็อก — ปลดล็อกแล้วกด "ลองใหม่"');
  const lines = oje.lines.map(l => ({ account: l.account, debit: num(l.credit), credit: num(l.debit), description: 'กลับรายการ: ' + (l.description || '') }));
  const jeId = putJE(it, lines, date, 'ยกเลิก ' + (it.type === 'CN' ? 'ใบลดหนี้ ' : 'ใบเพิ่มหนี้ ') + it.docNo + ' (กลับรายการ ' + orig.jeId + ')');
  setSt(key, 'PENDING_JE', '', { jeId, reverses: orig.key, arId: orig.arId || '' });
  audit('CNDN_JE_PENDING', { no: it.docNo, jeId, reversal: true });
}

/* ─────────── อนุมัติ / ปฏิเสธ ─────────── */
function check(it){
  if (!it.jeId) return 'ยังไม่มี JE';
  const je = getJE().find(j => j.id === it.jeId); if (!je) return 'ไม่พบ JE ' + it.jeId + ' (ถูกลบ)';
  if (je.status !== 'PENDING' && je.status !== 'POSTED') return 'JE อยู่ในสถานะ ' + je.status;
  if (je.status === 'PENDING'){
    if (locked(je.date)) return 'งวด ' + String(je.date).slice(0, 7) + ' ถูกล็อก';
    if (!balanced(je.lines || [])) return 'JE ไม่สมดุล';
    const bad = (je.lines || []).filter(l => !acctOk(l.account)); if (bad.length) return 'บัญชี ' + bad.map(l => l.account).join(', ') + ' ใช้ไม่ได้ (ไม่มีหรือปิดอยู่)';
  }
  return '';
}
function approve(key){
  if (window.__faAuth && !window.__faAuth.check()) return { ok: false, error: window.__faAuth.DENY };   /* [FA-AUTH] ด่านผู้อนุมัติ */
  const it = inbox().find(x => x.key === key); if (!it) return { ok: false, error: 'ไม่พบรายการ' };
  if (it.status === 'POSTED') return { ok: true, already: true };
  if (it.status !== 'PENDING_JE') return { ok: false, error: 'รายการนี้ยังไม่พร้อมอนุมัติ (' + (ST[it.status] || {}).label + ')' };
  const e = check(it); if (e) return { ok: false, error: e };
  const je = getJE(), j = je.find(x => x.id === it.jeId);
  if (j.status === 'PENDING'){ j.status = 'POSTED'; j.postedAt = new Date().toISOString(); j.approvedBy = who(); setJE(je); }
  return finalize(key);
}
function reject(key, reason){
  if (window.__faAuth && !window.__faAuth.check()) return { ok: false, error: window.__faAuth.DENY };   /* [FA-AUTH] ด่านผู้อนุมัติ */
  reason = clean(reason, 200); if (!reason) return { ok: false, error: 'ต้องระบุเหตุผลที่ปฏิเสธ' };
  const it = inbox().find(x => x.key === key); if (!it) return { ok: false, error: 'ไม่พบรายการ' };
  if (it.status === 'POSTED') return { ok: false, error: 'ลงบัญชีแล้ว — ใช้การยกเลิกเอกสารจาก BD02 หรือกลับรายการเอง' };
  if (it.jeId){ const je = getJE(), j = je.find(x => x.id === it.jeId); if (j && j.status === 'PENDING') setJE(je.filter(x => x.id !== it.jeId)); }
  setSt(key, 'REJECTED', reason, { rejectedBy: who(), rejectedAt: new Date().toISOString() });
  audit('CNDN_REJECT', { no: it.docNo, reason }); refreshUI(); return { ok: true };
}
function finalize(key){
  const it = inbox().find(x => x.key === key); if (!it) return { ok: false, error: 'ไม่พบรายการ' };
  if (it.status === 'POSTED') return { ok: true, already: true };
  const now = new Date().toISOString(), ars = getAR(), arEv = [], notes = [];
  const base = { docId: it.docId, docNo: it.docNo, currency: 'THB', at: now };
  if (it.event === 'CNDN_ISSUED' && it.type === 'CN'){
    const inv = ars.find(i => i.id === it.arId);
    if (!inv) notes.push('ไม่พบใบแจ้งหนี้ ' + it.arId + ' — ไม่ได้ตัดลูกหนี้รายใบ');
    else {
      const apply = Math.min(it.amount, Math.max(0, outstanding(inv))), excess = r2(it.amount - apply);
      if (apply > 0){
        inv.paidAmount = r2(num(inv.paidAmount) + apply);
        inv.status = inv.paidAmount >= num(inv.total) - 0.01 ? 'PAID' : 'PARTIAL';
        (inv.credits = inv.credits || []).push({ key: it.key, no: it.docNo, amount: apply, jeId: it.jeId, at: now });
        arEv.push(Object.assign({ event: 'AR_SETTLED', amount: apply, ref: it.jeId }, base));
      }
      it.applied = apply; if (excess > 0.005) notes.push('ส่วนเกิน ฿' + fmt(excess) + ' เกินยอดคงค้างของใบแจ้งหนี้ ' + inv.id + ' — ต้องคืนเงินหรือตัดกับใบอื่น');
      setAR(ars);
    }
  } else if (it.event === 'CNDN_ISSUED' && it.type === 'DN'){
    if (!ars.some(i => i.cndnKey === it.key)){
      ars.unshift({ id: it.docNo, ref: it.sbo, date: it.issueDate, dueDate: it.dueDate, customerName: it.customer.name, subtotal: it.base, vatRate: it.base > 0 ? r2(it.vat / it.base * 100) : 0, vat: it.vat, total: it.amount, paidAmount: 0, status: 'ISSUED', docType: 'DN', sourceDoc: it.docNo, cndnKey: it.key, createdBy: 'system', createdAt: now });
      setAR(ars);
    }
    it.arId = it.docNo;
  } else if (it.event === 'CNDN_VOIDED'){
    const orig = inbox().find(x => x.key === it.reverses);
    if (orig && orig.type === 'CN'){
      const inv = ars.find(i => i.id === orig.arId), cr = inv && (inv.credits || []).find(c => c.key === orig.key);
      if (inv && cr){
        inv.paidAmount = Math.max(0, r2(num(inv.paidAmount) - cr.amount));
        inv.status = inv.paidAmount >= num(inv.total) - 0.01 ? 'PAID' : (inv.paidAmount > 0.005 ? 'PARTIAL' : 'ISSUED');
        inv.credits = inv.credits.filter(c => c !== cr); setAR(ars);
        arEv.push(Object.assign({ event: 'AR_REVERSED', amount: cr.amount, ref: it.jeId, reverses: 'AR_SETTLED:' + orig.jeId }, base));
      }
    } else if (orig && orig.type === 'DN'){
      const inv = ars.find(i => i.cndnKey === orig.key); if (inv){ inv.status = 'CANCELLED'; setAR(ars); }
    }
  }
  const it2 = upd(key, x => { x.status = 'POSTED'; x.note = notes.join(' · '); x.postedAt = now; x.approvedBy = who(); x.applied = it.applied; x.arId = it.arId || x.arId; x.ar = arEv; });
  audit('CNDN_POSTED', { no: it.docNo, jeId: it.jeId, event: it.event });
  report(it2); reportAR(it2); refreshUI(); updateBadge();
  return { ok: true, notes };
}

function sync(){
  let changed = false;
  inbox().forEach(it => {
    if (it.status === 'PENDING_JE' && it.jeId){

      if (j && j.status === 'POSTED'){ finalize(it.key); changed = true; }

}

function importFile(text){
  if (typeof text !== 'string' || text.length > 8 * 1024 * 1024) return { ok: false, error: 'ไฟล์ว่างหรือใหญ่เกิน 8 MB' };
  let j; try { j = JSON.parse(text, (k, v) => k === '__proto__' ? undefined : v); } catch(e){ return { ok: false, error: 'อ่านไฟล์ JSON ไม่ได้' }; }
  const items = Array.isArray(j) ? j : (j && Array.isArray(j.outbox) ? j.outbox : (j && j.payload ? [j] : (j && j.contract === CONTRACT ? [{ payload: j }] : null)));
  if (!items) return { ok: false, error: 'ไม่ใช่ไฟล์ Outbox ของ BD02 (bd_cndn_finance_outbox.json)' };
  if (items.length > 2000) return { ok: false, error: 'มีรายการมากเกิน 2000' };
  const out = { ok: true, total: 0, imported: 0, duplicate: 0, rejected: 0, errors: [] };
  items.forEach(x => { const p = x && x.payload ? x.payload : x; if (!p) return; out.total++; const r = receive(p, 'file'); if (!r.ok){ out.rejected++; if (out.errors.length < 5) out.errors.push(r.error); } else if (r.duplicate) out.duplicate++; else out.imported++; });
  refreshUI(); return out;
}

}

function budSet(cc, period, amount){
  if (!ccGet(cc)) return { ok:false, error:'ไม่พบ Cost Center ' + cc };
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(String(period))) return { ok:false, error:'งวดต้องเป็น YYYY-MM' };
  const a = typeof amount === 'string' ? amount.replace(/,/g, '').trim() : amount;
  if (a === '' || a == null || !isFinite(Number(a)) || Number(a) < 0 || Number(a) > 1e11) return { ok:false, error:'จำนวนงบไม่ถูกต้อง' };
  const l = budAll(), i = l.findIndex(b => b.cc === cc && b.period === period), row = { id: i >= 0 ? l[i].id : newId('BUD'), cc, period, amount: r2(Number(a)), updatedAt: new Date().toISOString() };
  if (i >= 0) l[i] = row; else l.push(row);
  if (!budSave(l)) return { ok:false, error:'บันทึกไม่สำเร็จ' };
  audit('COST_BUDGET_SET', { cc, period, amount: row.amount }); return { ok:true, row };
}
function budSetYear(cc, year, monthly){
  if (!/^\d{4}$/.test(String(year))) return { ok:false, error:'ปีไม่ถูกต้อง' };
  for (let m = 1; m <= 12; m++){ const r = budSet(cc, year + '-' + pad2(m), monthly); if (!r.ok) return r; }
  sendMaster(); return { ok:true };
}
function budDel(cc, period){ const l = budAll(), n = l.filter(b => !(b.cc === cc && b.period === period)); if (n.length === l.length) return { ok:false, error:'ไม่พบแถวงบ' }; budSave(n); audit('COST_BUDGET_DEL', { cc, period }); sendMaster(); return { ok:true }; }
/* ยอดใช้ไป = เดบิตสุทธิของบรรทัด JE ที่แท็ก costCenter (POSTED + PENDING) ตามงวดของกิจกรรม (ccPeriod) */
function usage(cc, period, excludeJe){
  let posted = 0, pending = 0;
  getJE().forEach(j => {
    if (j.id === excludeJe || (j.status !== 'POSTED' && j.status !== 'PENDING')) return;
    (j.lines || []).forEach(l => {
      if (l.costCenter !== cc) return;
      const per = l.ccPeriod || String(j.date).slice(0, 7); if (per !== period) return;
      const v = num(l.debit) - num(l.credit); if (j.status === 'POSTED') posted += v; else pending += v;
    });
  });
  return { posted: r2(posted), pending: r2(pending) };
}
function budInfo(cc, period, excludeJe){
  const row = budAll().find(b => b.cc === cc && b.period === period), u = usage(cc, period, excludeJe);
  if (!row) return { has:false, cc, period, posted:u.posted, pending:u.pending };
  const used = r2(u.posted + u.pending);
  return { has:true, cc, period, amount: row.amount, posted:u.posted, pending:u.pending, used, remaining: r2(row.amount - used) };
}
function budgetVerdict(cc, period, base, excludeJe){
  const c = ccGet(cc), b = budInfo(cc, period, excludeJe);
  if (!c || c.mode === 'OFF' || !b.has) return { checked:false, info:b, mode: c ? c.mode : 'OFF' };
  const over = r2(base - b.remaining);
  return { checked:true, info:b, mode:c.mode, over: over > EPS, overBy: over > EPS ? over : 0 };
}

/* ─────────── กล่องรับ ─────────── */
const ST = {
  RECEIVED:    { label:'รับแล้ว',            cls:'bg-slate-700 text-slate-300' },
  NEEDS_CONFIG:{ label:'ต้องตั้งค่าบัญชี',    cls:'bg-amber-500/20 text-amber-400 border border-amber-500/30' },
  PENDING_JE:  { label:'JE รออนุมัติ',       cls:'bg-sky-500/20 text-sky-400 border border-sky-500/30' },
  BLOCKED:     { label:'ติดปัญหา',           cls:'bg-rose-500/20 text-rose-400 border border-rose-500/30' },
  POSTED:      { label:'ลงบัญชีแล้ว',        cls:'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' },
  REJECTED:    { label:'ปฏิเสธแล้ว',         cls:'bg-slate-700 text-slate-500' },
  CANCELLED:   { label:'ยกเลิก',             cls:'bg-slate-700 text-slate-500' },
  SUPERSEDED:  { label:'ถูกแทนด้วยฉบับใหม่', cls:'bg-slate-800 text-slate-500' }
};
const ACTIVE = ['RECEIVED','NEEDS_CONFIG','PENDING_JE','BLOCKED'];
function inbox(){ const a = rd(K.IN, []); return Array.isArray(a) ? a : []; }
function saveBox(list){
  if (list.length > MAXBOX){ const keep = list.filter(x => ACTIVE.indexOf(x.status) >= 0 || x.status === 'POSTED'); list = keep.length > MAXBOX ? keep.slice(0, MAXBOX) : list.slice(0, MAXBOX); }
  return wr(K.IN, list);
}
function find(key){ return inbox().find(x => x.key === key) || null; }
function upd(key, fn){ const list = inbox(), it = list.find(x => x.key === key); if (!it) return null; fn(it); it.updatedAt = new Date().toISOString(); saveBox(list); return it; }

/* ─────────── ส่งผลกลับ BD02 ─────────── */
function send(type, payload){
  try { const ch = new BroadcastChannel(BUS); ch.postMessage({ type, version:1, source:'FA01', timestamp:new Date().toISOString(), payload }); setTimeout(() => { try { ch.close(); } catch(e){} }, 200); } catch(e){}
}
function budgetPayload(it){
  if (!it.cc || !it.date) return undefined;
  const per = String(it.date).slice(0, 7), b = budInfo(it.cc, per), c = ccGet(it.cc);
  return b.has ? { cc: it.cc, period: per, amount: b.amount, remaining: b.remaining, mode: c ? c.mode : 'WARN' } : undefined;
}
function statusPayload(it){
  let st = it.status;
  if (it.event === 'COST_CANCELLED') st = st === 'POSTED' ? 'CANCELLED' : st;
  if (st === 'SUPERSEDED') st = 'CANCELLED';
  return { contract: REPLY, idempotencyKey: it.key, eventId: it.eventId, event: it.event, voucherId: it.voucherId, voucherNo: it.no, status: st, note: clean(it.msg, 300), jeId: it.jeId || '', budget: budgetPayload(it), at: new Date().toISOString() };
}
function report(it){ if (it) send('FA_COST_STATUS', statusPayload(it)); }
function masterPayload(){
  const ccs = ccAll(), per = new Set();
  const accounts = getCOA().filter(a => !a.isHeader && a.active !== false && (a.type === 'EXPENSE' || a.type === 'COGS')).map(a => ({ code: a.code, name: a.name }));
  const budgets = budAll().slice(0, 1000).map(b => { const i = budInfo(b.cc, b.period), c = ccGet(b.cc); per.add(b.period); return { cc: b.cc, period: b.period, amount: b.amount, used: i.used, remaining: i.remaining, mode: c ? c.mode : 'WARN' }; });
  return { contract: REPLY, costCenters: ccs, accounts, budgets, at: new Date().toISOString() };
}
function sendMaster(){ if (!cfg().receive) return; send('FA_COST_MASTER', masterPayload()); }

/* ─────────── รับข้อความ ─────────── */
function validate(p){
  if (!p || typeof p !== 'object') return 'ข้อมูลไม่ถูกต้อง';
  if (p.contract !== CONTRACT) return 'สัญญาข้อมูลไม่ตรง (ต้องเป็น ' + CONTRACT + ')';
  if (p.event !== 'COST_SUBMITTED' && p.event !== 'COST_CANCELLED') return 'ชนิดเหตุการณ์ไม่รู้จัก';
  if (typeof p.idempotencyKey !== 'string' || !p.idempotencyKey || p.idempotencyKey.length > 120) return 'ไม่มี idempotencyKey';
  const v = p.voucher; if (!v || typeof v !== 'object') return 'ไม่มีข้อมูลเอกสาร';
  if (!v.id || !v.no || !/^[\w.-]{1,60}$/.test(String(v.id)) || String(v.no).length > 40) return 'ไม่มีเลขที่เอกสาร';
  if (!(Number.isInteger(Number(v.rev)) && Number(v.rev) >= 1 && Number(v.rev) <= 999)) return 'rev ไม่ถูกต้อง';
  if (p.idempotencyKey !== v.id + ':' + p.event + ':' + v.rev) return 'idempotencyKey ไม่ตรงกับเอกสาร/เหตุการณ์/rev';
  if (p.event === 'COST_CANCELLED') return '';
  if (!KINDS[v.kind]) return 'ประเภทรายการไม่ถูกต้อง';
  if (!/^[A-Za-z0-9._-]{2,30}$/.test(String(v.costCenter || ''))) return 'Cost Center ไม่ถูกต้อง';
  if (!/^\d{3,10}$/.test(String(v.expenseAccount || ''))) return 'บัญชีค่าใช้จ่ายไม่ถูกต้อง';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(v.expenseDate || '')) || isNaN(new Date(v.expenseDate + 'T12:00:00'))) return 'วันที่เกิดค่าใช้จ่ายไม่ถูกต้อง';
  if (String(v.currency || 'THB').toUpperCase() !== 'THB') return 'FA01 รองรับสกุลเงินบาทเท่านั้น';
  const a = Number(v.amount), t = Number(v.vat || 0);
  if (!(isFinite(a) && a > 0 && a <= 1e9)) return 'ยอดเงินไม่ถูกต้อง';
  if (!(isFinite(t) && t >= 0 && t < a - EPS)) return 'VAT ไม่ถูกต้อง';
  if (v.kind === 'PENALTY' && t > 0) return 'ค่าปรับต้องไม่มี VAT ซื้อ';
  if (!clean(v.description, 200)) return 'ไม่มีรายละเอียด';
  const x = v.extra || {}; for (const f of KINDS[v.kind].need) if (!clean(x[f], 120)) return 'ขาดข้อมูล ' + (PARTY[f] || f);
  return '';
}
function receive(env, src){
  const p = env && env.payload && env.type === 'FIN_COST_EVENT' ? env.payload : env;
  const err = validate(p);
  if (err){ audit('COST_REJECT_MSG', { error: err }); return { ok:false, error: err }; }
  const list = inbox(), ex = list.find(x => x.key === p.idempotencyKey);
  if (ex){ report(ex); return { ok:true, duplicate:true, status: ex.status }; }
  const v = p.voucher, now = new Date().toISOString(), x = v.extra || {}, amount = r2(Number(v.amount)), vat = r2(Number(v.vat || 0));
  const it = { key: clean(p.idempotencyKey, 120), eventId: clean(p.eventId, 60), event: p.event, src: src || 'bus', receivedAt: now, updatedAt: now, voucherId: clean(v.id, 60), no: clean(v.no, 40), rev: Number(v.rev),
    kind: v.kind || '', cc: clean(v.costCenter, 30), account: clean(v.expenseAccount, 10), accountReq: clean(v.expenseAccount, 10), date: v.expenseDate || '', desc: clean(v.description, 200), requester: clean(v.requester, 80),
    amount, vat, base: r2(amount - vat), refDoc: clean(v.refDoc, 60), vnote: clean(v.note, 300), cancelReason: clean(v.cancelReason, 200), extra: {}, status:'RECEIVED', msg:'' };
  Object.keys(PARTY).forEach(f => { if (x[f]) it.extra[f] = clean(x[f], 120); });
  list.unshift(it); saveBox(list); audit('COST_RECEIVE', { no: it.no, event: it.event, rev: it.rev, src: it.src });
  if (it.event === 'COST_CANCELLED') procCancel(it.key); else procSubmit(it.key, true);
  refreshUI(); sendMaster();
  return { ok:true, status: (find(it.key) || {}).status };
}

/* ─────────── ประมวลผล (สร้าง JE รออนุมัติ) ─────────── */
function setSt(key, st, msg, extra){ const it = upd(key, x => { x.status = st; x.msg = msg || ''; if (extra) Object.assign(x, extra); }); if (it) report(it); return it; }
function dropPendingJe(jeId){ if (!jeId) return; const je = getJE(), j = je.find(x => x.id === jeId); if (j && j.status === 'PENDING') setJE(je.filter(x => x.id !== jeId)); }
function missingCfg(it){
  const c = cfg(), miss = [];
  if (!acctOk(c.accounts[it.kind])) miss.push('บัญชีเครดิตของประเภท "' + KINDS[it.kind].th + '"');
  if (it.vat > 0 && !acctOk(c.inputVat)) miss.push('บัญชีภาษีซื้อ');
  return miss;
}
function jeLines(it){
  const c = cfg(), cr = c.accounts[it.kind], party = it.extra[(KINDS[it.kind].need || [])[0]] || it.requester;
  const L = [{ account: it.account, debit: it.base, credit: 0, description: KINDS[it.kind].th + ' ' + it.no + ' - ' + it.desc, costCenter: it.cc, ccPeriod: String(it.date).slice(0, 7) }];
  if (it.vat > 0) L.push({ account: c.inputVat, debit: it.vat, credit: 0, description: 'ภาษีซื้อ ' + it.no });
  L.push({ account: cr, debit: 0, credit: it.amount, description: (PARTY[(KINDS[it.kind].need || [])[0]] ? PARTY[KINDS[it.kind].need[0]] + ': ' : 'ผู้ขอเบิก: ') + party });
  return L;
}
function balanced(lines){ const dr = lines.reduce((s, l) => s + num(l.debit), 0), cr = lines.reduce((s, l) => s + num(l.credit), 0); return Math.abs(dr - cr) < 0.01 && dr > 0; }
function putJE(it, lines, date, desc, extra){
  const id = newId('JEC'), je = getJE();
  je.unshift(Object.assign({ id, date, description: desc, ref: it.no, status:'PENDING', lines, total: r2(lines.reduce((s, l) => s + num(l.debit), 0)), source:'BD02-COST', costKey: it.key, createdBy:'system', createdAt: new Date().toISOString(), postedAt:null }, extra || {}));
  setJE(je); return id;
}
function procSubmit(key, fresh){
  const it = find(key); if (!it || ['POSTED','REJECTED','CANCELLED','SUPERSEDED'].indexOf(it.status) >= 0) return;
  if (fresh){
    const all = inbox().filter(x => x.voucherId === it.voucherId && x.key !== it.key);
    const tomb = all.find(x => x.event === 'COST_CANCELLED' && x.rev >= it.rev);
    if (tomb) return setSt(key, 'CANCELLED', 'BD02 ยกเลิกเอกสารนี้แล้ว (ได้รับคำยกเลิกก่อน)');
    const newer = all.find(x => x.event === 'COST_SUBMITTED' && x.rev > it.rev);
    if (newer) return setSt(key, 'SUPERSEDED', 'มีฉบับใหม่กว่า (rev ' + newer.rev + ') แล้ว');
    const older = all.filter(x => x.event === 'COST_SUBMITTED' && x.rev < it.rev && ['SUPERSEDED','REJECTED','CANCELLED'].indexOf(x.status) < 0);
    if (older.some(x => x.status === 'POSTED')) return setSt(key, 'BLOCKED', 'rev เดิมลงบัญชีแล้ว — แก้ไขซ้ำไม่ได้ ให้ยกเลิก (กลับรายการ) แล้วบันทึกใหม่');
    older.forEach(x => { dropPendingJe(x.jeId); upd(x.key, y => { y.status = 'SUPERSEDED'; y.msg = 'ถูกแทนด้วย rev ' + it.rev; }); });
  }
  if (it.jeId && getJE().some(j => j.id === it.jeId && (j.status === 'PENDING' || j.status === 'POSTED'))){ if (it.status !== 'PENDING_JE') setSt(key, 'PENDING_JE', ''); return; }
  const c = ccGet(it.cc);
  if (!c) return setSt(key, 'BLOCKED', 'ไม่พบ Cost Center ' + it.cc + ' ในทะเบียน FA01 — เพิ่มในแท็บ "Cost Center & งบ" แล้วกด "ลองใหม่"');
  if (c.active === false) return setSt(key, 'BLOCKED', 'Cost Center ' + it.cc + ' ปิดใช้งานอยู่');
  if (!expOk(it.account)) return setSt(key, 'BLOCKED', 'บัญชี ' + it.account + ' ใช้เป็นค่าใช้จ่ายไม่ได้ (ไม่มี/เป็นหัวบัญชี/ไม่ใช่ค่าใช้จ่าย) — เลือกบัญชีใหม่ที่ปุ่ม "เปลี่ยนบัญชี"', { needRemap: true });
  const miss = missingCfg(it); if (miss.length) return setSt(key, 'NEEDS_CONFIG', 'ยังไม่ได้เลือก: ' + miss.join(', '));
  let date = it.date, shifted = false;
  if (locked(date)){
    if (it.kind === 'RETRO'){ date = todayISO(); if (locked(date)) return setSt(key, 'BLOCKED', 'งวด ' + String(it.date).slice(0, 7) + ' และงวดปัจจุบันถูกล็อก'); shifted = true; }
    else return setSt(key, 'BLOCKED', 'งวด ' + String(date).slice(0, 7) + ' ถูกล็อก — ปลดล็อกงวดแล้วกด "ลองใหม่"');
  }
  const per = String(it.date).slice(0, 7), bv = budgetVerdict(it.cc, per, it.base);
  if (bv.checked && bv.over && bv.mode === 'BLOCK') return setSt(key, 'BLOCKED', 'เกินงบ ' + it.cc + ' งวด ' + per + ': คงเหลือ ' + fmt(bv.info.remaining) + ' · รายการนี้ ' + fmt(it.base) + ' (โหมดไม่ให้ส่งบัญชี) — เพิ่มงบหรือปรับโหมด แล้วกด "ลองใหม่"', { budgetWarn: null });
  const lines = jeLines(it); if (!balanced(lines)) return setSt(key, 'BLOCKED', 'รายการบัญชีไม่สมดุล (Dr ≠ Cr)');
  const taxNote = it.kind === 'PENALTY' ? 'ค่าปรับ: โดยทั่วไปไม่ใช่รายจ่ายที่หักเป็นค่าใช้จ่ายทางภาษีได้ — ให้ฝ่ายบัญชียืนยัน' : '';
  const jeId = putJE(it, lines, date, KINDS[it.kind].th + ' ' + it.no + ' - ' + it.desc, taxNote ? { taxNote } : null);
  const warn = bv.checked && bv.over ? { remaining: bv.info.remaining, overBy: bv.overBy, period: per } : null;
  const msg = (shifted ? 'งวดเดิม ' + String(it.date).slice(0, 7) + ' ถูกล็อก — บันทึกในงวดปัจจุบันแทน (' + date + ')' : '') + (warn ? (shifted ? ' · ' : '') + 'เกินงบ ' + fmt(warn.overBy) + ' (โหมดเตือน)' : '');
  setSt(key, 'PENDING_JE', msg, { jeId, jeDate: date, retroShifted: shifted, budgetWarn: warn, needRemap: false });
  audit('COST_JE_PENDING', { no: it.no, jeId, overBudget: !!warn });
}
function procCancel(key){
  const it = find(key); if (!it || ['POSTED','CANCELLED','REJECTED'].indexOf(it.status) >= 0) return;
  const origs = inbox().filter(x => x.voucherId === it.voucherId && x.event === 'COST_SUBMITTED' && x.rev <= it.rev).sort((a, b) => b.rev - a.rev);
  const orig = origs[0];
  if (!orig) return setSt(key, 'CANCELLED', 'ยังไม่พบรายการเดิม — เก็บคำยกเลิกไว้ (ถ้ารายการเดิมมาภายหลังจะถูกยกเลิกทันที)');
  if (orig.status !== 'POSTED'){
    origs.forEach(o => { dropPendingJe(o.jeId); if (['REJECTED','CANCELLED','SUPERSEDED'].indexOf(o.status) < 0) upd(o.key, y => { y.status = 'CANCELLED'; y.msg = 'BD02 ยกเลิกเอกสารก่อนลงบัญชี' + (it.cancelReason ? ': ' + it.cancelReason : ''); }); });
    audit('COST_CANCEL_BEFORE_POST', { no: it.no });
    return setSt(key, 'CANCELLED', 'ยกเลิกก่อนลงบัญชี — ถอน JE ที่ค้างอยู่แล้ว');
  }
  if (it.jeId && getJE().some(j => j.id === it.jeId && (j.status === 'PENDING' || j.status === 'POSTED'))){ if (it.status !== 'PENDING_JE') setSt(key, 'PENDING_JE', ''); return; }
  const oje = getJE().find(j => j.id === orig.jeId); if (!oje) return setSt(key, 'BLOCKED', 'ไม่พบ JE เดิม ' + orig.jeId + ' — กลับรายการด้วยมือ');
  const date = todayISO(); if (locked(date)) return setSt(key, 'BLOCKED', 'งวด ' + date.slice(0, 7) + ' ถูกล็อก — ปลดล็อกแล้วกด "ลองใหม่"');
  const lines = oje.lines.map(l => { const n = { account: l.account, debit: num(l.credit), credit: num(l.debit), description: 'กลับรายการ: ' + (l.description || '') }; if (l.costCenter){ n.costCenter = l.costCenter; n.ccPeriod = l.ccPeriod || String(oje.date).slice(0, 7); } return n; });
  const jeId = putJE(it, lines, date, 'ยกเลิก ' + KINDS[orig.kind].th + ' ' + it.no + ' (กลับรายการ ' + orig.jeId + ')', { reverses: orig.jeId });
  setSt(key, 'PENDING_JE', '', { jeId, reverses: orig.key, cc: orig.cc, date: orig.date, kind: orig.kind, account: orig.account, amount: orig.amount, vat: orig.vat, base: orig.base, desc: orig.desc, requester: orig.requester, extra: orig.extra });
  audit('COST_JE_PENDING', { no: it.no, jeId, reversal: true });
}

/* ─────────── อนุมัติ / ปฏิเสธ ─────────── */
function check(it, ack){
  if (!it.jeId) return 'ยังไม่มี JE';
  const je = getJE().find(j => j.id === it.jeId); if (!je) return 'ไม่พบ JE ' + it.jeId + ' (ถูกลบ)';
  if (je.status !== 'PENDING' && je.status !== 'POSTED') return 'JE อยู่ในสถานะ ' + je.status;
  if (je.status === 'PENDING'){
    if (locked(je.date)) return 'งวด ' + String(je.date).slice(0, 7) + ' ถูกล็อก';
    if (!balanced(je.lines || [])) return 'JE ไม่สมดุล';
    const bad = (je.lines || []).filter(l => !acctOk(l.account)); if (bad.length) return 'บัญชี ' + bad.map(l => l.account).join(', ') + ' ใช้ไม่ได้ (ไม่มีหรือปิดอยู่)';
    if (it.event === 'COST_SUBMITTED'){
      const c = ccGet(it.cc); if (!c || c.active === false) return 'Cost Center ' + it.cc + ' ไม่พร้อมใช้งาน';
      const bv = budgetVerdict(it.cc, String(it.date).slice(0, 7), it.base, it.jeId);
      if (bv.checked && bv.over){

function approve(key, opts){

  if (it.status !== 'PENDING_JE') return { ok:false, error:'รายการนี้ยังไม่พร้อมอนุมัติ (' + (ST[it.status] || {}).label + ')' };
  const e = check(it, !!(opts && opts.ack)); if (e) return { ok:false, error: e.replace(/^NEED_ACK:/, ''), needAck: /^NEED_ACK:/.test(e) };
  const je = getJE(), j = je.find(x => x.id === it.jeId);
  if (j.status === 'PENDING'){ j.status = 'POSTED'; j.postedAt = new Date().toISOString(); j.approvedBy = who(); if (opts && opts.ack) j.budgetAck = who(); setJE(je); }

}
function reject(key, reason){

  const it = find(key); if (!it) return { ok:false, error:'ไม่พบรายการ' };
  if (it.status === 'POSTED') return { ok:false, error:'ลงบัญชีแล้ว — ให้ BD02 ยกเลิกเอกสาร (จะเกิด JE กลับรายการ)' };
  if (['REJECTED','CANCELLED','SUPERSEDED'].indexOf(it.status) >= 0) return { ok:false, error:'รายการนี้ปิดแล้ว' };
  dropPendingJe(it.jeId);
  setSt(key, 'REJECTED', reason, { rejectedBy: who(), rejectedAt: new Date().toISOString() });
  audit('COST_REJECT', { no: it.no, reason }); refreshUI(); sendMaster(); return { ok:true };
}
function finalize(key, ackBy){
  const it = find(key); if (!it) return { ok:false, error:'ไม่พบรายการ' };
  if (it.status === 'POSTED') return { ok:true, already:true };
  const j = getJE().find(x => x.id === it.jeId);
  const it2 = upd(key, x => { x.status = 'POSTED'; x.msg = x.retroShifted ? x.msg : ''; x.postedAt = new Date().toISOString(); x.approvedBy = (j && j.approvedBy) || who(); if (ackBy) x.budgetAckBy = ackBy; });

/* JE ถูก Post จากทางอื่น → ปิดงานให้ครบ · JE ถูกลบ → ติดปัญหา */
function sync(){
  let changed = false;
  inbox().forEach(it => {
    if (it.status === 'PENDING_JE' && it.jeId){
      const j = getJE().find(x => x.id === it.jeId);
      if (j && j.status === 'POSTED'){ finalize(it.key); changed = true; }
      else if (!j){ setSt(it.key, 'BLOCKED', 'ไม่พบ JE ' + it.jeId + ' (ถูกลบ) — กด "ลองใหม่" เพื่อสร้างใหม่', { jeId:'' }); changed = true; }
    }

}

function importFile(text){
  if (typeof text !== 'string' || !text.trim() || text.length > 8 * 1024 * 1024) return { ok:false, error:'ไฟล์ว่างหรือใหญ่เกิน 8 MB' };
  let j; try { j = JSON.parse(text.replace(/^﻿/, ''), (k, v) => k === '__proto__' ? undefined : v); } catch(e){ return { ok:false, error:'อ่านไฟล์ JSON ไม่ได้' }; }
  const items = Array.isArray(j) ? j : (j && Array.isArray(j.outbox) ? j.outbox : (j && j.payload ? [j] : (j && j.contract === CONTRACT ? [{ payload:j }] : null)));
  if (!items) return { ok:false, error:'ไม่ใช่ไฟล์ Outbox ของ BD02 (BD02_cost_outbox_*.json)' };
  if (items.length > 2000) return { ok:false, error:'มีรายการมากเกิน 2000' };
  const out = { ok:true, total:0, imported:0, duplicate:0, rejected:0, errors:[] };
  items.forEach(x => { const p = x && x.payload ? x.payload : x; if (!p) return; out.total++; const r = receive(p, 'file'); if (!r.ok){ out.rejected++; if (out.errors.length < 5) out.errors.push(r.error); } else if (r.duplicate) out.duplicate++; else out.imported++; });
  refreshUI(); return out;
}

}

function report_(period){
  const ccs = ccAll(), rows = ccs.map(c => {
    const b = budInfo(c.code, period), amount = b.has ? b.amount : null, used = r2(b.posted + b.pending);
    return { cc: c.code, name: c.name, group: c.group, tag: c.tag, mode: c.mode, active: c.active !== false, budget: amount, posted: b.posted, pending: b.pending, used, remaining: amount == null ? null : r2(amount - used), pct: amount ? r2(used / amount * 100) : null };
  });
  const tot = rows.reduce((t, r) => { t.budget += r.budget || 0; t.posted += r.posted; t.pending += r.pending; return t; }, { budget:0, posted:0, pending:0 });
  tot.budget = r2(tot.budget); tot.posted = r2(tot.posted); tot.pending = r2(tot.pending); tot.remaining = r2(tot.budget - tot.posted - tot.pending);
  return { period, rows, total: tot };
}

function reportCsv(period){

  rdr.onerror = () => { if (res) res.textContent = 'อ่านไฟล์ไม่สำเร็จ'; }; rdr.readAsText(f[0]);
}

function ui(act, arg){

      case 'filter': UI.filter = arg; render(); break;
      case 'view': viewModal(arg); break;

      case 'remapAsk': remapModal(arg); break;
      case 'remapDo': { const r = remap(arg, v('rmAcc')); if (!r.ok) toast(r.error, 'error'); else closeModal(); render(); break; }
      case 'approve': { const r = approve(arg, { ack: !!(document.getElementById('costAck') || {}).checked }); if (!r.ok) toast(r.error, 'error'); else { toast('อนุมัติและลงบัญชีแล้ว', 'success'); closeModal(); } render(); break; }

      case 'budEdit': budModal(arg); break;
      case 'budSave': { const old = String(arg || '').split('|'); const cc = old[0] || v('bdCc'), per = old[1] || v('bdPer'); const r = !old[0] && (document.getElementById('bdYear') || {}).checked ? budSetYear(cc, String(per).slice(0, 4), v('bdAmt')) : budSet(cc, per, v('bdAmt')); if (!r.ok){ const e = document.getElementById('bdErr'); if (e) e.textContent = r.error; } else { sendMaster(); closeModal(); toast('บันทึกงบประมาณแล้ว', 'success'); render(); } break; }
      case 'budDel': { const p = String(arg).split('|'); if (confirm('ลบงบ ' + p[0] + ' งวด ' + p[1] + ' ?')) { budDel(p[0], p[1]); render(); } break; }
      case 'year': if (/^\d{4}$/.test(arg)) { UI.period = arg + '-' + UI.period.slice(5); render(); } break;
      case 'period': if (/^\d{4}-\d{2}$/.test(arg)) { UI.period = arg; render(); } break;
      case 'csv': download('FA_cost_center_' + UI.period + '.csv', reportCsv(UI.period), 'text/csv;charset=utf-8'); break;
      case 'saveSettings': saveSettings(); break;
      case 'import': importModal(); break;
      case 'doImport': doImport(); break;
      case 'export': download('fa_cost_replies.json', JSON.stringify(repliesObj(), null, 1)); break;
      case 'ready': send('FA_COST_READY', { contract: REPLY, at: new Date().toISOString() }); sendMaster(); toast('ส่งคำขอให้ BD02 ส่งรายการที่ยังไม่ยืนยันซ้ำแล้ว', 'info'); break;
    }
  } catch(e){ console.error('[FA-COST] ui', act, e); toast('เกิดข้อผิดพลาด: ' + e.message, 'error'); }
}
function refreshUI(){ updateBadge(); const p = document.getElementById('page-costcenter'); if (p && !p.classList.contains('hidden')) render(); }

/* ─────────── ติดตั้ง ─────────── */
function install(){
  if (!window.switchPage || !document.getElementById('content-area')){ setTimeout(install, 250); return; }
  if (!Array.isArray(rd(K.CC, null))) ccSave(SEED_CC);   /* ตั้งต้นครั้งแรกเท่านั้น */
  if (!document.getElementById('page-costcenter')){ const p = document.createElement('div'); p.id = 'page-costcenter'; p.className = 'fa-page hidden'; document.getElementById('content-area').appendChild(p); }
  if (!document.querySelector('[data-nav="costcenter"]')){
    const anchor = document.querySelector('[data-nav="cndn"]') || document.querySelector('[data-nav="approvals"]');
    if (anchor){
      const b = document.createElement('button'); b.setAttribute('data-nav', 'costcenter'); b.setAttribute('onclick', "switchPage('costcenter')"); b.className = anchor.className;
      b.innerHTML = '<span class="flex items-center gap-3"><i class="fa-solid fa-sitemap w-5 text-center text-teal-400"></i><span>Cost Center จาก BD02</span></span><span id="navCostBadge" class="px-2 py-0.5 rounded-full bg-slate-700 text-slate-500 text-[10px] font-bold">0</span>';
      anchor.parentNode.insertBefore(b, anchor.nextSibling);
    }
  }
  const orig = window.switchPage;
  if (!orig.__costWrapped){
    const w = function(pageId){
      const r = orig.apply(this, arguments);
      if (pageId === 'costcenter'){ const t = document.getElementById('pageTitle'); if (t) t.innerHTML = '<i class="fa-solid fa-sitemap text-fa-400"></i><span>Cost Center จาก BD02</span>'; sync(); render(); }
      return r;
    };
    w.__costWrapped = true; Object.keys(orig).forEach(k => { try { w[k] = orig[k]; } catch(e){} });
    window.switchPage = w;
  }
  try {
    const bc = new BroadcastChannel(BUS);
    bc.onmessage = ev => {
      const d = ev.data; if (!d || typeof d !== 'object') return;
      /* PR08 ขอ Master (Cost Center/งบ) แบบอ่านอย่างเดียว — รับเฉพาะ BD_COST_HELLO จาก PR08 · ข้อความอื่นรับจาก BD02 เท่านั้น */
      if (d.source === 'PR08') { if (d.type === 'BD_COST_HELLO') sendMaster(); return; }
      if (d.source !== 'BD02') return;
      if (d.type === 'FIN_COST_EVENT' && cfg().receive){ try { const r = receive(d, 'bus'); if (!r.ok) console.warn('[FA-COST] ปฏิเสธข้อความ:', r.error); } catch(e){ console.error('[FA-COST]', e); } }
      else if (d.type === 'BD_COST_HELLO') sendMaster();
    };
  } catch(e){}
  window.addEventListener('storage', e => { if (!e.key || [K.IN, K.CC, K.BUD, 'fa_journal_v1', 'fa_coa_v1'].indexOf(e.key) >= 0){ sync(); refreshUI(); } });
  setInterval(() => { try { if (sync()) refreshUI(); else updateBadge(); } catch(e){} }, 3000);
  updateBadge(); sync();
  send('FA_COST_READY', { contract: REPLY, at: new Date().toISOString() }); sendMaster();
  console.log('%c[FA-COST] ✅ ' + VER + ' ready — รับใบตั้งเบิกจาก BD02 (JE รออนุมัติ + งบ Cost Center)', 'color:#2dd4bf;font-weight:bold;font-size:13px');
}
window.__faCost = {
  version: VER, ui, receive, importFile, inbox, approve, reject, retry, remap, sync, cfg, setCfg, repliesObj, masterPayload, sendMaster,
  ccAll, ccGet, ccUpsert, budAll, budSet, budSetYear, budDel, budInfo, usage, report: report_, reportCsv, budgetVerdict,
  contract: { name: CONTRACT, reply: REPLY }, kinds: KIND_ORDER,
  status: () => ({ items: inbox().length, pending: pendingCount(), cfg: cfg() })
};
install();
})();
</script>
